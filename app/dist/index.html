<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Supercon Progress</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230d366b'/%3E%3Cstop offset='1' stop-color='%233987e5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='72' y='72' width='880' height='880' rx='210' fill='url(%23g)'/%3E%3Cpath d='M250 690H455L478 676 494 630 506 540 518 462 536 432 566 420 790 336' fill='none' stroke='%23fff' stroke-width='60' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --font: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f1f0ec;
  --hover: #ecebe6;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --accent-track: #cde2fb;
  --accent-wash: rgba(42, 120, 214, 0.07);
  --good: #0ca30c;
  --warning: #fab219;
  --critical: #d03b3b;
  --tip-shadow: 0 6px 20px rgba(11, 11, 11, 0.12);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #242422;
    --hover: #2b2b29;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-track: #0d366b;
    --accent-wash: rgba(57, 135, 229, 0.12);
    --tip-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #242422;
  --hover: #2b2b29;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --accent: #3987e5;
  --accent-track: #0d366b;
  --accent-wash: rgba(57, 135, 229, 0.12);
  --tip-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background: var(--page);
  color: var(--ink);
  font: 14px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration-color: var(--axis); text-underline-offset: 2px; }
a:hover { text-decoration-color: currentColor; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
button { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }

.wrap { max-width: 1200px; margin: 0 auto; padding: 20px 24px 28px; }
@media (max-width: 600px) { .wrap { padding: 16px; } }

/* header */
.top { display: flex; align-items: center; flex-wrap: wrap; gap: 12px 16px; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 12px; flex: 1 1 340px; min-width: 0; }
.logo { width: 36px; height: 36px; flex: none; }
.brand h1 { font-size: 17px; font-weight: 600; line-height: 1.3; }
.brand p { font-size: 13px; line-height: 1.35; color: var(--ink-2); }
.controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.stamp { display: inline-flex; align-items: center; gap: 6px; margin-right: 4px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--axis); }
.live-dot.is-live { background: var(--good); }
.live-dot.is-off { background: var(--muted); }
.btn {
  height: 32px; min-width: 32px; padding: 0 10px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); cursor: pointer; font-size: 13px;
}
.btn:hover { background: var(--hover); }
.btn svg { width: 16px; height: 16px; }
.btn.icon-only { padding: 0; width: 32px; }
.btn.small { height: 28px; font-size: 12px; }
.btn.is-busy svg { animation: spin 0.9s linear infinite; }

.notice {
  display: flex; align-items: flex-start; gap: 8px;
  margin-bottom: 16px; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface-2); color: var(--ink-2); font-size: 13px;
}
.notice svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 12px; }
.card-head h2 { font-size: 15px; font-weight: 600; line-height: 1.35; }
.card-head p { margin-top: 2px; font-size: 12.5px; color: var(--ink-2); }
.muted-p { font-size: 13px; color: var(--ink-2); }

/* summary tiles */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
@media (max-width: 760px) { .kpis { grid-template-columns: minmax(0, 1fr); } }

/* animated pipeline */
.pipeline { margin-bottom: 12px; padding-bottom: 8px; }
.pipe-head { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 4px 24px; }
.hero { font-size: 48px; font-weight: 600; line-height: 1; letter-spacing: -0.01em; }
.pipe-meta { padding-bottom: 4px; min-width: 0; }
.pipe-strong { font-size: 14px; font-weight: 600; }
.pipe-meta .tile-sub { margin-top: 2px; }
.pipe { margin-top: 14px; }
.pipe-svg { display: block; overflow: visible; }
.pipe-track { stroke: var(--accent-track); stroke-width: 6; stroke-linecap: round; }
.pipe-fill { stroke: var(--accent); stroke-width: 6; stroke-linecap: round; }
.pipe-comet { fill: #fff; }
.pipe-halo { fill: var(--accent); }
.pipe-label { font-size: 12px; fill: var(--ink-2); }
.pipe-label.is-current { fill: var(--ink); font-weight: 600; }
.pipe-pop { transform-box: fill-box; transform-origin: center; animation: pop 0.55s cubic-bezier(0.2, 0.8, 0.3, 1.35) both; }
@keyframes pop { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .pipe-pop { animation: none; } }
.tile-label { font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.tile-value { font-size: 26px; font-weight: 600; line-height: 1.15; }
.tile-value small { margin-left: 4px; font-size: 14px; font-weight: 500; color: var(--ink-2); }
.tile-value.dim { color: var(--muted); }
.tile-status { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 600; line-height: 30px; }
.tile-status svg { width: 22px; height: 22px; display: block; }
.tile-sub { margin-top: 8px; font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.tile-sub + .tile-sub { margin-top: 2px; }
.tile-sub.muted { color: var(--muted); }

/* layout */
.grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 16px; min-width: 0; }

/* status glyphs */
.f-good { fill: var(--good); }
.f-warning { fill: var(--warning); }
.f-critical { fill: var(--critical); }
.f-accent { fill: var(--accent); }
.f-surface { fill: var(--surface); }
.s-white { stroke: #fff; }
.s-accent { stroke: var(--accent); }
.s-axis { stroke: var(--axis); }
.s-muted { stroke: var(--muted); }
.s-track { stroke: var(--accent-track); }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
.spin { animation: spin 0.9s linear infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .pulse, .spin, .btn.is-busy svg { animation: none; } }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 8px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2);
  font-size: 12px; line-height: 20px; white-space: nowrap;
}
.chip i { width: 8px; height: 8px; border-radius: 50%; }
.d-done, .d-success { background: var(--good); }
.d-active, .d-running, .d-queued { background: var(--accent); }
.d-blocked, .d-attention { background: var(--warning); }
.d-pending { background: var(--axis); }
.d-failure { background: var(--critical); }
.d-cancelled { background: var(--muted); }

/* stages */
.steps { list-style: none; margin: 0; padding: 0; }
.step { position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; padding: 10px 10px 10px 6px; border-radius: 10px; }
.step:not(:last-child)::before { content: ""; position: absolute; left: 17px; top: 36px; bottom: -12px; width: 2px; background: var(--grid); }
.step.is-active { background: var(--accent-wash); }
.step-icon svg { width: 24px; height: 24px; display: block; position: relative; }
.step-head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; min-height: 24px; }
.step-name { font-weight: 600; }
.step-date { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.step-detail { margin-top: 2px; font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }

/* activity */
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.feed li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; }
.feed time { padding-top: 1px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.feed p { font-size: 13px; overflow-wrap: anywhere; }
@media (max-width: 420px) { .feed li { grid-template-columns: minmax(0, 1fr); gap: 0; } }
.link-btn { margin-top: 10px; padding: 0; border: 0; background: none; cursor: pointer; font-size: 12.5px; color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--axis); text-underline-offset: 2px; }
.link-btn:hover { color: var(--ink); }
.head-link { font-size: 12.5px; color: var(--ink-2); }

/* github */
.sub-h { margin: 4px 0 2px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.sub-h + .muted-p { margin: 4px 0 8px; }
.gh-list { list-style: none; margin: 0 0 8px; padding: 0; }
.gh-list li + li { border-top: 1px solid var(--grid); }
.gh-item { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; padding: 8px 0; color: inherit; text-decoration: none; }
.gh-item:hover .gh-title { text-decoration: underline; text-decoration-color: var(--axis); }
.gh-icon svg { width: 18px; height: 18px; display: block; margin-top: 1px; color: var(--muted); }
.gh-text { display: grid; min-width: 0; }
.gh-title { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gh-meta { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sha { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }

/* results */
.figure { margin: 0 0 16px; }
.fig-title { margin-bottom: 8px; font-size: 13px; font-weight: 600; }
.empty { display: flex; align-items: center; gap: 12px; padding: 18px 16px; border-radius: 10px; background: var(--surface-2); color: var(--ink-2); font-size: 13px; }
.empty svg { width: 28px; height: 28px; flex: none; color: var(--muted); }
.chart { position: relative; }
.plot { display: block; overflow: visible; }
.plot:focus { outline: none; }
.plot:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
.plot .grid-line { stroke: var(--grid); stroke-width: 1; }
.plot .axis-line { stroke: var(--axis); stroke-width: 1; }
.plot .ref-line { stroke: var(--ink-2); stroke-width: 1; }
.plot .ref-label { font-size: 11px; fill: var(--ink-2); }
.plot .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.plot .series-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.plot .series-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.plot .hover-dot { fill: none; stroke: var(--accent); stroke-width: 2; }
.plot .crosshair { stroke: var(--axis); stroke-width: 1; }
.plot .end-label { font-size: 12px; font-weight: 600; fill: var(--ink); }
.tooltip {
  position: absolute; z-index: 2; pointer-events: none;
  transform: translate(-50%, calc(-100% - 10px));
  min-width: 140px; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); box-shadow: var(--tip-shadow);
  font-size: 12px; color: var(--ink-2); white-space: nowrap;
}
.tooltip b { display: block; font-size: 14px; color: var(--ink); }
.tip-row { display: block; }
.tip-row .key { display: inline-block; width: 12px; height: 2px; margin-right: 6px; border-radius: 1px; background: var(--accent); vertical-align: middle; }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { padding: 6px 8px; border-bottom: 1px solid var(--axis); text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.tbl td { padding: 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tr.ours td { background: var(--accent-wash); }
.tbl .notes { color: var(--ink-2); }
.tag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--accent-track); color: var(--ink); font-size: 11px; line-height: 18px; white-space: nowrap; }
.note { margin-top: 10px; font-size: 12px; color: var(--muted); }

.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; margin-top: 20px; font-size: 12px; color: var(--muted); }
.foot a { color: var(--ink-2); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 1024 1024" aria-hidden="true">
        <defs>
          <linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0d366b"/>
            <stop offset="1" stop-color="#3987e5"/>
          </linearGradient>
        </defs>
        <rect x="72" y="72" width="880" height="880" rx="210" fill="url(#logo-g)"/>
        <path d="M250 690H455L478 676 494 630 506 540 518 462 536 432 566 420 790 336" fill="none" stroke="#fff" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1 id="app-name">Supercon Progress</h1>
        <p id="project"></p>
      </div>
    </div>
    <div class="controls">
      <span class="stamp"><i id="live-dot" class="live-dot"></i><span id="stamp"></span></span>
      <button id="btn-refresh" class="btn icon-only" type="button"></button>
      <button id="btn-theme" class="btn icon-only" type="button"></button>
    </div>
  </header>

  <div id="notice" class="notice" role="status" hidden></div>

  <main id="main" hidden>
    <section id="pipeline" class="card pipeline"></section>
    <section id="kpis" class="kpis"></section>
    <div class="grid">
      <div class="col">
        <section id="stages-card" class="card"></section>
        <section id="results-card" class="card"></section>
      </div>
      <div class="col">
        <section id="activity-card" class="card"></section>
        <section id="github-card" class="card"></section>
      </div>
    </div>
  </main>

  <footer id="foot" class="foot"></footer>
</div>

<script id="bundled-data" type="application/json"></script>

    var run = list(state.runs)[0];
    if (run) {
      var k = runState(run);
      var when = parseDate(run.run_started_at || run.created_at);
      el.appendChild(tile(t('latestBuild'),
        h('p', { class: 'tile-status' }, glyph(RUN_GLYPH[k], ''), h('span', { text: t('run_' + k) })),
        h('p', { class: 'tile-sub' }, isHttps(run.html_url) ? h('a', { href: run.html_url, text: run.display_title || run.name || '' }) : (run.display_title || run.name || '')),
        h('p', { class: 'tile-sub muted', text: [run.name, when ? rel(when) : ''].filter(Boolean).join(' · ') })));
    } else {
      el.appendChild(tile(t('latestBuild'),
        h('p', { class: 'tile-value dim', text: '—' }),
        h('p', { class: 'tile-sub', text: state.gh ? ghMessage(state.gh) : (state.runs ? t('noRuns') : t('loading')) })));
    }

    var best = bestOurs(d, 'Tc');
    var ref = bestBaseline(d, 'Tc');
    el.appendChild(tile(t('bestTc'),
      best ? h('p', { class: 'tile-value' }, fmtVal(best.mae), h('small', { text: 'K' })) : h('p', { class: 'tile-value dim', text: '—' }),
      h('p', { class: 'tile-sub', text: best ? L(best.model) : t('noModel') }),
      ref ? h('p', { class: 'tile-sub muted', text: t('vsBaseline', { v: fmtVal(ref.mae) + ' K, ' + L(ref.model) }) }) : null));

    var tg = d.target ? parseDate(d.target.date) : null;
    if (tg) {
      var days = daysUntil(tg);
      el.appendChild(tile(t('target'),
        h('p', { class: 'tile-value', text: fmtDay(tg) }),
        h('p', { class: 'tile-sub', text: days > 1 ? t('daysLeft', { n: days }) : days === 1 ? t('dayLeft') : days === 0 ? t('dueToday') : t('overdue', { n: -days }) })));
    }
  }

  function renderStages(d) {
    var el = $('#stages-card');
    clear(el);
    el.appendChild(cardHead(t('stages'), t('stagesSub')));
    var ol = h('ol', { class: 'steps' });
    list(d.stages).forEach(function (st) {
      var status = STAGE_STATUSES.indexOf(st.status) >= 0 ? st.status : 'pending';
      var date = parseDate(st.date);
      var dateText = '';
      if (date) dateText = (status === 'pending' && daysUntil(date) > 0) ? t('targetOn', { d: fmtDay(date) }) : fmtDay(date);
      ol.appendChild(h('li', { class: 'step is-' + status },
        glyph(status, 'step-icon'),
        h('div', null,
          h('div', { class: 'step-head' },
            h('span', { class: 'step-name', text: L(st.name) }),
            chip(status, t('st_' + status)),
            dateText ? h('span', { class: 'step-date', text: dateText }) : null),
          st.detail ? h('p', { class: 'step-detail', text: L(st.detail) }) : null)));
    });
    el.appendChild(ol);
  }

  function renderActivity(d) {
    var el = $('#activity-card');
    clear(el);
    el.appendChild(cardHead(t('activity')));
    var items = list(d.log).map(function (x) { return { at: parseDate(x && x.at), text: L(x && x.event) }; })
      .filter(function (x) { return x.text; })
      .sort(function (a, b) { return (b.at ? b.at.getTime() : 0) - (a.at ? a.at.getTime() : 0); });
    if (!items.length) { el.appendChild(h('p', { class: 'muted-p', text: '—' })); return; }
    var ul = h('ul', { class: 'feed' });
    (state.showAllLog ? items : items.slice(0, LOG_LIMIT)).forEach(function (x) {
      ul.appendChild(h('li', null,
        h('time', { datetime: x.at ? x.at.toISOString() : null, text: x.at ? fmtStamp(x.at) : '' }),
        h('p', { text: x.text })));
    });
    el.appendChild(ul);
    if (items.length > LOG_LIMIT) {
      el.appendChild(h('button', {
        class: 'link-btn', type: 'button',
        text: state.showAllLog ? t('showLess') : t('showAll', { n: items.length }),
        onclick: function () { state.showAllLog = !state.showAllLog; renderActivity(state.data); }
      }));
    }
  }

  function renderGitHub() {
    var el = $('#github-card');
    clear(el);
    el.appendChild(cardHead(t('onGithub'), null, h('a', { class: 'head-link', href: REPO_URL, text: t('openRepo') })));
    var runs = list(state.runs).slice(0, 5);
    var commits = list(state.commits).slice(0, 5);
    if (state.gh && !runs.length && !commits.length) {
      el.appendChild(h('p', { class: 'muted-p', text: ghMessage(state.gh) }));
      return;
    }
    el.appendChild(h('h3', { class: 'sub-h', text: t('runs') }));
    if (!runs.length) el.appendChild(h('p', { class: 'muted-p', text: state.runs ? t('noRuns') : t('loading') }));
    else {
      var ul = h('ul', { class: 'gh-list' });
      runs.forEach(function (r) {
        var k = runState(r);
        var when = parseDate(r.run_started_at || r.created_at);
        var meta = [t('run_' + k), r.name, r.run_number ? '#' + r.run_number : '', when ? rel(when) : ''].filter(Boolean).join(' · ');
        ul.appendChild(h('li', null, h('a', { class: 'gh-item', href: isHttps(r.html_url) ? r.html_url : null },
          glyph(RUN_GLYPH[k], 'gh-icon'),
          h('span', { class: 'gh-text' },
            h('span', { class: 'gh-title', text: r.display_title || r.name || '' }),
            h('span', { class: 'gh-meta', text: meta })))));
      });
      el.appendChild(ul);
    }
    el.appendChild(h('h3', { class: 'sub-h', text: t('commits') }));
    if (!commits.length) el.appendChild(h('p', { class: 'muted-p', text: state.commits ? t('noCommits') : t('loading') }));
    else {
      var cl = h('ul', { class: 'gh-list' });
      commits.forEach(function (c) {
        var info = c && c.commit ? c.commit : {};
        var msg = String(info.message || '').split('\n')[0];
        var when = parseDate(info.author && info.author.date);
        cl.appendChild(h('li', null, h('a', { class: 'gh-item', href: isHttps(c.html_url) ? c.html_url : null },
          glyph('commit', 'gh-icon'),
          h('span', { class: 'gh-text' },
            h('span', { class: 'gh-title', text: msg }),
            h('span', { class: 'gh-meta' }, h('span', { class: 'sha', text: String(c.sha || '').slice(0, 7) }), when ? ' · ' + rel(when) : '')))));
      });
      el.appendChild(cl);
    }
    if (state.gh) el.appendChild(h('p', { class: 'muted-p', text: ghMessage(state.gh) }));
  }

  var chartObserver = null;
  function renderResults(d) {
    var el = $('#results-card');
    clear(el);
    var pts = list(d.history)
      .filter(function (x) { return x && x.target === 'Tc' && typeof x.mae === 'number' && (!x.split || x.split === 'val'); })
      .map(function (x) { return { at: parseDate(x.at), y: x.mae, model: L(x.model) }; })
      .sort(function (a, b) { return (a.at ? a.at.getTime() : 0) - (b.at ? b.at.getTime() : 0); });
    var ref = bestBaseline(d, 'Tc');
    var toggle = pts.length ? h('button', {
      class: 'btn small', type: 'button',
      text: state.view === 'chart' ? t('showTable') : t('showChart'),
      onclick: function () { state.view = state.view === 'chart' ? 'table' : 'chart'; renderResults(state.data); }
    }) : null;
    el.appendChild(cardHead(t('results'), t('resultsSub'), toggle));

    var fig = h('figure', { class: 'figure' }, h('figcaption', { class: 'fig-title', text: t('chartTitle') }));
    if (chartObserver) { chartObserver.disconnect(); chartObserver = null; }
    if (!pts.length) {
      fig.appendChild(h('div', { class: 'empty' }, glyph('chart', ''), h('p', { text: t('chartEmpty') })));
    } else if (state.view === 'table') {
      fig.appendChild(historyTable(pts));
    } else {
      var host = h('div', { class: 'chart' });
      fig.appendChild(host);
      if (window.ResizeObserver) {
        var lastW = 0;
        chartObserver = new ResizeObserver(function (entries) {
          var w = Math.floor(entries[0].contentRect.width);
          if (w && Math.abs(w - lastW) > 4) { lastW = w; drawChart(host, pts, ref); }
        });
        chartObserver.observe(host);
      } else {
        setTimeout(function () { drawChart(host, pts, ref); }, 0);
      }
    }
    el.appendChild(fig);
    el.appendChild(resultsTable(d));
    el.appendChild(h('p', { class: 'note', text: t('baselineNote') }));
  }

  function historyTable(pts) {
    var tb = h('tbody');
    pts.forEach(function (p, i) {
      tb.appendChild(h('tr', null,
        h('td', { class: 'num', text: '#' + (i + 1) }),
        h('td', { text: p.at ? fmtStamp(p.at) : '' }),
        h('td', { text: p.model || t('thisProject') }),
        h('td', { class: 'num', text: fmtVal(p.y) + ' K' })));
    });
    return h('div', { class: 'tbl-wrap' }, h('table', { class: 'tbl' },
      h('thead', null, h('tr', null,
        h('th', { class: 'num', text: t('colRun') }), h('th', { text: t('colDate') }),
        h('th', { text: t('colModel') }), h('th', { class: 'num', text: t('colMae') }))),
      tb));
  }

  function resultsTable(d) {
    var rows = list(d.results).map(function (r) { return { r: r, ours: true }; })
      .concat(list(d.baselines).map(function (r) { return { r: r, ours: false }; }));
    var tb = h('tbody');
    rows.forEach(function (row) {
      var r = row.r || {};
      var unit = r.unit ? ' ' + r.unit : '';
      var note = L(r.note);
      var notes = [note];
      if (r.source) notes.push(note ? ' · ' : '', isHttps(r.link) ? h('a', { href: r.link, text: r.source }) : r.source);
      tb.appendChild(h('tr', { class: row.ours ? 'ours' : null },
        h('td', null, L(r.model), row.ours ? h('span', { class: 'tag', text: t('thisProject') }) : null),
        h('td', null, targetNode(r.target)),
        h('td', { class: 'num', text: typeof r.mae === 'number' ? fmtVal(r.mae) + unit : '—' }),
        h('td', { class: 'notes' }, notes)));
    });
    return h('div', { class: 'tbl-wrap' }, h('table', { class: 'tbl' },
      h('thead', null, h('tr', null,
        h('th', { text: t('colModel') }), h('th', { text: t('colTarget') }),
        h('th', { class: 'num', text: t('colMae') }), h('th', { text: t('colNotes') }))),
      tb));
  }

  function drawChart(host, pts, ref) {
    clear(host);
    var W = Math.max(280, Math.floor(host.getBoundingClientRect().width) || 600);
    var H = 228;
    var m = { t: 12, r: 12, b: 28, l: 40 };
    var pw = W - m.l - m.r;
    var ph = H - m.t - m.b;
    var vals = pts.map(function (p) { return p.y; });
    if (ref) vals.push(ref.mae);
    var top = Math.max.apply(null, vals) * 1.15 || 1;
    var step = niceStep(top, 4);
    var yMax = Math.ceil(top / step) * step;
    var n = pts.length;
    function X(i) { return m.l + (n === 1 ? pw / 2 : i * pw / (n - 1)); }
    function Y(v) { return m.t + ph - v / yMax * ph; }

    var svg = s('svg', {
      viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, class: 'plot', role: 'img', tabindex: '0',
      'aria-label': t('chartTitle') + ': ' + pts.map(function (p) { return fmtVal(p.y) + ' K'; }).join(', ')
    });
    for (var v = 0; v <= yMax + step * 1e-6; v += step) {
      var yy = Math.round(Y(v)) + 0.5;
      svg.appendChild(s('line', { x1: m.l, x2: W - m.r, y1: yy, y2: yy, class: v === 0 ? 'axis-line' : 'grid-line' }));
      svg.appendChild(s('text', { x: m.l - 8, y: yy + 4, 'text-anchor': 'end', class: 'tick' }, fmtTick(v)));
    }
    var ticks = n === 1 ? [0] : n < 6 ? pts.map(function (_, i) { return i; }) : [0, Math.floor((n - 1) / 2), n - 1];
    ticks.forEach(function (i) {
      var anchor = n === 1 ? 'middle' : i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle';
      svg.appendChild(s('text', { x: X(i), y: H - 8, 'text-anchor': anchor, class: 'tick' }, pts[i].at ? fmtDay(pts[i].at) : '#' + (i + 1)));
    });
    var last = n - 1;
    if (ref) {
      var ry = Math.round(Y(ref.mae)) + 0.5;
      var near = Math.abs(Y(pts[last].y) - ry) < 22;
      svg.appendChild(s('line', { x1: m.l, x2: W - m.r, y1: ry, y2: ry, class: 'ref-line' }));
      svg.appendChild(s('text', { x: m.l + 6, y: near ? ry + 15 : ry - 6, class: 'ref-label' }, t('refLabel', { m: L(ref.model), v: fmtVal(ref.mae) + ' K' })));
    }
    if (n > 1) {
      svg.appendChild(s('path', { class: 'series-line', d: pts.map(function (p, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1); }).join(' ') }));
    }
    pts.forEach(function (p, i) { svg.appendChild(s('circle', { cx: X(i), cy: Y(p.y), r: 4, class: 'series-dot' })); });
    svg.appendChild(s('text', {
      x: n === 1 ? X(last) : X(last) - 8, y: Y(pts[last].y) - 10,
      'text-anchor': n === 1 ? 'middle' : 'end', class: 'end-label'
    }, fmtVal(pts[last].y) + ' K'));

    var cross = s('line', { y1: m.t, y2: m.t + ph, class: 'crosshair', visibility: 'hidden' });
    var ring = s('circle', { r: 6.5, class: 'hover-dot', visibility: 'hidden' });
    var hit = s('rect', { x: m.l - 16, y: 0, width: pw + 32, height: m.t + ph + 8, fill: 'transparent' });
    svg.appendChild(cross);
    svg.appendChild(ring);
    svg.appendChild(hit);
    var tip = h('div', { class: 'tooltip', hidden: true });
    host.appendChild(svg);
    host.appendChild(tip);

    var cur = -1;
    function show(i) {
      cur = i;
      var p = pts[i];
      var x = X(i);
      var y = Y(p.y);
      cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('visibility', 'visible');
      ring.setAttribute('cx', x); ring.setAttribute('cy', y); ring.setAttribute('visibility', 'visible');
      clear(tip);
      append(tip, [
        h('b', { text: fmtVal(p.y) + ' K' }),
        h('span', { class: 'tip-row' }, h('i', { class: 'key' }), p.model || t('thisProject')),
        h('span', { class: 'tip-row', text: p.at ? fmtStamp(p.at) : '#' + (i + 1) })
      ]);
      tip.hidden = false;
      tip.style.left = Math.min(Math.max(x, 86), W - 86) + 'px';
      tip.style.top = y + 'px';
    }
    function hide() {
      cur = -1;
      cross.setAttribute('visibility', 'hidden');
      ring.setAttribute('visibility', 'hidden');
      tip.hidden = true;
    }
    function nearest(evt) {
      var box = svg.getBoundingClientRect();
      var px = (evt.clientX - box.left) * (W / box.width);
      var best = 0;
      var bd = Infinity;
      for (var i = 0; i < n; i++) { var dd = Math.abs(X(i) - px); if (dd < bd) { bd = dd; best = i; } }
      return best;
    }
    hit.addEventListener('pointermove', function (e) { show(nearest(e)); });
    hit.addEventListener('pointerleave', hide);
    svg.addEventListener('focus', function () { show(cur >= 0 ? cur : last); });
    svg.addEventListener('blur', hide);
    svg.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') { show(Math.max(0, (cur < 0 ? last : cur) - 1)); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { show(Math.min(last, (cur < 0 ? 0 : cur) + 1)); e.preventDefault(); }
      else if (e.key === 'Escape') hide();
    });
  }

  function render() {
    renderChrome();
    var d = state.data;
    $('#main').hidden = !d;
    if (!d) return;
    renderPipeline(d);
    renderKpis(d);
    renderStages(d);
    renderResults(d);
    renderActivity(d);
    renderGitHub();
  }

  function applyTheme() {
    if (theme === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
  }

  $('#btn-refresh').addEventListener('click', function () { refreshAll(); });
  $('#btn-theme').addEventListener('click', function () {
    theme = theme === 'system' ? 'light' : theme === 'light' ? 'dark' : 'system';
    store.set('theme', theme);
    applyTheme();
    renderChrome();
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && state.checkedAt && Date.now() - state.checkedAt.getTime() > 60 * 1000) refreshAll();
  });

  applyTheme();
  render();
  loadBundled().then(function () { render(); return refreshAll(); });
  setInterval(refreshAll, REFRESH_MS);
  setInterval(function () { if (!state.busy) renderChrome(); }, 60 * 1000);
})();
</script>
</body>
</html>
