<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Supercon Progress</title>
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Supercon">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230d366b'/%3E%3Cstop offset='1' stop-color='%233987e5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='72' y='72' width='880' height='880' rx='210' fill='url(%23g)'/%3E%3Cpath d='M250 690H455L478 676 494 630 506 540 518 462 536 432 566 420 790 336' fill='none' stroke='%23fff' stroke-width='60' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --font: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f1f0ec;
  --hover: #ecebe6;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --accent-track: #cde2fb;
  --accent-wash: rgba(42, 120, 214, 0.07);
  --good: #0ca30c;
  --warning: #fab219;
  --critical: #d03b3b;
  --warm: #eb6834;
  --tip-shadow: 0 6px 20px rgba(11, 11, 11, 0.12);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #242422;
    --hover: #2b2b29;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-track: #0d366b;
    --accent-wash: rgba(57, 135, 229, 0.12);
    --warm: #d95926;
    --tip-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #242422;
  --hover: #2b2b29;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --accent: #3987e5;
  --accent-track: #0d366b;
  --accent-wash: rgba(57, 135, 229, 0.12);
  --warm: #d95926;
  --tip-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background: var(--page);
  color: var(--ink);
  font: 14px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration-color: var(--axis); text-underline-offset: 2px; }
a:hover { text-decoration-color: currentColor; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
button { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }

.wrap { max-width: 1200px; margin: 0 auto; padding: 20px 24px 28px; }
@media (max-width: 600px) { .wrap { padding: 16px; } }

/* header */
.top { display: flex; align-items: center; flex-wrap: wrap; gap: 12px 16px; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 12px; flex: 1 1 340px; min-width: 0; }
.logo { width: 36px; height: 36px; flex: none; }
.brand h1 { font-size: 17px; font-weight: 600; line-height: 1.3; }
.brand p { font-size: 13px; line-height: 1.35; color: var(--ink-2); }
.controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.stamp { display: inline-flex; align-items: center; gap: 6px; margin-right: 4px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--axis); }
.live-dot.is-live { background: var(--good); }
.live-dot.is-off { background: var(--muted); }
.btn {
  height: 32px; min-width: 32px; padding: 0 10px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); cursor: pointer; font-size: 13px;
}
.btn:hover { background: var(--hover); }
.btn svg { width: 16px; height: 16px; }
.btn.icon-only { padding: 0; width: 32px; }
.btn.small { height: 28px; font-size: 12px; }
.btn.is-busy svg { animation: spin 0.9s linear infinite; }

.notice {
  display: flex; align-items: flex-start; gap: 8px;
  margin-bottom: 16px; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface-2); color: var(--ink-2); font-size: 13px;
}
.notice svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 12px; }
.card-head h2 { font-size: 15px; font-weight: 600; line-height: 1.35; }
.card-head p { margin-top: 2px; font-size: 12.5px; color: var(--ink-2); }
.muted-p { font-size: 13px; color: var(--ink-2); }

/* summary tiles */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
@media (max-width: 760px) { .kpis { grid-template-columns: minmax(0, 1fr); } }

/* animated pipeline */
.pipeline { margin-bottom: 12px; padding-bottom: 8px; }
.pipe-head { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 4px 24px; }
.hero { font-size: 48px; font-weight: 600; line-height: 1; letter-spacing: -0.01em; }
.pipe-meta { padding-bottom: 4px; min-width: 0; }
.pipe-strong { font-size: 14px; font-weight: 600; }
.pipe-meta .tile-sub { margin-top: 2px; }
.pipe { margin-top: 14px; }
.pipe-svg { display: block; overflow: visible; }
.pipe-track { stroke: var(--accent-track); stroke-width: 6; stroke-linecap: round; }
.pipe-fill { stroke: var(--accent); stroke-width: 6; stroke-linecap: round; }
.pipe-comet { fill: #fff; }
.pipe-halo { fill: var(--accent); }
.pipe-label { font-size: 12px; fill: var(--ink-2); }
.pipe-label.is-current { fill: var(--ink); font-weight: 600; }
.pipe-pop { transform-box: fill-box; transform-origin: center; animation: pop 0.55s cubic-bezier(0.2, 0.8, 0.3, 1.35) both; }
@keyframes pop { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .pipe-pop { animation: none; } }
.tile-label { font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.tile-value { font-size: 26px; font-weight: 600; line-height: 1.15; }
.tile-value small { margin-left: 4px; font-size: 14px; font-weight: 500; color: var(--ink-2); }
.tile-value.dim { color: var(--muted); }
.tile-status { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 600; line-height: 30px; }
.tile-status svg { width: 22px; height: 22px; display: block; }
.tile-sub { margin-top: 8px; font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.tile-sub + .tile-sub { margin-top: 2px; }
.tile-sub.muted { color: var(--muted); }

/* layout */
.grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 16px; min-width: 0; }

/* status glyphs */
.f-good { fill: var(--good); }
.f-warning { fill: var(--warning); }
.f-critical { fill: var(--critical); }
.f-accent { fill: var(--accent); }
.f-surface { fill: var(--surface); }
.s-white { stroke: #fff; }
.s-accent { stroke: var(--accent); }
.s-axis { stroke: var(--axis); }
.s-muted { stroke: var(--muted); }
.s-track { stroke: var(--accent-track); }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
.spin { animation: spin 0.9s linear infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .pulse, .spin, .btn.is-busy svg { animation: none; } }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 8px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2);
  font-size: 12px; line-height: 20px; white-space: nowrap;
}
.chip i { width: 8px; height: 8px; border-radius: 50%; }
.d-done, .d-success { background: var(--good); }
.d-active, .d-running, .d-queued { background: var(--accent); }
.d-blocked, .d-attention { background: var(--warning); }
.d-pending { background: var(--axis); }
.d-failure { background: var(--critical); }
.d-cancelled { background: var(--muted); }

/* stages */
.steps { list-style: none; margin: 0; padding: 0; }
.step { position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; padding: 10px 10px 10px 6px; border-radius: 10px; }
.step:not(:last-child)::before { content: ""; position: absolute; left: 17px; top: 36px; bottom: -12px; width: 2px; background: var(--grid); }
.step.is-active { background: var(--accent-wash); }
.step-icon svg { width: 24px; height: 24px; display: block; position: relative; }
.step-head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; min-height: 24px; }
.step-name { font-weight: 600; }
.step-date { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.step-detail { margin-top: 2px; font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }

/* activity */
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.feed li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; }
.feed time { padding-top: 1px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.feed p { font-size: 13px; overflow-wrap: anywhere; }
@media (max-width: 420px) { .feed li { grid-template-columns: minmax(0, 1fr); gap: 0; } }
.link-btn { margin-top: 10px; padding: 0; border: 0; background: none; cursor: pointer; font-size: 12.5px; color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--axis); text-underline-offset: 2px; }
.link-btn:hover { color: var(--ink); }
.head-link { font-size: 12.5px; color: var(--ink-2); }

/* github */
.sub-h { margin: 4px 0 2px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.sub-h + .muted-p { margin: 4px 0 8px; }
.gh-list { list-style: none; margin: 0 0 8px; padding: 0; }
.gh-list li + li { border-top: 1px solid var(--grid); }
.gh-item { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; padding: 8px 0; color: inherit; text-decoration: none; }
.gh-item:hover .gh-title { text-decoration: underline; text-decoration-color: var(--axis); }
.gh-icon svg { width: 18px; height: 18px; display: block; margin-top: 1px; color: var(--muted); }
.gh-text { display: grid; min-width: 0; }
.gh-title { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gh-meta { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sha { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }

/* results */
.figure { margin: 0 0 16px; }
.fig-title { margin-bottom: 8px; font-size: 13px; font-weight: 600; }
.empty { display: flex; align-items: center; gap: 12px; padding: 18px 16px; border-radius: 10px; background: var(--surface-2); color: var(--ink-2); font-size: 13px; }
.empty svg { width: 28px; height: 28px; flex: none; color: var(--muted); }
.chart { position: relative; }
.plot { display: block; overflow: visible; }
.plot:focus { outline: none; }
.plot:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
.plot .grid-line { stroke: var(--grid); stroke-width: 1; }
.plot .axis-line { stroke: var(--axis); stroke-width: 1; }
.plot .ref-line { stroke: var(--ink-2); stroke-width: 1; }
.plot .ref-label { font-size: 11px; fill: var(--ink-2); }
.plot .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.plot .series-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.plot .series-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.plot .hover-dot { fill: none; stroke: var(--accent); stroke-width: 2; }
.plot .crosshair { stroke: var(--axis); stroke-width: 1; }
.plot .end-label { font-size: 12px; font-weight: 600; fill: var(--ink); }
.tooltip {
  position: absolute; z-index: 2; pointer-events: none;
  transform: translate(-50%, calc(-100% - 10px));
  min-width: 140px; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); box-shadow: var(--tip-shadow);
  font-size: 12px; color: var(--ink-2); white-space: nowrap;
}
.tooltip b { display: block; font-size: 14px; color: var(--ink); }
.tip-row { display: block; }
.tip-row .key { display: inline-block; width: 12px; height: 2px; margin-right: 6px; border-radius: 1px; background: var(--accent); vertical-align: middle; }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { padding: 6px 8px; border-bottom: 1px solid var(--axis); text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.tbl td { padding: 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tr.ours td { background: var(--accent-wash); }
.tbl .notes { color: var(--ink-2); }
.tag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--accent-track); color: var(--ink); font-size: 11px; line-height: 18px; white-space: nowrap; }
.note { margin-top: 10px; font-size: 12px; color: var(--muted); }

/* view switch and physics demos */
.views { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); }
.views button { padding: 5px 12px; border: 0; border-radius: 7px; background: none; color: var(--ink-2); font-size: 13px; cursor: pointer; }
.views button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(11, 11, 11, 0.08); }
.demos { margin-bottom: 12px; }
.demo-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.demo-tab { padding: 5px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--ink-2); font-size: 13px; cursor: pointer; }
.demo-tab:hover { background: var(--hover); }
.demo-tab[aria-selected="true"] { border-color: var(--ink); background: var(--ink); color: var(--surface); }
.demo-stage { overflow: hidden; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.demo-stage canvas { display: block; width: 100%; }
.demo-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-top: 12px; }
.slider { display: flex; flex: 1 1 240px; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }
.slider input[type="range"] { flex: 1; min-width: 120px; accent-color: var(--accent); }
.slider output { min-width: 62px; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.demo-readout { color: var(--ink); font-size: 13px; font-weight: 600; }
.demo-caption { max-width: 860px; margin-top: 12px; color: var(--ink-2); font-size: 13.5px; line-height: 1.6; }

.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; margin-top: 20px; font-size: 12px; color: var(--muted); }
.foot a { color: var(--ink-2); }

/* v0.2: tour, model, theory & materials, phone */
:root { --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; }
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) { --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; } }
:root[data-theme="dark"] { --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; }
.views .lbl-short { display: none; }
@media (max-width: 640px) { .views .lbl-long { display: none; } .views .lbl-short { display: inline; } }
.hs-accent { color: var(--accent); }
.demo-caption sub, .lcard sub, .zoo sub, .tc-tip sub, .tbl sub, .card-head sub { font-size: 0.72em; }
.demo-refs { max-width: 860px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.refs-title { display: block; font-weight: 600; color: var(--ink-2); }
.refs { margin: 4px 0 0; padding-left: 20px; font-size: 11.5px; color: var(--muted); }
.refs li { margin: 2px 0; line-height: 1.45; }
.refs a { color: var(--ink-2); }
.seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); }
.seg button { padding: 4px 12px; border: 0; border-radius: 7px; background: none; color: var(--ink-2); font-size: 13px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(11, 11, 11, 0.08); }
.zoo { max-width: 860px; margin-top: 14px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); }
.zoo h3 { font-size: 13.5px; font-weight: 600; margin-bottom: 6px; }
.zoo-list { list-style: none; margin: 0; padding: 0; }
.zoo-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto 112px; align-items: center; gap: 4px 12px; padding: 7px 0; border-top: 1px solid var(--border); }
.zoo-list li:first-child { border-top: 0; }
.zoo-name { display: flex; flex-direction: column; min-width: 0; font-size: 13px; }
.zoo-name span { color: var(--muted); font-size: 12px; }
.zoo-score { font-size: 12.5px; font-weight: 600; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
.zoo-ai { margin-top: 10px; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
@media (max-width: 520px) { .zoo-list li { grid-template-columns: minmax(0, 1fr) auto; } .zoo-score { grid-column: 1 / -1; text-align: left; } }
.learn { display: flex; flex-direction: column; gap: 16px; margin-bottom: 12px; }
.learn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.lcard { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.lcard-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.lcard h3 { font-size: 14.5px; font-weight: 600; line-height: 1.35; }
.lcard .meta { font-size: 12px; color: var(--muted); }
.lcard .meta b { color: var(--ink-2); font-weight: 600; }
.lcard > p:not(.meta) { font-size: 13px; line-height: 1.55; color: var(--ink-2); }
.lcard .refs { margin-top: 2px; }
.lcard .go { align-self: flex-start; margin-top: 4px; }
.fam-filter { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.fam-filter button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--surface); }
.learn-note { margin: 0 2px; }
.tc-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 8px; font-size: 12px; color: var(--ink-2); }
.tc-legend .lg { display: inline-flex; align-items: center; gap: 6px; }
.tc-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.tc-legend i.lg-ring { border: 2px solid var(--ink-2); background: var(--surface); }
.tc-legend i.lg-step { width: 16px; height: 2px; border-radius: 1px; background: var(--ink-2); }
i.fam-1, .key.fam-1 { background: var(--series-1); }
i.fam-2, .key.fam-2 { background: var(--series-2); }
i.fam-3, .key.fam-3 { background: var(--series-3); }
.tip-row .key.fam-1, .tip-row .key.fam-2, .tip-row .key.fam-3 { width: 8px; height: 8px; border-radius: 50%; }
.plot .tc-dot { stroke: var(--surface); stroke-width: 2; }
.plot .tc-dot.fam-1 { fill: var(--series-1); }

  function resistanceOf(t) {

  function solveFieldLine(x, cval, re) {
    if (re < 0.5) return cval;
    var lo = Math.sqrt(Math.max(re * re - x * x, 0)), hi = cval + re;
    for (var i = 0; i < 30; i++) {
      var mid = (lo + hi) / 2;
      var g = mid * (1 - re * re / (x * x + mid * mid));
      if (g < cval) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  }

  function drawMeissner(c, C, dt) {
    var W = demo.W, H = demo.H, t = demo.t, s = Math.min(1, gapRatio(t) * 1.6);

    var re = a * Math.sqrt(s);

    if (demo.fieldKey !== key) {
      demo.fieldKey = key;
      demo.field = [];
      var spacing = Math.max(18, Math.round(H / 16));
      for (var k = 1; k * spacing < H / 2 + spacing; k++) {
        var cval = k * spacing - spacing / 2;
        var top = [], bottom = [];
        for (var x = -W / 2 - 8; x <= W / 2 + 8; x += 4) {
          var y = solveFieldLine(x, cval, re);

    }
    c.save();
    c.beginPath();
    c.rect(0, 0, W, band);

    c.fillStyle = mix(C.surface2, C.track, s);

    c.lineWidth = 1; c.strokeStyle = C.axis; c.stroke();

      c.stroke();

      var rr = 5 + 4 * s;
      [[cx, cy - a, 'in'], [cx, cy + a, 'out'], [cx - a * 0.71, cy - a * 0.71, 'in'], [cx + a * 0.71, cy - a * 0.71, 'in'], [cx - a * 0.71, cy + a * 0.71, 'out'], [cx + a * 0.71, cy + a * 0.71, 'out']].forEach(function (m) {

    label(c, C, 'Magnetic field →', 16, H - 11, { size: 12, color: C.muted });
    label(c, C, stateText(s) + ' · ' + what, W - 16, H - 11, { align: 'right', size: 12, weight: '600', color: C.ink });

  }

  function drawPairs(c, C, dt) {
    var W = demo.W, H = demo.H, t = demo.t, s = gapRatio(t);
    var d = 34, top = 14, regionH = Math.round(H * 0.6);
    var rows = Math.max(3, Math.floor(regionH / d)), cols = Math.ceil(W / d) + 1;
    var key = [W, H].join(':');
    if (!demo.ions || demo.sizeKey !== key) {
      demo.sizeKey = key;
      demo.ions = [];
      for (var r = 0; r < rows; r++) for (var k = 0; k < cols; k++) demo.ions.push({ x0: (k + 0.5) * d, y0: top + (r + 0.5) * d, ux: 0, uy: 0 });
      var lane = top + Math.floor(rows / 2) * d;
      demo.e1 = { x: W * 0.55, y: lane };
      demo.e2 = { x: W * 0.55 - 2.6 * d, y: lane, vx: 30, vy: 0 };
    }
    var e1 = demo.e1, e2 = demo.e2, laneY = e1.y;
    e1.x += 70 * dt;
    if (e1.x > W + 40) { e1.x -= W + 80; e2.x -= W + 80; }
    var pullR2 = (2.3 * d) * (2.3 * d), sig2 = 2 * (0.9 * d) * (0.9 * d);
    demo.ions.forEach(function (ion) {
      var dx = e1.x - ion.x0, dy = e1.y - ion.y0, r2 = dx * dx + dy * dy;
      if (r2 < pullR2 && r2 > 1) {
        var f = 160 * Math.exp(-r2 / sig2) / Math.sqrt(r2);

      }
      ion.ux -= ion.ux * dt * 0.8; ion.uy -= ion.uy * dt * 0.8;
      var u = Math.hypot(ion.ux, ion.uy);
      if (u > 9) { ion.ux *= 9 / u; ion.uy *= 9 / u; }
    });
    var target = { x: e1.x - 2.6 * d, y: laneY + 4 * Math.sin(demo.clock * 3) };
    if (dt && Math.random() < (1 - s) * 3 * dt) {
      var ang = Math.random() * Math.PI * 2;
      e2.vx = 70 * Math.cos(ang) + 20; e2.vy = 70 * Math.sin(ang);
    }
    var free = { x: e2.vx * dt, y: e2.vy * dt };
    var paired = { x: (target.x - e2.x) * Math.min(1, dt * 2.5), y: (target.y - e2.y) * Math.min(1, dt * 2.5) };

    e2.y += (1 - s) * free.y + s * paired.y;

      c.beginPath(); c.moveTo(e2.x, e2.y - 8); c.quadraticCurveTo(midx, midy, e1.x, e1.y - 8); c.stroke();
      c.setLineDash([]);

      var tw = c.measureText('Cooper pair').width;
      c.fillStyle = C.surface;
      c.beginPath();
      if (c.roundRect) c.roundRect(midx - tw / 2 - 6, midy - 19, tw + 12, 20, 6); else c.rect(midx - tw / 2 - 6, midy - 19, tw + 12, 20);
      c.fill();

      c.globalAlpha = 1;

    [e2, e1].forEach(function (e) {
      dot(c, e.x, e.y, 6.5, C.accent, C.surface);
      c.strokeStyle = C.surface; c.lineWidth = 1.6; c.beginPath(); c.moveTo(e.x - 3, e.y); c.lineTo(e.x + 3, e.y); c.stroke();

      s > 0 ? 'Δ = ' + s.toFixed(2) + ' Δ₀' : 'No gap');

    { title: 'Hello Super', bare: true, dur: 6, draw: drawStoryIntro,
      caption: 'Hello Super is an open project that uses machine learning to predict the critical temperature Tc of superconductors from their crystal structure, to screen materials databases for high-Tc candidates, and to look for clues about what drives superconductivity. This 90-second tour walks through the idea in nine steps.',
      refs: [] },
    { title: 'Why it matters', dur: 10, draw: drawStoryWhy,
      sub: 'Zero resistance, but only when cold enough. Can we find warmer superconductors?',
      caption: 'A superconductor carries electric current with no resistance at all, but only below its critical temperature Tc. Most need liquid helium (4.2 K). Copper-oxide "cuprates" work in liquid nitrogen (77 K); their ambient-pressure record of 133 K stood from 1993 until 2026, when a pressure-quenched Hg-1223 sample kept superconductivity up to 151 K. Hydrides reach about 250 K, but only when squeezed to 1.7 million atmospheres, and a 2025 preprint reports signs of superconductivity near room temperature in LaSc₂H₂₄ at over 2 million atmospheres. A superconductor that works warm, at everyday pressure, could carry power without loss and make MRI scanners and strong magnets far cheaper to run.',
      refs: ['onnes1911', 'bednorz1986', 'schilling1993', 'deng2026', 'drozdov2019', 'song2025'] },
    { title: 'What sets Tc', dur: 9, draw: drawStoryPhysics,
      sub: 'Electrons pair up through lattice vibrations; λ and ω_log decide how high Tc goes.',
      caption: 'In conventional superconductors a moving electron pulls the positive ions toward it and leaves a wake that attracts a second electron, binding the two into a Cooper pair (BCS theory). The strength of this electron–phonon coupling is λ, and ω_log is a typical vibration energy of the lattice. Eliashberg theory and the Allen–Dynes formula turn the two into Tc: here, raising λ from 0.3 to 1.0 at ω_log = 300 K lifts Tc from about 0.1 K to about 21 K.',
      refs: ['bcs1957', 'eliashberg1960', 'allendynes1975'] },
    { title: 'The slow way', dur: 9, draw: drawStorySlow,

      append(tip, [
        h('b', { text: p.d.n }),
        richText(h('span', { class: 'tip-row' }), 'Tc ' + p.d.tc + ' K · ' + p.d.y + (p.d.p ? ' · high pressure' : '')),
        h('span', { class: 'tip-row' }, h('i', { class: 'key ' + FAMILIES[p.d.f].cls }), FAMILIES[p.d.f].label),
        p.d.note ? richText(h('span', { class: 'tip-row' }), p.d.note) : null,
        r ? h('span', { class: 'tip-row tip-ref', text: r.t }) : null
      ]);
      tip.hidden = false;
      var tw = Math.min(260, W - 16);
      tip.style.maxWidth = tw + 'px';
      tip.style.left = Math.min(Math.max(p.x, tw / 2 + 4), W - tw / 2 - 4) + 'px';
      tip.style.top = (p.y < 120 ? p.y + 150 : p.y) + 'px';
    }
    function hide() { cur = -1; ring.setAttribute('visibility', 'hidden'); tip.hidden = true; }
    function nearest(evt) {
      var box = svg.getBoundingClientRect();
      var px = (evt.clientX - box.left) * (W / box.width), py = (evt.clientY - box.top) * (Hh / box.height);
      var best = null, bd = 28 * 28;
      pts.forEach(function (p) { var dd = (p.x - px) * (p.x - px) + (p.y - py) * (p.y - py); if (dd < bd) { bd = dd; best = p; } });
      return best;
    }
    svg.addEventListener('pointermove', function (e) { var p = nearest(e); if (p) show(p); else hide(); });
    svg.addEventListener('pointerdown', function (e) { var p = nearest(e); if (p) show(p); else hide(); });
    svg.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') hide(); });
    svg.addEventListener('blur', hide);
    svg.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') { show(order[Math.min(order.length - 1, cur + 1)]); e.preventDefault(); }
      else if (e.key === 'ArrowLeft') { show(order[Math.max(0, cur < 0 ? 0 : cur - 1)]); e.preventDefault(); }
      else if (e.key === 'Escape') hide();
    });
  }

  /* ---------- phone link and installable web app ---------- */
  var PHONE_URL = 'https://diracmagic.github.io/supercon-ml/';
  var QR = { n: 29, hex: 'feca23fc1445d06eb70ebb74ef85dbac6d2ec1292507faaaafe00aa3009fcbc4bac0b98db4d649297b87fb91ab13b0e62df1fe7c9d40ac2046d5765f1846a4a985b3b87db3920818cf25d5ff0043b463fb766b10578b13bac53fd5d7ff606e94576f04330ddfe999a80' };
  function qrSvg() {
    var n = QR.n, pad = 3, size = n + 2 * pad, bits = '';
    for (var i = 0; i < QR.hex.length; i++) bits += ('000' + parseInt(QR.hex[i], 16).toString(2)).slice(-4);
    var d = '';
    for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) if (bits[y * n + x] === '1') d += 'M' + (x + pad) + ' ' + (y + pad) + 'h1v1h-1z';
    var svg = s('svg', { class: 'qr', viewBox: '0 0 ' + size + ' ' + size, role: 'img', 'aria-label': 'QR code for ' + PHONE_URL, 'shape-rendering': 'crispEdges' });
    svg.appendChild(s('rect', { width: size, height: size, rx: 2, fill: '#ffffff' }));
    svg.appendChild(s('path', { d: d, fill: '#0b0b0b' }));
    return svg;
  }
  function renderPhoneCard() {
    var el = $('#phone-card');
    if (!el) return;
    clear(el);
    append(el, [
      h('div', { class: 'card-head' }, h('div', null, h('h2', { text: 'On your phone or iPad' }),
        h('p', { text: 'Scan to follow the live progress on any phone or tablet.' }))),
      h('div', { class: 'phone-row' }, qrSvg(),
        h('div', null,
          h('p', null, h('a', { href: PHONE_URL, text: 'diracmagic.github.io/supercon-ml' })),
          h('p', { class: 'note', text: 'iPhone and iPad: Share → Add to Home Screen. Android: menu → Install app. It opens full screen like an app and refreshes on its own.' })))
    ]);
  }
  (function registerWorker() {
    if (!('serviceWorker' in navigator) || location.protocol !== 'https:' || window.__TAURI_INTERNALS__ || window.__TAURI__) return;
    navigator.serviceWorker.register('sw.js').catch(function () { /* offline support is optional */ });
  })();

  function setView(v) {
    view = v;
    store.set('view', v);
    $('#view-progress').setAttribute('aria-selected', v === 'progress' ? 'true' : 'false');
    $('#view-demos').setAttribute('aria-selected', v === 'demos' ? 'true' : 'false');
    $('#view-learn').setAttribute('aria-selected', v === 'learn' ? 'true' : 'false');
    $('#demos').hidden = v !== 'demos';
    $('#learn').hidden = v !== 'learn';
    $('#main').hidden = v !== 'progress' || !state.data;
    if (v === 'demos') {
      if (!demo.built) buildDemos();
      else syncControls();
      sizeCanvas();
      kick();
    }
    if (v === 'learn' && !learn.built) buildLearn();
  }

  function render() {
    renderChrome();
    var d = state.data;
    $('#main').hidden = !d || view !== 'progress';
    if (!d) return;
    renderPipeline(d);
    renderKpis(d);
    renderStages(d);
    renderResults(d);
    renderActivity(d);
    renderGitHub();
  }

  function applyTheme() {
    if (theme === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
  }

  $('#btn-refresh').addEventListener('click', function () { refreshAll(); });
  $('#btn-theme').addEventListener('click', function () {
    theme = theme === 'system' ? 'light' : theme === 'light' ? 'dark' : 'system';
    store.set('theme', theme);
    applyTheme();
    renderChrome();
    kick();
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && state.checkedAt && Date.now() - state.checkedAt.getTime() > 60 * 1000) refreshAll();
  });

  $('#view-progress').addEventListener('click', function () { setView('progress'); });
  $('#view-demos').addEventListener('click', function () { setView('demos'); });
  $('#view-learn').addEventListener('click', function () { setView('learn'); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) kick(); });

  applyTheme();
  render();
  renderPhoneCard();
  setView(view);
  loadBundled().then(function () { render(); return refreshAll(); });
  setInterval(refreshAll, REFRESH_MS);
  setInterval(function () { if (!state.busy) renderChrome(); }, 60 * 1000);
})();
</script>
</body>
</html>
