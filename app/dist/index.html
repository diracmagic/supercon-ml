<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Supercon Progress</title>
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Supercon">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230d366b'/%3E%3Cstop offset='1' stop-color='%233987e5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='72' y='72' width='880' height='880' rx='210' fill='url(%23g)'/%3E%3Cpath d='M250 690H455L478 676 494 630 506 540 518 462 536 432 566 420 790 336' fill='none' stroke='%23fff' stroke-width='60' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --font: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f1f0ec;
  --hover: #ecebe6;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --accent-track: #cde2fb;
  --accent-wash: rgba(42, 120, 214, 0.07);
  --good: #0ca30c;
  --warning: #fab219;
  --critical: #d03b3b;
  --warm: #eb6834;
  --tip-shadow: 0 6px 20px rgba(11, 11, 11, 0.12);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #242422;
    --hover: #2b2b29;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-track: #0d366b;
    --accent-wash: rgba(57, 135, 229, 0.12);
    --warm: #d95926;
    --tip-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #242422;
  --hover: #2b2b29;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --accent: #3987e5;
  --accent-track: #0d366b;
  --accent-wash: rgba(57, 135, 229, 0.12);
  --warm: #d95926;
  --tip-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background: var(--page);
  color: var(--ink);
  font: 14px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration-color: var(--axis); text-underline-offset: 2px; }
a:hover { text-decoration-color: currentColor; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
button { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }

.wrap { max-width: 1200px; margin: 0 auto; padding: 20px 24px 28px; }
@media (max-width: 600px) { .wrap { padding: 16px; } }

/* header */
.top { display: flex; align-items: center; flex-wrap: wrap; gap: 12px 16px; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 12px; flex: 1 1 340px; min-width: 0; }
.logo { width: 36px; height: 36px; flex: none; }
.brand h1 { font-size: 17px; font-weight: 600; line-height: 1.3; }
.brand p { font-size: 13px; line-height: 1.35; color: var(--ink-2); }
.controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.stamp { display: inline-flex; align-items: center; gap: 6px; margin-right: 4px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--axis); }
.live-dot.is-live { background: var(--good); }
.live-dot.is-off { background: var(--muted); }
.btn {
  height: 32px; min-width: 32px; padding: 0 10px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); cursor: pointer; font-size: 13px;
}
.btn:hover { background: var(--hover); }
.btn svg { width: 16px; height: 16px; }
.btn.icon-only { padding: 0; width: 32px; }
.btn.small { height: 28px; font-size: 12px; }
.btn.is-busy svg { animation: spin 0.9s linear infinite; }

.notice {
  display: flex; align-items: flex-start; gap: 8px;
  margin-bottom: 16px; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface-2); color: var(--ink-2); font-size: 13px;
}
.notice svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 12px; }
.card-head h2 { font-size: 15px; font-weight: 600; line-height: 1.35; }
.card-head p { margin-top: 2px; font-size: 12.5px; color: var(--ink-2); }
.muted-p { font-size: 13px; color: var(--ink-2); }

/* summary tiles */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
@media (max-width: 760px) { .kpis { grid-template-columns: minmax(0, 1fr); } }

/* animated pipeline */
.pipeline { margin-bottom: 12px; padding-bottom: 8px; }
.pipe-head { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 4px 24px; }
.hero { font-size: 48px; font-weight: 600; line-height: 1; letter-spacing: -0.01em; }
.pipe-meta { padding-bottom: 4px; min-width: 0; }
.pipe-strong { font-size: 14px; font-weight: 600; }
.pipe-meta .tile-sub { margin-top: 2px; }
.pipe { margin-top: 14px; }
.pipe-svg { display: block; overflow: visible; }
.pipe-track { stroke: var(--accent-track); stroke-width: 6; stroke-linecap: round; }
.pipe-fill { stroke: var(--accent); stroke-width: 6; stroke-linecap: round; }
.pipe-comet { fill: #fff; }
.pipe-halo { fill: var(--accent); }
.pipe-label { font-size: 12px; fill: var(--ink-2); }
.pipe-label.is-current { fill: var(--ink); font-weight: 600; }
.pipe-pop { transform-box: fill-box; transform-origin: center; animation: pop 0.55s cubic-bezier(0.2, 0.8, 0.3, 1.35) both; }
@keyframes pop { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .pipe-pop { animation: none; } }
.tile-label { font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.tile-value { font-size: 26px; font-weight: 600; line-height: 1.15; }
.tile-value small { margin-left: 4px; font-size: 14px; font-weight: 500; color: var(--ink-2); }
.tile-value.dim { color: var(--muted); }
.tile-status { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 600; line-height: 30px; }
.tile-status svg { width: 22px; height: 22px; display: block; }
.tile-sub { margin-top: 8px; font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.tile-sub + .tile-sub { margin-top: 2px; }
.tile-sub.muted { color: var(--muted); }

/* layout */
.grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 16px; min-width: 0; }

/* status glyphs */
.f-good { fill: var(--good); }
.f-warning { fill: var(--warning); }
.f-critical { fill: var(--critical); }
.f-accent { fill: var(--accent); }
.f-surface { fill: var(--surface); }
.s-white { stroke: #fff; }
.s-accent { stroke: var(--accent); }
.s-axis { stroke: var(--axis); }
.s-muted { stroke: var(--muted); }
.s-track { stroke: var(--accent-track); }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
.spin { animation: spin 0.9s linear infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .pulse, .spin, .btn.is-busy svg { animation: none; } }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 8px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2);
  font-size: 12px; line-height: 20px; white-space: nowrap;
}
.chip i { width: 8px; height: 8px; border-radius: 50%; }
.d-done, .d-success { background: var(--good); }
.d-active, .d-running, .d-queued { background: var(--accent); }
.d-blocked, .d-attention { background: var(--warning); }
.d-pending { background: var(--axis); }
.d-failure { background: var(--critical); }
.d-cancelled { background: var(--muted); }

/* stages */
.steps { list-style: none; margin: 0; padding: 0; }
.step { position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; padding: 10px 10px 10px 6px; border-radius: 10px; }
.step:not(:last-child)::before { content: ""; position: absolute; left: 17px; top: 36px; bottom: -12px; width: 2px; background: var(--grid); }
.step.is-active { background: var(--accent-wash); }
.step-icon svg { width: 24px; height: 24px; display: block; position: relative; }
.step-head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; min-height: 24px; }
.step-name { font-weight: 600; }
.step-date { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.step-detail { margin-top: 2px; font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }

/* activity */
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.feed li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; }
.feed time { padding-top: 1px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.feed p { font-size: 13px; overflow-wrap: anywhere; }
@media (max-width: 420px) { .feed li { grid-template-columns: minmax(0, 1fr); gap: 0; } }
.link-btn { margin-top: 10px; padding: 0; border: 0; background: none; cursor: pointer; font-size: 12.5px; color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--axis); text-underline-offset: 2px; }
.link-btn:hover { color: var(--ink); }
.head-link { font-size: 12.5px; color: var(--ink-2); }

/* github */
.sub-h { margin: 4px 0 2px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.sub-h + .muted-p { margin: 4px 0 8px; }
.gh-list { list-style: none; margin: 0 0 8px; padding: 0; }
.gh-list li + li { border-top: 1px solid var(--grid); }
.gh-item { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; padding: 8px 0; color: inherit; text-decoration: none; }
.gh-item:hover .gh-title { text-decoration: underline; text-decoration-color: var(--axis); }
.gh-icon svg { width: 18px; height: 18px; display: block; margin-top: 1px; color: var(--muted); }
.gh-text { display: grid; min-width: 0; }
.gh-title { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gh-meta { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sha { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }

/* results */
.figure { margin: 0 0 16px; }
.fig-title { margin-bottom: 8px; font-size: 13px; font-weight: 600; }
.empty { display: flex; align-items: center; gap: 12px; padding: 18px 16px; border-radius: 10px; background: var(--surface-2); color: var(--ink-2); font-size: 13px; }
.empty svg { width: 28px; height: 28px; flex: none; color: var(--muted); }
.chart { position: relative; }
.plot { display: block; overflow: visible; }
.plot:focus { outline: none; }
.plot:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
.plot .grid-line { stroke: var(--grid); stroke-width: 1; }
.plot .axis-line { stroke: var(--axis); stroke-width: 1; }
.plot .ref-line { stroke: var(--ink-2); stroke-width: 1; }
.plot .ref-label { font-size: 11px; fill: var(--ink-2); }
.plot .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.plot .series-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.plot .series-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.plot .hover-dot { fill: none; stroke: var(--accent); stroke-width: 2; }
.plot .crosshair { stroke: var(--axis); stroke-width: 1; }
.plot .end-label { font-size: 12px; font-weight: 600; fill: var(--ink); }
.tooltip {
  position: absolute; z-index: 2; pointer-events: none;
  transform: translate(-50%, calc(-100% - 10px));
  min-width: 140px; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); box-shadow: var(--tip-shadow);
  font-size: 12px; color: var(--ink-2); white-space: nowrap;
}
.tooltip b { display: block; font-size: 14px; color: var(--ink); }
.tip-row { display: block; }
.tip-row .key { display: inline-block; width: 12px; height: 2px; margin-right: 6px; border-radius: 1px; background: var(--accent); vertical-align: middle; }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { padding: 6px 8px; border-bottom: 1px solid var(--axis); text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.tbl td { padding: 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tr.ours td { background: var(--accent-wash); }
.tbl .notes { color: var(--ink-2); }
.tag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--accent-track); color: var(--ink); font-size: 11px; line-height: 18px; white-space: nowrap; }
.note { margin-top: 10px; font-size: 12px; color: var(--muted); }

/* view switch and physics demos */
.views { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); }
.views button { padding: 5px 12px; border: 0; border-radius: 7px; background: none; color: var(--ink-2); font-size: 13px; cursor: pointer; }
.views button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(11, 11, 11, 0.08); }
.demos { margin-bottom: 12px; }
.demo-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.demo-tab { padding: 5px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--ink-2); font-size: 13px; cursor: pointer; }
.demo-tab:hover { background: var(--hover); }
.demo-tab[aria-selected="true"] { border-color: var(--ink); background: var(--ink); color: var(--surface); }
.demo-stage { overflow: hidden; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.demo-stage canvas { display: block; width: 100%; }
.demo-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-top: 12px; }
.slider { display: flex; flex: 1 1 240px; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }
.slider input[type="range"] { flex: 1; min-width: 120px; accent-color: var(--accent); }
.slider output { min-width: 62px; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.demo-readout { color: var(--ink); font-size: 13px; font-weight: 600; }
.demo-caption { max-width: 860px; margin-top: 12px; color: var(--ink-2); font-size: 13.5px; line-height: 1.6; }

.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; margin-top: 20px; font-size: 12px; color: var(--muted); }
.foot a { color: var(--ink-2); }

/* v0.2: tour, model, theory & materials, phone */
:root { --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; }
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) { --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; } }
:root[data-theme="dark"] { --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; }
.views .lbl-short { display: none; }
@media (max-width: 640px) { .views .lbl-long { display: none; } .views .lbl-short { display: inline; } }
.hs-accent { color: var(--accent); }
.demo-caption sub, .lcard sub, .zoo sub, .tc-tip sub, .tbl sub, .card-head sub { font-size: 0.72em; }
.demo-refs { max-width: 860px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.refs-title { display: block; font-weight: 600; color: var(--ink-2); }
.refs { margin: 4px 0 0; padding-left: 20px; font-size: 11.5px; color: var(--muted); }
.refs li { margin: 2px 0; line-height: 1.45; }
.refs a { color: var(--ink-2); }
.seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); }
.seg button { padding: 4px 12px; border: 0; border-radius: 7px; background: none; color: var(--ink-2); font-size: 13px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(11, 11, 11, 0.08); }
.zoo { max-width: 860px; margin-top: 14px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); }
.zoo h3 { font-size: 13.5px; font-weight: 600; margin-bottom: 6px; }
.zoo-list { list-style: none; margin: 0; padding: 0; }
.zoo-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto 112px; align-items: center; gap: 4px 12px; padding: 7px 0; border-top: 1px solid var(--border); }
.zoo-list li:first-child { border-top: 0; }
.zoo-name { display: flex; flex-direction: column; min-width: 0; font-size: 13px; }
.zoo-name span { color: var(--muted); font-size: 12px; }
.zoo-score { font-size: 12.5px; font-weight: 600; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
.zoo-ai { margin-top: 10px; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
@media (max-width: 520px) { .zoo-list li { grid-template-columns: minmax(0, 1fr) auto; } .zoo-score { grid-column: 1 / -1; text-align: left; } }
.learn { display: flex; flex-direction: column; gap: 16px; margin-bottom: 12px; }
.learn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.lcard { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.lcard-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.lcard h3 { font-size: 14.5px; font-weight: 600; line-height: 1.35; }
.lcard .meta { font-size: 12px; color: var(--muted); }
.lcard .meta b { color: var(--ink-2); font-weight: 600; }
.lcard > p:not(.meta) { font-size: 13px; line-height: 1.55; color: var(--ink-2); }
.lcard .refs { margin-top: 2px; }
.lcard .go { align-self: flex-start; margin-top: 4px; }
.fam-filter { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.fam-filter button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--surface); }
.learn-note { margin: 0 2px; }
.tc-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 8px; font-size: 12px; color: var(--ink-2); }
.tc-legend .lg { display: inline-flex; align-items: center; gap: 6px; }
.tc-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.tc-legend i.lg-ring { border: 2px solid var(--ink-2); background: var(--surface); }
.tc-legend i.lg-step { width: 16px; height: 2px; border-radius: 1px; background: var(--ink-2); }
i.fam-1, .key.fam-1 { background: var(--series-1); }
i.fam-2, .key.fam-2 { background: var(--series-2); }
i.fam-3, .key.fam-3 { background: var(--series-3); }
.tip-row .key.fam-1, .tip-row .key.fam-2, .tip-row .key.fam-3 { width: 8px; height: 8px; border-radius: 50%; }
.plot .tc-dot { stroke: var(--surface); stroke-width: 2; }
.plot .tc-dot.fam-1 { fill: var(--series-1); }

/* v0.3: Storm, card animations, latest results, Nobel Prizes, New papers */
.lcard canvas.mini { display: block; width: 100%; height: 120px; border-radius: 8px; margin-bottom: 4px; }
.latest-wrap { margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--border); }
.latest-title { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.latest { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.latest li { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; line-height: 1.5; color: var(--ink-2); }
.latest-meta { font-size: 11px; color: var(--muted); }
.latest b { color: var(--ink); font-weight: 600; }
.latest-ref { font-size: 11px; color: var(--muted); }

.latest sub, .adv-list sub, ol.nobel sub { font-size: 0.72em; }
:root { --gold: #b58a1b; --gold-wash: rgba(201, 162, 39, 0.12); }
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) { --gold: #d9b44a; --gold-wash: rgba(217, 180, 74, 0.12); } }
:root[data-theme="dark"] { --gold: #d9b44a; --gold-wash: rgba(217, 180, 74, 0.12); }
ol.nobel { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px 14px; }
ol.nobel li { display: flex; flex-direction: column; gap: 10px; padding: 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); min-width: 0; }
ol.nobel li canvas.mini { display: block; width: 100%; height: 120px; border-radius: 8px; }
.nobel-row { display: flex; gap: 12px; align-items: flex-start; padding: 0 2px 2px; }
.nobel-year { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 58px; height: 58px; border-radius: 50%; border: 2px solid var(--gold); background: var(--gold-wash); box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 4px var(--gold-wash); color: var(--gold); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; text-decoration: none; }
.nobel-year:hover { background: var(--gold); color: var(--surface); }
.nobel-row > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 12.5px; line-height: 1.5; color: var(--ink-2); }
.nobel-row b { color: var(--ink); font-weight: 600; font-size: 13px; }
.nobel-link { margin-top: 3px; font-size: 11.5px; color: var(--gold); }
ol.nobel.related .nobel-year { width: 48px; height: 48px; font-size: 13px; }
.nobel-sub { margin: 14px 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
.papers { display: flex; flex-direction: column; gap: 16px; margin-bottom: 12px; }
.adv-list, .feed-list { list-style: none; margin: 0; padding: 0; }
.adv-list li, .feed-list li { padding: 12px 0; border-top: 1px solid var(--border); min-width: 0; }
.adv-list li:first-child, .feed-list li:first-child { border-top: 0; padding-top: 2px; }
.adv-meta, .paper-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 11.5px; color: var(--muted); }
.adv-list h3, .feed-list h3 { margin-top: 4px; font-size: 14px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
.feed-list h3 a { color: var(--ink); text-decoration: none; }
.feed-list h3 a:hover { text-decoration: underline; }
.adv-text, .paper-intro { margin-top: 3px; font-size: 13px; line-height: 1.55; color: var(--ink-2); max-width: 860px; overflow-wrap: anywhere; }
.paper-intro.muted { color: var(--muted); }
.adv-ref, .paper-authors { margin-top: 3px; font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.kind { padding: 0 7px; border-radius: 999px; font-size: 11px; line-height: 18px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--border); }
.kind-experiment { background: var(--accent-wash); }
.kind-theory, .kind-computation { background: rgba(235, 104, 52, 0.10); }
.src { font-weight: 600; color: var(--ink-2); }
.topic { padding: 0 7px; border-radius: 999px; font-size: 11px; line-height: 18px; background: var(--surface-2); color: var(--ink-2); }
.paper-abs { margin-top: 4px; font-size: 12.5px; color: var(--ink-2); max-width: 860px; }
.paper-abs summary { cursor: pointer; color: var(--accent); font-size: 12px; }
.paper-abs p { margin-top: 4px; line-height: 1.55; overflow-wrap: anywhere; }
.feed-tools { display: flex; flex-wrap: wrap; gap: 8px; margin: -4px 0 8px; }
.feed-topic { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.feed-topic select { height: 28px; max-width: 100%; padding: 0 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 12.5px; }
.feed-more { margin-top: 8px; }
.feed-list .empty { color: var(--muted); font-size: 13px; }
@media (max-width: 420px) { .views button { padding: 5px 9px; } }
/* v0.3.1: classic high-Tc mechanisms, new-version prompt */
.mech-overview { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 14px 20px; align-items: center; margin-bottom: 14px; }
@media (max-width: 760px) { .mech-overview { grid-template-columns: minmax(0, 1fr); } }
.mech-overview canvas.mini { display: block; width: 100%; height: 240px; border-radius: 8px; }
.mech-intro { display: flex; flex-direction: column; gap: 8px; font-size: 13px; line-height: 1.6; color: var(--ink-2); max-width: 560px; }
.mech-intro sub { font-size: 0.72em; }
.lcard > p.open-q { font-size: 12.5px; line-height: 1.5; padding: 7px 9px; border-radius: 8px; background: var(--surface-2); }
.lcard .open-q b { color: var(--ink); font-weight: 600; }
.update {
  display: flex; align-items: flex-start; gap: 10px;
  margin-bottom: 16px; padding: 12px 14px;
  border: 1px solid var(--accent); border-radius: 12px; background: var(--accent-wash);
}
.update .upd-glyph { display: inline-flex; flex: none; margin-top: 1px; color: var(--accent); }
.update .upd-glyph svg { width: 18px; height: 18px; }
.upd-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
.upd-title { font-size: 13.5px; font-weight: 600; color: var(--ink); }
.upd-news { font-size: 12.5px; line-height: 1.5; color: var(--ink-2); }
.upd-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.upd-hint { font-size: 12px; line-height: 1.5; color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn .btn-glyph { display: inline-flex; }
.linklike { border: 0; padding: 0; background: none; font: inherit; color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--axis); text-underline-offset: 2px; cursor: pointer; }
.linklike:hover { text-decoration-color: currentColor; }
/* v0.3.1: a drawing for every news story */
.feed-list li.news-item { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 4px 14px; align-items: start; }
.news-art canvas.mini { display: block; width: 112px; height: 84px; border-radius: 8px; }
.news-body { min-width: 0; }
@media (max-width: 480px) {
  .feed-list li.news-item { grid-template-columns: 88px minmax(0, 1fr); gap: 4px 12px; }
  .news-art canvas.mini { width: 88px; height: 66px; }
}
/* v0.3.1: our models */
.model-family { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .model-family { grid-template-columns: minmax(0, 1fr); } }
.model-family li { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.mf-head { display: flex; align-items: center; gap: 10px; }
.mf-glyph { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); color: var(--ink-2); }
.model-family li.on .mf-glyph { background: var(--accent-wash); color: var(--accent); }
.mf-glyph svg { width: 22px; height: 22px; }
.mf-title { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }

.model-family li.on .mf-status { border-color: var(--accent); color: var(--accent); }
.mf-role { font-size: 12.5px; font-weight: 600; line-height: 1.45; color: var(--ink); }
.mf-text { font-size: 13px; line-height: 1.55; color: var(--ink-2); }
.mf-role sub, .mf-text sub { font-size: 0.72em; }
.mf-act { align-self: flex-start; margin-top: auto; }
/* v0.3.1: authors */
.author-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.author { display: flex; align-items: center; gap: 16px; min-width: 0; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.author-avatar { flex: none; }
.author-avatar canvas.mini { display: block; width: 96px; height: 96px; border-radius: 50%; border: 1px solid var(--border); }
.author-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.author-top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.author-top h3 { font-size: 16px; font-weight: 600; }
.author-top .tag { margin-left: 0; }
.author-role { font-size: 12.5px; color: var(--ink-2); }
.author-mail { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13.5px; overflow-wrap: anywhere; }
.author-mail a { color: var(--ink); }
.author-glyph { display: inline-flex; color: var(--muted); }
.author-glyph svg { width: 16px; height: 16px; }
.author-url { font-size: 12.5px; overflow-wrap: anywhere; }
@media (max-width: 480px) { .author { gap: 12px; } .author-avatar canvas.mini { width: 80px; height: 80px; } }
/* five views in the switch: keep it on one line on small phones */
.views { max-width: 100%; }
@media (max-width: 360px) { .views button { padding: 5px 6px; font-size: 12.5px; } }
.models-card { margin-bottom: 16px; }
/* v0.3.2: six views; the switch scrolls sideways on the smallest phones instead of wrapping */
.views { overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.views::-webkit-scrollbar { display: none; }
.views button { flex: 0 0 auto; white-space: nowrap; }
@media (max-width: 360px) { .views button { padding: 5px 5px; font-size: 12px; } }

/* AI × superconductors */
.ai .card { margin-bottom: 12px; }
.ai-status { display: flex; align-items: center; gap: 8px; margin: 2px 0 10px; font-size: 12.5px; color: var(--ink-2); }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: 0 0 auto; box-shadow: 0 0 0 0 rgba(12, 163, 12, 0.5); animation: live-pulse 2.4s ease-out infinite; }
.live-dot.off { background: var(--muted); animation: none; }
@keyframes live-pulse { 0% { box-shadow: 0 0 0 0 rgba(12, 163, 12, 0.45); } 70% { box-shadow: 0 0 0 7px rgba(12, 163, 12, 0); } 100% { box-shadow: 0 0 0 0 rgba(12, 163, 12, 0); } }
@media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
.ai-ticker { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 0 0 12px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--accent-wash); transition: opacity 0.26s ease; min-height: 40px; }
.ai-ticker.fade { opacity: 0; }
.ai-tick-label { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); }
.ai-tick { flex: 1 1 260px; font-weight: 600; color: var(--ink); text-decoration: none; }
.ai-tick:hover { text-decoration: underline; }
.ai-tick-meta { font-size: 12px; color: var(--muted); }
.new-badge { padding: 0 7px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; line-height: 18px; }
.feed-list li.is-new { border-left: 3px solid var(--accent); padding-left: 10px; }
.ai-models { list-style: none; margin: 4px 0 8px; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .ai-models { grid-template-columns: 1fr; } }
.ai-models li { display: flex; gap: 10px; align-items: flex-start; }
.ai-models .mf-glyph { flex: 0 0 auto; }
.ai-model-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; margin: 0 0 2px; }
.ai-links { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0; }

/* model details on the Progress view */
.details-card { margin-bottom: 16px; }
.dt-block + .dt-block { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }
.dt-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; margin: 0 0 6px; font-size: 15px; }
.dt-lead { margin: 0 0 12px; color: var(--ink-2); font-size: 13px; line-height: 1.5; }
.dt-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
@media (max-width: 560px) { .dt-tiles { grid-template-columns: 1fr; } }
.dt-tile { padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); }
.dt-tile-label { margin: 0; font-size: 12px; color: var(--muted); }
.dt-tile-value { margin: 2px 0 0; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dt-tile-sub { margin: 2px 0 0; font-size: 12px; color: var(--ink-2); }
.dt-sub { margin: 12px 0 6px; font-size: 13px; color: var(--ink-2); }
.dt-key { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
.dt-key::before { content: ''; width: 10px; height: 10px; border-radius: 2px; }
.dt-key.k-a::before, .dt-bar.a .dt-fill { background: var(--accent); }
.dt-key.k-b::before, .dt-bar.b .dt-fill { background: var(--axis); }
.dt-row { display: grid; grid-template-columns: minmax(120px, 190px) 1fr; gap: 10px; align-items: center; margin: 6px 0; }
@media (max-width: 480px) { .dt-row { grid-template-columns: 1fr; gap: 3px; } }
.dt-label b { display: block; font-size: 13px; font-weight: 600; }
.dt-label span { font-size: 11.5px; color: var(--muted); }
.dt-bars { display: grid; gap: 3px; }
.dt-bar { position: relative; display: flex; align-items: center; gap: 8px; height: 16px; }
.dt-fill { display: block; height: 12px; border-radius: 3px; }
.dt-val { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dt-tbl td, .dt-tbl th { font-size: 12.5px; }
.dt-cell-sub { font-size: 11.5px; color: var(--muted); }
.dt-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.dt-chips li { padding: 3px 9px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2); font-size: 12px; }
.dt-chips li span { color: var(--muted); font-variant-numeric: tabular-nums; }

/* Data and licences (Authors view) */
.lic-card { margin-top: 16px; }
.lic-list { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 10px; }
.lic-list li { font-size: 13px; line-height: 1.55; color: var(--ink-2); }
.lic-list li > a b, .lic-list li > b { color: var(--ink); }
.lic-tag { display: inline-block; margin-left: 8px; padding: 0 8px; border: 1px solid var(--border); border-radius: 999px; font-size: 11.5px; line-height: 18px; white-space: nowrap; }
.lic-cite { display: block; font-size: 12px; color: var(--muted); }
.lic-cite a { color: inherit; }
.dt-data { font-size: 12px; }
.paper-more { margin: 4px 0 0; font-size: 12.5px; }
.pred-sliders { display: contents; }
.pred-sliders[hidden] { display: none; }
/* the Baselines switch has four choices: let it wrap on phones */
#demo-model-row .seg { flex-wrap: wrap; }
#demo-model-row .seg button { white-space: nowrap; }
/* superconductors found with AI: the Tc sits with the year and the method */
.found-tc { font-weight: 600; color: var(--ink-2); }
.found-tc sub { font-size: 0.72em; }
/* predicted by AI, waiting for experiment */
.found-sub { margin-top: 18px; font-size: 14px; font-weight: 600; }
.found-sub-intro { margin: 2px 0 6px; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.ai-kind { padding: 0 7px; border-radius: 999px; font-weight: 600; font-size: 11px; line-height: 18px; }
.ai-kind-prediction { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border); }
.ai-kind-experiment { background: var(--accent-wash); color: var(--accent); }
/* Candidates: the materials our AI models found, in their own view between Progress and Demos */
.cands { display: flex; flex-direction: column; gap: 16px; margin-bottom: 12px; }
.candidates-card { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.cand-ours { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 12px; padding: 9px 12px; border-radius: 8px; background: var(--accent-wash); font-size: 12.5px; line-height: 1.5; color: var(--ink-2); }
.cand-ours p { margin: 0; }
.cand-ours b { color: var(--ink); }
.cand-ours-mark { flex: 0 0 auto; width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--accent); }
.cand-meta { margin: 0 0 12px; font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
.cand-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 330px); gap: 16px 22px; align-items: start; }
.cand-viewer { order: 2; position: sticky; top: 12px; min-width: 0; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.cand-list { order: 1; list-style: none; margin: 0; padding: 0; min-width: 0; }
@media (max-width: 1099px) { .cand-body { grid-template-columns: minmax(0, 1fr); } .cand-viewer { order: 0; position: static; } }
.cand-row { display: grid; grid-template-columns: 22px 56px minmax(0, 1fr) 104px 76px 64px minmax(96px, 140px); gap: 2px 12px; align-items: center; padding: 8px 6px; border-top: 1px solid var(--grid); border-radius: 8px; font-size: 13px; min-width: 0; }
.cand-row.is-sel { background: var(--accent-wash); }
.cand-headrow { align-items: end; border-top: 0; border-bottom: 1px solid var(--axis); border-radius: 0; padding: 4px 6px 6px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.cand-headrow + .cand-row { border-top: 0; }
.cand-rank { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.cand-main { min-width: 0; overflow-wrap: anywhere; }
.cand-list.is-hur .cand-row { grid-template-columns: 22px 56px minmax(0, 1fr) 128px 64px minmax(96px, 140px); }
.cand-tc, .cand-cal, .cand-p { text-align: right; font-variant-numeric: tabular-nums; }
.cand-row .cand-label { display: none; }
.cand-thumb { display: block; width: 56px; height: 56px; padding: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); cursor: pointer; }
.cand-thumb:hover { border-color: var(--axis); }
.cand-thumb[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cand-thumb.none { cursor: default; }
.xt-thumb { display: block; width: 100%; height: 100%; }
@media (max-width: 640px) {
  .cand-headrow { display: none; }
  .cand-row { grid-template-columns: 16px 52px minmax(0, 1fr) auto; align-items: start; gap: 2px 10px; padding: 8px 4px; }
  .cand-row .cand-thumb { grid-row: span 4; width: 52px; height: 52px; }
  .cand-list.is-hur .cand-row { grid-template-columns: 16px 52px minmax(0, 1fr) auto; }
  .cand-row .cand-cal, .cand-row .cand-p, .cand-row .cand-check { grid-column: 3 / 5; text-align: left; font-size: 12px; color: var(--ink-2); }
  .cand-row .cand-label { display: inline; }

.cand-open { font-size: 12px; color: var(--muted); }

/* the structure viewer */
.xt-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }

.xt-sub { flex-basis: 100%; font-size: 12px; color: var(--muted); }

.xt-big { display: block; width: 100%; height: 100%; border-radius: 8px; cursor: grab; touch-action: pan-y; }

.xt-big:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.xt-key { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 2px 0 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--ink); }
.xt-key li { display: inline-flex; align-items: center; gap: 6px; }
.xt-dot { display: inline-block; border-radius: 50%; }
.xt-s1 { background: var(--series-1); }
.xt-s2 { background: var(--series-2); }
.xt-s3 { background: var(--series-3); }
.xt-s4 { background: var(--ink-2); }
.xt-n { color: var(--muted); font-variant-numeric: tabular-nums; }
.xt-facts, .xt-tc { margin: 6px 0 0; font-size: 12px; line-height: 1.5; color: var(--ink-2); }
.xt-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
.xt-nav .btn[disabled] { opacity: 0.45; cursor: default; }
.xt-hint { font-size: 11.5px; color: var(--muted); text-align: center; }

.cite-text { margin: 0 0 10px; padding: 10px 12px; border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; background: var(--accent-wash); font-size: 13.5px; line-height: 1.55; color: var(--ink); overflow-wrap: anywhere; }
.cite-bib { margin: 0 0 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); font-family: var(--mono); font-size: 12px; line-height: 1.5; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }

.cite-none { font-size: 13px; color: var(--ink-2); }
.cite-foot { margin: 0 2px; }
.authors { display: flex; flex-direction: column; gap: 16px; margin-bottom: 12px; }
.authors .lic-card { margin-top: 0; }

.ct-form { display: grid; gap: 6px; max-width: 560px; }

.ct-trap { display: none; }
.ct-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 6px; }
.ct-actions .btn[disabled] { opacity: 0.6; cursor: default; }
.ct-status { font-size: 12.5px; color: var(--ink-2); }

.cand-seg b { font-weight: 600; }

  function drawChart(host, pts, ref) {
    clear(host);
    var W = Math.max(280, Math.floor(host.getBoundingClientRect().width) || 600);
    var H = 228;
    var m = { t: 12, r: 12, b: 28, l: 40 };
    var pw = W - m.l - m.r;
    var ph = H - m.t - m.b;
    var vals = pts.map(function (p) { return p.y; });
    if (ref) vals.push(ref.mae);
    var top = Math.max.apply(null, vals) * 1.15 || 1;
    var step = niceStep(top, 4);
    var yMax = Math.ceil(top / step) * step;
    var n = pts.length;
    function X(i) { return m.l + (n === 1 ? pw / 2 : i * pw / (n - 1)); }
    function Y(v) { return m.t + ph - v / yMax * ph; }

    var svg = s('svg', {
      viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, class: 'plot', role: 'img', tabindex: '0',
      'aria-label': t('chartTitle') + ': ' + pts.map(function (p) { return fmtVal(p.y) + ' K'; }).join(', ')
    });
    for (var v = 0; v <= yMax + step * 1e-6; v += step) {
      var yy = Math.round(Y(v)) + 0.5;
      svg.appendChild(s('line', { x1: m.l, x2: W - m.r, y1: yy, y2: yy, class: v === 0 ? 'axis-line' : 'grid-line' }));
      svg.appendChild(s('text', { x: m.l - 8, y: yy + 4, 'text-anchor': 'end', class: 'tick' }, fmtTick(v)));
    }
    var ticks = n === 1 ? [0] : n < 6 ? pts.map(function (_, i) { return i; }) : [0, Math.floor((n - 1) / 2), n - 1];
    ticks.forEach(function (i) {
      var anchor = n === 1 ? 'middle' : i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle';
      svg.appendChild(s('text', { x: X(i), y: H - 8, 'text-anchor': anchor, class: 'tick' }, pts[i].at ? fmtDay(pts[i].at) : '#' + (i + 1)));
    });
    var last = n - 1;
    if (ref) {
      var ry = Math.round(Y(ref.mae)) + 0.5;
      var near = Math.abs(Y(pts[last].y) - ry) < 22;
      svg.appendChild(s('line', { x1: m.l, x2: W - m.r, y1: ry, y2: ry, class: 'ref-line' }));
      svg.appendChild(s('text', { x: m.l + 6, y: near ? ry + 15 : ry - 6, class: 'ref-label' }, t('refLabel', { m: L(ref.model), v: fmtVal(ref.mae) + ' K' })));
    }
    if (n > 1) {
      svg.appendChild(s('path', { class: 'series-line', d: pts.map(function (p, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1); }).join(' ') }));
    }
    pts.forEach(function (p, i) { svg.appendChild(s('circle', { cx: X(i), cy: Y(p.y), r: 4, class: 'series-dot' })); });
    svg.appendChild(s('text', {
      x: n === 1 ? X(last) : X(last) - 8, y: Y(pts[last].y) - 10,
      'text-anchor': n === 1 ? 'middle' : 'end', class: 'end-label'
    }, fmtVal(pts[last].y) + ' K'));

    var cross = s('line', { y1: m.t, y2: m.t + ph, class: 'crosshair', visibility: 'hidden' });
    var ring = s('circle', { r: 6.5, class: 'hover-dot', visibility: 'hidden' });
    var hit = s('rect', { x: m.l - 16, y: 0, width: pw + 32, height: m.t + ph + 8, fill: 'transparent' });
    svg.appendChild(cross);
    svg.appendChild(ring);
    svg.appendChild(hit);
    var tip = h('div', { class: 'tooltip', hidden: true });
    host.appendChild(svg);
    host.appendChild(tip);

    var cur = -1;
    function show(i) {
      cur = i;
      var p = pts[i];
      var x = X(i);
      var y = Y(p.y);
      cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('visibility', 'visible');
      ring.setAttribute('cx', x); ring.setAttribute('cy', y); ring.setAttribute('visibility', 'visible');

        h('b', { text: fmtVal(p.y) + ' K' }),

        h('span', { class: 'tip-row', text: p.at ? fmtStamp(p.at) : '#' + (i + 1) })
      ]);

  function solveFieldLine(x, cval, re) {
    if (re < 0.5) return cval;
    var lo = Math.sqrt(Math.max(re * re - x * x, 0)), hi = cval + re;
    for (var i = 0; i < 30; i++) {
      var mid = (lo + hi) / 2;

    }
    return (lo + hi) / 2;
  }

  function drawMeissner(c, C, dt) {
    var W = demo.W, H = demo.H, t = demo.t, s = Math.min(1, gapRatio(t) * 1.6);

    var re = a * Math.sqrt(s);

      demo.fieldKey = key;
      demo.field = [];
      var spacing = Math.max(18, Math.round(H / 16));

        var top = [], bottom = [];

          var y = solveFieldLine(x, cval, re);

    }
    c.save();
    c.beginPath();

      [[cx, cy - a, 'in'], [cx, cy + a, 'out'], [cx - a * 0.71, cy - a * 0.71, 'in'], [cx + a * 0.71, cy - a * 0.71, 'in'], [cx - a * 0.71, cy + a * 0.71, 'out'], [cx + a * 0.71, cy + a * 0.71, 'out']].forEach(function (m) {

    label(c, C, 'Magnetic field →', 16, H - 11, { size: 12, color: C.muted });

  }

  function drawPairs(c, C, dt) {
    var W = demo.W, H = demo.H, t = demo.t, s = gapRatio(t);
    var d = 34, top = 14, regionH = Math.round(H * 0.6);
    var rows = Math.max(3, Math.floor(regionH / d)), cols = Math.ceil(W / d) + 1;
    var key = [W, H].join(':');
    if (!demo.ions || demo.sizeKey !== key) {
      demo.sizeKey = key;
      demo.ions = [];
      for (var r = 0; r < rows; r++) for (var k = 0; k < cols; k++) demo.ions.push({ x0: (k + 0.5) * d, y0: top + (r + 0.5) * d, ux: 0, uy: 0 });
      var lane = top + Math.floor(rows / 2) * d;
      demo.e1 = { x: W * 0.55, y: lane };
      demo.e2 = { x: W * 0.55 - 2.6 * d, y: lane, vx: 30, vy: 0 };
    }
    var e1 = demo.e1, e2 = demo.e2, laneY = e1.y;
    e1.x += 70 * dt;
    if (e1.x > W + 40) { e1.x -= W + 80; e2.x -= W + 80; }
    var pullR2 = (2.3 * d) * (2.3 * d), sig2 = 2 * (0.9 * d) * (0.9 * d);
    demo.ions.forEach(function (ion) {
      var dx = e1.x - ion.x0, dy = e1.y - ion.y0, r2 = dx * dx + dy * dy;
      if (r2 < pullR2 && r2 > 1) {
        var f = 160 * Math.exp(-r2 / sig2) / Math.sqrt(r2);

      var u = Math.hypot(ion.ux, ion.uy);

    });
    var target = { x: e1.x - 2.6 * d, y: laneY + 4 * Math.sin(demo.clock * 3) };
    if (dt && Math.random() < (1 - s) * 3 * dt) {
      var ang = Math.random() * Math.PI * 2;
      e2.vx = 70 * Math.cos(ang) + 20; e2.vy = 70 * Math.sin(ang);
    }
    var free = { x: e2.vx * dt, y: e2.vy * dt };
    var paired = { x: (target.x - e2.x) * Math.min(1, dt * 2.5), y: (target.y - e2.y) * Math.min(1, dt * 2.5) };

    e2.y += (1 - s) * free.y + s * paired.y;

      c.setLineDash([]);

      if (c.roundRect) c.roundRect(midx - tw / 2 - 6, midy - 19, tw + 12, 20, 6); else c.rect(midx - tw / 2 - 6, midy - 19, tw + 12, 20);
      c.fill();

      c.globalAlpha = 1;

    [e2, e1].forEach(function (e) {
      dot(c, e.x, e.y, 6.5, C.accent, C.surface);
      c.strokeStyle = C.surface; c.lineWidth = 1.6; c.beginPath(); c.moveTo(e.x - 3, e.y); c.lineTo(e.x + 3, e.y); c.stroke();

      s > 0 ? 'Δ = ' + s.toFixed(2) + ' Δ₀' : 'No gap');

  function refList(keys, cls) {
    var ol = h('ol', { class: cls || 'refs' });

      var url = refUrl(r);

    });
    return ol;
  }
  function renderRefs(el, keys) {

  }

        var r2 = x * x + y * y;
        return r2 < R2 ? (1 - k) * y : y * (1 - k * R2 / r2);
      }
      c.setLineDash([5, 5]); c.lineDashOffset = -tt * 20;
      c.lineWidth = 1.2; c.strokeStyle = stAlpha(C.ink2, 0.75);
      for (var j = 0; j < 5; j++) {
        var cv = (j + 0.5) * 12;
        for (var s = -1; s <= 1; s += 2) {
          c.beginPath();
          for (var x = fx0 - 3; x <= fx1 + 3; x += 3) {
            var X = x - cx, lo = 0, hi = cv + R + 2;
            for (var it = 0; it < 13; it++) { var mid = (lo + hi) / 2; if (psi(X, mid) < cv) lo = mid; else hi = mid; }
            var y = cy + s * (lo + hi) / 2;
            if (x === fx0 - 3) c.moveTo(x, y); else c.lineTo(x, y);
          }
          c.stroke();
        }
      }
      c.setLineDash([]);
      c.restore();
      // B(x) inset
      var px0 = W - m - pw, px1 = W - m;
      stTag(c, C, k > 0.5 ? 'T < Tc' : 'T > Tc', px0, m + 10, { size: 11, align: 'left', rich: true, bg: C.surface, ring: k > 0.5 ? C.accent : C.axis });
      var yb = 90, yB = 50, xs = px0 + 16 + Math.round((pw - 16) * 0.22), lam = Math.max(14, (px1 - xs) * 0.24);
      stRound(c, xs, yB - 12, px1 - xs, yb - yB + 12, 3); c.fillStyle = mix(C.grid, C.track, k); c.fill();
      c.strokeStyle = C.axis; c.lineWidth = 1;
      seg(c, px0 + 12, yb + 0.5, px1, yb + 0.5);
      seg(c, xs + 0.5, yB - 12, xs + 0.5, yb);
      label(c, C, 'B', px0, yB + 0.5, { size: 11, color: C.muted, base: 'middle' });
      c.beginPath();
      for (var xx = px0 + 12; xx <= px1; xx += 2) {
        var bb = xx < xs ? 1 : (1 - k) + k * Math.exp(-(xx - xs) / lam);
        var yy = yb - bb * (yb - yB);
        if (xx === px0 + 12) c.moveTo(xx, yy); else c.lineTo(xx, yy);
      }
      c.lineWidth = 1.75; c.strokeStyle = C.accent; c.stroke();
      if (k > 0.02) {
        c.globalAlpha = k;
        var xl = xs + lam, yl = yb - ((1 - k) + k * Math.exp(-1)) * (yb - yB);
        c.setLineDash([2, 3]); c.strokeStyle = C.ink2; c.lineWidth = 1;
        seg(c, xl + 0.5, yl, xl + 0.5, yb + 4); c.setLineDash([]);
        label(c, C, 'λ', xl, yb + 15, { size: 11.5, color: C.ink2, align: 'center' });
        c.globalAlpha = 1;
      }
    }

    /* Ginzburg-Landau: F = a |psi|^2 + b |psi|^4 / 2 with a ∝ (T - Tc); type-II vortex lattice below Tc. */
    function drawGL(c, C, W, H, t) {
      var P = 9, tt = md(t, P);
      var cool = stSpan(tt, 1.4, 3.0), heat = stSpan(tt, 6.6, 8.2);
      var a = 0.8 - 2.0 * cool + 2.0 * heat, b = 1;
      var psiMin = a < 0 ? Math.sqrt(-a / b) : 0, psiB = psiMin * stSpan(tt, 2.1, 3.6);
      var m = 10, vw = Math.round(Math.max(100, Math.min(150, W * 0.38)));
      var gx0 = m, gx1 = W - m - vw - 14, cx = (gx0 + gx1) / 2;
      var span = 1.45, sx = ((gx1 - gx0) / 2 - 4) / span, y0 = 56, sy = 40;
      function F(p) { return a * p * p + 0.5 * b * p * p * p * p; }
      c.strokeStyle = C.axis; c.lineWidth = 1;
      seg(c, gx0, y0 + 0.5, gx1, y0 + 0.5);
      c.strokeStyle = C.grid; seg(c, Math.round(cx) + 0.5, 14, Math.round(cx) + 0.5, 86);
      label(c, C, 'F', Math.round(cx) + 5, 19, { size: 11, color: C.muted });
      label(c, C, 'ψ', gx1, y0 - 5, { size: 11.5, color: C.muted, align: 'right' });
      c.save();
      c.beginPath(); c.rect(gx0, 8, gx1 - gx0, H - 16); c.clip();
      c.beginPath();
      for (var i = 0; i <= 60; i++) {
        var p = -span + 2 * span * i / 60, x = cx + p * sx, y = y0 - F(p) * sy;
        if (i) c.lineTo(x, y); else c.moveTo(x, y);
      }
      c.lineWidth = 1.75; c.strokeStyle = C.accent; c.stroke();
      c.restore();
      var bx = cx + psiB * sx, by = y0 - F(psiB) * sy;
      var slope = -(2 * a * psiB + 2 * b * psiB * psiB * psiB) * sy / sx, nn = Math.sqrt(1 + slope * slope);
      dot(c, bx + 5 * slope / nn, by - 5 / nn, 4.5, C.warm);
      var below = a < 0;
      stTag(c, C, below ? 'T < Tc' : 'T > Tc', cx, 101, { size: 11, rich: true, bg: C.surface, ring: below ? C.accent : C.axis });
      // vortex panel
      var vx0 = W - m - vw, cxv = vx0 + vw / 2, cyv = 48, s = Math.min(32, vw / 3.3);
      var vis = stSpan(tt, 2.6, 3.6) * (1 - stSpan(tt, 6.6, 7.6));
      if (vis < 0.99) {
        c.fillStyle = stAlpha(C.muted, 0.7 * (1 - vis));
        c.beginPath();
        for (var gy = -2; gy <= 2; gy++) for (var gx = -3; gx <= 3; gx++) {
          var ux = cxv + gx * s * 0.5 + (gy % 2 ? s * 0.25 : 0), uy = cyv + gy * s * 0.43;
          c.moveTo(ux + 1.3, uy); c.arc(ux, uy, 1.3, 0, TAU);
        }
        c.fill();
      }
      if (vis > 0.01) {
        c.globalAlpha = vis;
        var th = -tt * 1.6, rs = s * 0.34;
        for (var r = -1; r <= 1; r++) {
          var n = r === 0 ? 3 : 2;
          for (var q = 0; q < n; q++) {
            var vx = cxv + (q - (n - 1) / 2) * s, vy = cyv + r * s * 0.866;
            c.beginPath(); c.arc(vx, vy, rs, th, th + TAU * 0.78); c.lineWidth = 1.2; c.strokeStyle = stAlpha(C.accent, 0.75); c.stroke();
            var hx = vx + rs * Math.cos(th), hy = vy + rs * Math.sin(th), tx = Math.sin(th), ty = -Math.cos(th);
            c.beginPath(); c.moveTo(hx + tx * 3.6, hy + ty * 3.6);
            c.lineTo(hx - ty * 2.4, hy + tx * 2.4); c.lineTo(hx + ty * 2.4, hy - tx * 2.4); c.closePath();
            c.fillStyle = stAlpha(C.accent, 0.75); c.fill();
            dot(c, vx, vy, 2.2, C.accent);
          }
        }
        c.globalAlpha = 1;
      }
      if (vis < 0.5) { c.globalAlpha = 1 - 2 * vis; label(c, C, 'uniform field', cxv, 106, { size: 11, align: 'center', color: C.ink2 }); }
      else { c.globalAlpha = 2 * vis - 1; label(c, C, 'vortices, Φ₀ each', cxv, 106, { size: 11, align: 'center', color: C.ink2 }); }
      c.globalAlpha = 1;
    }

    /* BCS: electron k↑ pulls the ions in and leaves a positive wake; an electron moving the other way (−k↓)
       falls into it and the two bind; the density of states opens a gap 2Δ with coherence peaks. */
    function drawBCS(c, C, W, H, t) {
      var P = 9, tt = md(t, P);
      var m = 10, dw = Math.round(Math.max(84, Math.min(130, W * 0.32)));
      var lx0 = m, lx1 = W - m - dw - 16, lane = 50, ro = 20;
      var sp = Math.max(17, Math.min(22, (lx1 - lx0) / 8)), ncol = Math.floor((lx1 - lx0 - 6) / sp) + 1;
      var ox = (lx0 + lx1) / 2 - (ncol - 1) * sp / 2;
      var xm = (lx0 + lx1) / 2, D = Math.min(24, (lx1 - lx0) * 0.15), tp = 3.6;
      var u1 = stClamp((tt - 0.2) / (tp - 0.2)), u2 = stClamp((tt - 1.0) / (tp - 1.0));
      var osc = stSpan(tt, tp, tp + 0.8) * 5 * Math.sin((tt - tp) * TAU / 1.6);
      var e1x = lerp(lx0 - 10, xm + D, 1 - (1 - u1) * (1 - u1)) + osc, e1y = lane - 4;
      var e2x = lerp(lx1 + 10, xm - D, 1 - (1 - u2) * (1 - u2)) - osc, e2y = lane + 4;
      var ea = 1 - stSpan(tt, 8.0, 8.7);
      var pair = stSpan(tt, tp - 0.2, tp + 0.6) * ea;
      function wake(d) { return d < -4 ? 0 : (1 - Math.exp(-(d + 4) / 5)) * Math.exp(-Math.max(0, d - 6) / 38); }
      c.save();
      c.beginPath(); c.rect(lx0, 8, lx1 - lx0, H - 16); c.clip();
      for (var i = 0; i < ncol; i++) {
        var x0 = ox + i * sp;
        var w = Math.min(1, (wake(e1x - x0) + (tt > 1.0 ? wake(x0 - e2x) : 0)) * ea);
        for (var r = -1; r <= 1; r += 2) {
          var x = x0 + 0.5 * Math.sin(tt * 7 + i * 1.7 + r), y = lane + r * ro - r * 3.5 * w + 0.5 * Math.cos(tt * 8 + i);
          dot(c, x, y, 3.6 + 0.5 * w, mix(C.muted, C.warm, w));
          c.strokeStyle = C.surface2; c.lineWidth = 1;
          seg(c, x - 1.8, y, x + 1.8, y); seg(c, x, y - 1.8, x, y + 1.8);
        }
      }
      if (pair > 0.01) {
        c.globalAlpha = pair * 0.8; c.setLineDash([3, 3]); c.strokeStyle = C.accent; c.lineWidth = 1.2;
        seg(c, e2x + 5, e2y, e1x - 5, e1y); c.setLineDash([]);
      }
      c.globalAlpha = ea;
      for (var q = 0; q < 2; q++) {   // e1 carries k↑ (spin drawn on its right), e2 carries −k↓ (spin on its left)
        var ex = q ? e2x : e1x, ey = q ? e2y : e1y;
        dot(c, ex, ey, 4.5, C.accent);
        c.strokeStyle = C.surface; c.lineWidth = 1.3; seg(c, ex - 2, ey, ex + 2, ey);
        spin(c, ex + (q ? -9 : 9), ey, (q ? 1 : -1) * Math.PI / 2, 9, C.ink2, 1.2);
      }
      c.restore();
      if (pair > 0.01) {
        c.globalAlpha = pair;
        stTag(c, C, 'k↑ and −k↓', Math.max(lx0 + 40, Math.min(lx1 - 40, xm)), 96, { size: 11.5, bg: C.surface, ring: C.accent });
        c.globalAlpha = 1;
      }
      // density of states N(E) = Re[(E − iΓ) / sqrt((E − iΓ)² − Δ²)]
      var gap = stSpan(tt, tp - 0.2, tp + 1.4) * (1 - stSpan(tt, 7.9, 8.7));
      var dx0 = W - m - dw, dx1 = W - m, yb = 92, y1 = 66, G = 0.06;
      label(c, C, 'N(E)', dx0, 19, { size: 11, color: C.muted });
      c.strokeStyle = C.axis; c.lineWidth = 1; seg(c, dx0, yb + 0.5, dx1, yb + 0.5);
      c.beginPath();
      for (var j = 0; j <= 80; j++) {
        var E = -3 + 6 * j / 80, xr = E, xi = -G, ar = xr * xr - xi * xi - gap * gap, ai = 2 * xr * xi;
        var mod = Math.sqrt(Math.sqrt(ar * ar + ai * ai)), ang = Math.atan2(ai, ar) / 2, sr = mod * Math.cos(ang), si = mod * Math.sin(ang);
        if (sr < 0) { sr = -sr; si = -si; }
        var den = sr * sr + si * si, n = den > 1e-9 ? (xr * sr + xi * si) / den : 1;
        var xx = dx0 + (dx1 - dx0) * j / 80, yy = yb - Math.min(2.3, Math.abs(n)) * (yb - y1);
        if (j) c.lineTo(xx, yy); else c.moveTo(xx, yy);
      }
      c.lineWidth = 1.75; c.strokeStyle = C.accent; c.stroke();
      if (gap > 0.6) {
        c.globalAlpha = stSpan(gap, 0.6, 0.95);
        var gx0 = dx0 + (dx1 - dx0) * (3 - gap) / 6, gx1 = dx0 + (dx1 - dx0) * (3 + gap) / 6;
        c.strokeStyle = C.ink2; c.fillStyle = C.ink2; c.lineWidth = 1;
        seg(c, gx0 + 2, 85, gx1 - 2, 85);
        c.beginPath(); c.moveTo(gx0 + 1, 85); c.lineTo(gx0 + 4.5, 83); c.lineTo(gx0 + 4.5, 87); c.closePath(); c.fill();
        c.beginPath(); c.moveTo(gx1 - 1, 85); c.lineTo(gx1 - 4.5, 83); c.lineTo(gx1 - 4.5, 87); c.closePath(); c.fill();
        label(c, C, '2Δ', (gx0 + gx1) / 2, 79, { size: 11, align: 'center', color: C.ink2 });
        c.globalAlpha = 1;
      }
    }

    /* Eliashberg: model α²F(ω) (acoustic + optical humps) filled from low to high ω;
       λ = 2∫α²F/ω dω and ω_log accumulate, Tc from Allen–Dynes with μ* = 0.10. Final λ ≈ 1.16, ω_log ≈ 308 K, Tc ≈ 26 K. */
    var ELI = (function () {
      var N = 160, wmax = 800, dw = wmax / N, f = [], lam = [0], lnw = [0], peak = 0;
      for (var i = 0; i < N; i++) {
        var x = (i + 0.5) * dw;
        var v = 0.88 * Math.exp(-Math.pow(x - 275, 2) / (2 * 62 * 62)) * x * x / (x * x + 90 * 90) +
          0.60 * Math.exp(-Math.pow(x - 640, 2) / (2 * 50 * 50));
        f.push(v); peak = Math.max(peak, v);
        lam.push(lam[i] + 2 * v / x * dw); lnw.push(lnw[i] + 2 * v / x * Math.log(x) * dw);
      }
      return { N: N, wmax: wmax, f: f, lam: lam, lnw: lnw, peak: peak };
    })();
    function eliAt(w) {   // running λ, ω_log and Allen–Dynes Tc for modes up to ω
      var q = stClamp(w / ELI.wmax) * ELI.N, i = Math.min(ELI.N - 1, Math.floor(q)), k = q - i;
      var lam = lerp(ELI.lam[i], ELI.lam[i + 1], k), ln = lerp(ELI.lnw[i], ELI.lnw[i + 1], k);
      var wlog = lam > 1e-6 ? Math.exp(ln / lam) : 0, mu = 0.10, d = lam - mu * (1 + 0.62 * lam);
      return { lam: lam, wlog: wlog, tc: d > 0 ? wlog / 1.2 * Math.exp(-1.04 * (1 + lam) / d) : 0 };
    }
    function drawEliashberg(c, C, W, H, t) {
      var P = 9, tt = md(t, P);
      var wf = ELI.wmax * stClamp((tt - 0.5) / 5.2), fade = 1 - stSpan(tt, 8.2, 8.8);
      var m = 10, rw = Math.round(Math.max(84, Math.min(120, W * 0.3)));
      var px0 = m + 2, px1 = W - m - rw - 14, yb = 98, yt = 32;
      function X(w) { return px0 + (px1 - px0) * w / ELI.wmax; }
      function Y(i) { return yb - (yb - yt) * ELI.f[i] / ELI.peak; }
      label(c, C, 'α²F(ω)', px0, 19, { size: 11, color: C.ink2 });
      c.strokeStyle = C.axis; c.lineWidth = 1; seg(c, px0, yb + 0.5, px1, yb + 0.5);
      c.beginPath();
      for (var i = 0; i < ELI.N; i++) { var x = X((i + 0.5) * ELI.wmax / ELI.N); if (i) c.lineTo(x, Y(i)); else c.moveTo(x, Y(i)); }
      c.setLineDash([2, 3]); c.strokeStyle = C.muted; c.stroke(); c.setLineDash([]);
      var n = Math.floor(wf / ELI.wmax * ELI.N);
      if (n > 1 && fade > 0.01) {
        c.globalAlpha = fade;
        c.beginPath(); c.moveTo(X(0), yb);
        for (var j = 0; j < n; j++) c.lineTo(X((j + 0.5) * ELI.wmax / ELI.N), Y(j));
        c.lineTo(X((n - 0.5) * ELI.wmax / ELI.N), yb); c.closePath();
        c.fillStyle = stAlpha(C.accent, 0.2); c.fill();
        c.beginPath();
        for (var q = 0; q < n; q++) { var xq = X((q + 0.5) * ELI.wmax / ELI.N); if (q) c.lineTo(xq, Y(q)); else c.moveTo(xq, Y(q)); }
        c.lineWidth = 1.75; c.strokeStyle = C.accent; c.stroke();
        if (wf < ELI.wmax) {
          var xs = X((n - 0.5) * ELI.wmax / ELI.N);
          c.strokeStyle = stAlpha(C.accent, 0.5); c.lineWidth = 1; seg(c, xs + 0.5, Y(n - 1), xs + 0.5, yb);
          dot(c, xs, Y(n - 1), 2.6, C.accent);
        }
        c.globalAlpha = 1;
      }
      var r = eliAt(wf), rx = W - m - rw;
      c.globalAlpha = Math.min(fade, stSpan(tt, 0, 0.4));
      stSym(c, C, [['λ = ' + r.lam.toFixed(2)]], rx, 42, { size: 12, weight: '600', color: C.ink });
      stRound(c, rx, 50, rw, 4, 2); c.fillStyle = C.grid; c.fill();
      if (r.lam > 0.005) { stRound(c, rx, 50, Math.max(4, rw * Math.min(1, r.lam / 1.4)), 4, 2); c.fillStyle = C.accent; c.fill(); }
      stText(c, C, 'Tc ≈ ' + (r.tc < 0.5 ? '0' : String(Math.round(r.tc))) + ' K', rx, 78, { size: 12, weight: '600', color: C.ink });
      c.globalAlpha = 1;
    }

    /* Josephson: with a voltage across S|I|S the phase difference φ = θR − θL advances steadily (2eV/ħ),
       the supercurrent I = Ic sin φ oscillates and pairs shuttle through the barrier (charge ∝ 1 − cos φ). */
    function drawJosephson(c, C, W, H, t) {
      var P = 6, tt = md(t, P), wJ = TAU / 3, phi = wJ * tt;
      var m = 10, tw = Math.round(Math.max(84, Math.min(140, W * 0.34)));
      var jx0 = m, jx1 = W - m - tw - 16, bx = Math.round((jx0 + jx1) / 2), bw = 8;
      var y0 = 12, y1 = 78, yc = (y0 + y1) / 2;
      var lx1 = bx - bw / 2, rx0 = bx + bw / 2;
      // superconductors and barrier
      stRound(c, jx0, y0, lx1 - jx0, y1 - y0, 6); c.fillStyle = C.track; c.fill();
      stRound(c, rx0, y0, jx1 - rx0, y1 - y0, 6); c.fillStyle = C.track; c.fill();
      c.fillStyle = C.axis; c.fillRect(lx1 + 1.5, y0, bw - 3, y1 - y0);
      // bias circuit with a voltage source
      var lcx = (jx0 + lx1) / 2, rcx = (rx0 + jx1) / 2, wy = 98;
      c.strokeStyle = stAlpha(C.ink2, 0.6); c.lineWidth = 1;
      c.beginPath(); c.moveTo(lcx, y1); c.lineTo(lcx, wy); c.lineTo(bx - 8, wy); c.moveTo(bx + 8, wy); c.lineTo(rcx, wy); c.lineTo(rcx, y1); c.stroke();
      ring(c, bx, wy, 8, stAlpha(C.ink2, 0.8), 1, C.surface);
      label(c, C, 'V', bx, wy + 0.5, { size: 10.5, weight: '600', color: C.ink2, align: 'center', base: 'middle' });
      // phasors: the phases wind in opposite senses so that φ = θR − θL grows at wJ
      [[lcx, -Math.PI / 2 - phi / 2], [rcx, -Math.PI / 2 + phi / 2]].forEach(function (p) {
        ring(c, p[0], yc, 11, stAlpha(C.accent, 0.45), 1, C.surface);
        arrow(c, p[0], yc, p[0] + 10 * Math.cos(p[1]), yc + 10 * Math.sin(p[1]), C.accent, 4.5, 1.5);
        dot(c, p[0], yc, 1.6, C.accent);
      });
      // Cooper pairs: displacement follows the transferred charge, so they move with the current
      var sp = 26, shift = sp * (1 - Math.cos(phi)) / 2;
      for (var lane = 0; lane < 2; lane++) {
        var ly = lane ? yc + 22 : yc - 22, off = lane ? sp / 2 : 0;
        for (var j = -8; j <= 8; j++) {
          var x = bx + j * sp + off - sp / 4 + shift;
          if (x < jx0 + 4 || x > jx1 - 4) continue;
          var a = stClamp((x - jx0 - 4) / 10) * stClamp((jx1 - 4 - x) / 10);
          var w = Math.max(0, 1 - Math.abs(x - bx) / 9), col = mix(C.accent, C.warm, w);
          c.globalAlpha = a;
          c.strokeStyle = col; c.lineWidth = 1; seg(c, x - 3, ly, x + 3, ly);
          dot(c, x - 3, ly, 2.3, col); dot(c, x + 3, ly, 2.3, col);
        }
      }
      c.globalAlpha = 1;
      // I(t) = Ic sin φ, the last 4 s
      var tx0 = W - m - tw, tx1 = W - m, ty = 58, amp = 20, Tw = 4;
      stSym(c, C, [['I = I'], ['c', 1], [' sin φ']], tx0, 20, { size: 11, color: C.ink2 });
      c.strokeStyle = C.axis; c.lineWidth = 1; seg(c, tx0, ty + 0.5, tx1, ty + 0.5);
      c.beginPath();
      for (var i = 0; i <= 64; i++) {
        var s = tt - Tw + Tw * i / 64, xx = tx0 + (tx1 - tx0 - 4) * i / 64, yy = ty - amp * Math.sin(wJ * s);
        if (i) c.lineTo(xx, yy); else c.moveTo(xx, yy);
      }
      c.lineWidth = 1.75; c.strokeStyle = C.accent; c.stroke();
      dot(c, tx1 - 4, ty - amp * Math.sin(phi), 3, C.warm);
    }

    /* Shared Brillouin-zone frame and legend for the two pairing-symmetry cards. */
    function zoneLayout(c, C, W, H, rows, S, over) {   // over: how far drawing may spill past the zone edge
      var lw = 0;
      for (var i = 0; i < rows.length; i++) lw = Math.max(lw, textW(c, C, rows[i], 11));
      lw += 22;
      var gap = 16, total = S + 2 * over + gap + lw, x0 = over + Math.max(10, Math.round((W - total) / 2));
      var y0 = Math.round((H - S) / 2);
      return { x0: x0, y0: y0, S: S, cx: x0 + S / 2, cy: y0 + S / 2, h: S / 2, lx: x0 + S + over + gap };
    }
    function zoneFrame(c, C, Z) {
      stRound(c, Z.x0, Z.y0, Z.S, Z.S, 4); c.fillStyle = C.surface; c.fill();
      c.lineWidth = 1; c.strokeStyle = C.axis; c.stroke();
    }
    function bandSwatch(c, C, color) {
      return function (x, y) {
        c.lineCap = 'round'; c.lineWidth = 5; c.strokeStyle = stAlpha(color, 0.55); seg(c, x - 5, y, x + 5, y);
        c.lineWidth = 1; c.strokeStyle = stAlpha(C.ink2, 0.7); seg(c, x - 5, y, x + 5, y); c.lineCap = 'butt';

      legend(c, C, Z.lx, y + 24, rows[1], 12, bandSwatch(c, C, C.warm));
      c.globalAlpha = arrowA;
      legend(c, C, Z.lx, y + 48, rows[2], 12, function (x, yy) { arrow(c, x - 6, yy, x + 6, yy, C.ink, 4.5, 1.4); });

    }

    /* d-wave: hole-like cuprate Fermi surface, ε = −2t(cos kx + cos ky) − 4t′ cos kx cos ky − μ (t′ = −0.3t, μ = −t);

      function eps(kx, ky) { return -2 * (Math.cos(kx) + Math.cos(ky)) + 1.2 * Math.cos(kx) * Math.cos(ky) + 1.0; }

      for (var i = 0; i <= n; i++) {   // arc around the (π, π) corner, from (π, k0) to (k0, π)
        var a = Math.PI * (1.5 - 0.5 * i / n), dx = Math.cos(a), dy = Math.sin(a), lo = 0, hi = Math.PI;

    })();
    function drawDwave(c, C, W, H, t) {
      var P = 8, tt = md(t, P);
      var amp = stSpan(tt, 0.3, 1.5) * (1 - stSpan(tt, 7.0, 7.8));
      var qa = stSpan(tt, 1.6, 2.2) * (1 - stSpan(tt, 6.6, 7.2));
      var rows = ['Δ > 0', 'Δ < 0', 'Q = (π, π)'], Z = zoneLayout(c, C, W, H, rows, H - 20, 0);
      zoneFrame(c, C, Z);
      c.save();

      c.setLineDash([2, 3]); c.strokeStyle = stAlpha(C.muted, 0.55); c.lineWidth = 1;
      seg(c, Z.x0, Z.y0, Z.x0 + Z.S, Z.y0 + Z.S); seg(c, Z.x0, Z.y0 + Z.S, Z.x0 + Z.S, Z.y0); c.setLineDash([]);
      var A = DWV.arc, n = DWV.n, half = n / 2, bw = 5.5 * amp;
      for (var q = 0; q < 4; q++) {

          for (var dir = 0; dir < 2; dir++) {
            for (var s = 0; s <= i1 - i0; s++) {

              var X = Z.cx + sx * A[i][0] / Math.PI * Z.h, Y = Z.cy - sy * A[i][1] / Math.PI * Z.h;
              var tx = sx * (A[inx][0] - A[ip][0]), ty = -sy * (A[inx][1] - A[ip][1]), tl = Math.sqrt(tx * tx + ty * ty) || 1;
              var o = (dir ? -1 : 1) * bw * Math.abs(A[i][2]);

        var x1 = Z.cx + hs / Math.PI * Z.h, y1 = Z.cy - (Math.PI - hs) / Math.PI * Z.h;
        var x2 = Z.cx + (hs - Math.PI) / Math.PI * Z.h, y2 = Z.cy + hs / Math.PI * Z.h;

        c.globalAlpha = qa * (0.5 + 0.5 * pulse);

        c.globalAlpha = 1;

    }

    /* s±: hole pockets at Γ (Δ > 0, blue) and electron pockets at the zone corners M (Δ < 0, orange) of the
       2-Fe Brillouin zone; the spin-fluctuation wave vector Q links a hole pocket to an electron pocket. */
    function drawSpm(c, C, W, H, t) {
      var P = 8, tt = md(t, P);
      var amp = stSpan(tt, 0.3, 1.5) * (1 - stSpan(tt, 7.0, 7.8));
      var qa = stSpan(tt, 1.6, 2.2) * (1 - stSpan(tt, 6.6, 7.2));
      // zone corners are M; the electron pockets are drawn whole, spilling into the neighbouring zones

      zoneFrame(c, C, Z);
      function pocket(fn, color) {
        if (amp > 0.01) { c.lineWidth = 4 * amp; c.strokeStyle = stAlpha(color, 0.55); fn(); c.stroke(); }
        c.lineWidth = 1; c.strokeStyle = stAlpha(C.ink2, 0.75); fn(); c.stroke();
      }
      [0.24, 0.38].forEach(function (r) { pocket(function () { c.beginPath(); c.arc(Z.cx, Z.cy, r * Math.PI * u, 0, TAU); }, C.accent); });
      for (var q = 0; q < 4; q++) {
        var mx = Z.cx + (q & 1 ? -1 : 1) * Z.h, my = Z.cy + (q & 2 ? -1 : 1) * Z.h;
        [[0.4, 0.22], [0.22, 0.4]].forEach(function (e) {
          pocket(function () { c.beginPath(); c.ellipse(mx, my, e[0] * Math.PI * u, e[1] * Math.PI * u, 0, 0, TAU); }, C.warm);

      if (qa > 0.01) {

        var pulse = 0.55 + 0.45 * Math.sin(tt * TAU / 1.6), r0 = 0.38 * Math.PI * u * Math.SQRT1_2, kd = (1 - 0.274 * Math.SQRT1_2) * Math.PI * u;
        var x1 = Z.cx + r0 + 2, y1 = Z.cy - r0 - 2, x2 = Z.cx + kd - 2, y2 = Z.cy - kd + 2;
        c.globalAlpha = qa * (0.5 + 0.5 * pulse);
        arrow(c, x1, y1, x2, y2, C.ink, 5.5, 1.5);
        c.globalAlpha = qa * pulse;
        ring(c, x2 + 2, y2 - 2, 3 + 1.5 * pulse, C.ink, 1.2);
        c.globalAlpha = 1;
      }
      zoneLegend(c, C, Z, rows, Math.max(qa, 0.35));
    }

    /* Topological: a nanowire on a superconductor. As the bulk gaps out, two Majorana zero modes appear at the
       ends with |ψ|² ∝ exp(−x/ξ) from each end; the side spectrum shows bulk levels pushed off E = 0 and a level left at 0. */
    function drawTopo(c, C, W, H, t) {
      var P = 8, tt = md(t, P);
      var g = stSpan(tt, 1.2, 2.8) * (1 - stSpan(tt, 6.6, 7.6));
      var m = 10, ew = 40, mx1 = W - m - ew - 16;
      var sy0 = 87, sy1 = 108, wy0 = 80, wy1 = 87, wyc = (wy0 + wy1) / 2;
      stRound(c, m, sy0, mx1 - m, sy1 - sy0, 4); c.fillStyle = C.track; c.fill();
      label(c, C, 'superconductor', (m + mx1) / 2, (sy0 + sy1) / 2 + 1, { size: 10.5, color: C.ink2, align: 'center', base: 'middle' });
      var wx0 = m + 14, wx1 = mx1 - 14, L = wx1 - wx0, xi = 0.1 * L, yb = 73, amp = 40;
      function edge(s) { return (1 - Math.exp(-5 * s)) * Math.exp(-s) / 0.582; }   // vanishes at the wall, then decays as exp(−x/ξ)
      stRound(c, wx0, wy0, L, wy1 - wy0, 3.5); c.fillStyle = mix(C.axis, C.ink2, 0.35); c.fill();
      // |ψ|²: a bulk standing wave turns into two end-localised modes

        var fb = 0.28 * (1 - Math.cos(TAU * 4 * u)) / 2, fe = edge(u * L / xi) + edge((1 - u) * L / xi);
        c.lineTo(x, yb - amp * ((1 - g) * fb + g * fe));
      }
      c.lineTo(wx1, yb); c.closePath();

      c.fillStyle = stAlpha(C.warm, 0.08 + 0.12 * g); c.fill();
      c.lineWidth = 1.5; c.strokeStyle = col; c.stroke();
      c.strokeStyle = C.axis; c.lineWidth = 1; seg(c, wx0, yb + 0.5, wx1, yb + 0.5);
      if (g > 0.01) {
        var br = 0.75 + 0.25 * Math.sin(tt * TAU / 2.4);
        [wx0 + 1, wx1 - 1].forEach(function (x) { glow(c, x, wyc, 10, C.warm, 0.7 * g * br); dot(c, x, wyc, 2.6, C.warm); });
        c.globalAlpha = g;
        var lw = textW(c, C, 'Majorana modes', 11), lx = (wx0 + wx1) / 2;
        label(c, C, 'Majorana modes', lx, 21, { size: 11, color: C.ink2, align: 'center' });
        c.strokeStyle = stAlpha(C.ink2, 0.45); c.lineWidth = 1;
        seg(c, lx - lw / 2 - 5, 17, wx0 + 7, yb - amp + 4); seg(c, lx + lw / 2 + 5, 17, wx1 - 7, yb - amp + 4);
        c.globalAlpha = 1;

      label(c, C, 'E', ex - 5, 22, { size: 11, color: C.muted, base: 'middle', align: 'right' });
      c.strokeStyle = stAlpha(C.ink2, 0.65); c.lineWidth = 1.25;
      for (var n = 0; n < 5; n++) {
        var e0 = (n + 0.5) * 6, e = Math.sqrt(e0 * e0 + 256 * g * g);
        seg(c, ex + 8, ey - e, W - m, ey - e); seg(c, ex + 8, ey + e, W - m, ey + e);
      }
      if (g > 0.01) { c.globalAlpha = g; c.lineWidth = 2; c.strokeStyle = C.warm; seg(c, ex + 8, ey, W - m, ey); c.globalAlpha = 1; }
    }

    /* Moiré: two triangular lattices twisted by θ (drawn at 5× the true angle so the pattern is visible; moiré period
       a / (2 sin(θ/2))). The two central bands flatten as θ → θm ≈ 1.1° (bandwidth ∝ |θ − θm|). */
    function drawMoire(c, C, W, H, t) {
      var P = 10, tt = md(t, P);
      var k = stSpan(tt, 0.6, 4.2) * (1 - stSpan(tt, 6.6, 9.6));
      var th = 2.0 - 0.9 * k, thm = 1.1, w = 0.04 + 0.96 * Math.abs(th - thm) / 0.9;
      var m = 10, mw = Math.round(Math.max(104, Math.min(170, W * 0.42))), mh = H - 2 * m;
      var cx = m + mw / 2, cy = m + mh / 2, a = 6.5, ang = th * 5 * Math.PI / 180;
      c.save();
      stRound(c, m, m, mw, mh, 8); c.fillStyle = C.surface; c.fill(); c.clip();
      var N = Math.ceil(Math.sqrt(mw * mw + mh * mh) / 2 / a * 1.25);
      for (var layer = 0; layer < 2; layer++) {
        var rot = (layer ? 0.5 : -0.5) * ang + 0.15 * Math.sin(tt * TAU / P), cs = Math.cos(rot), sn = Math.sin(rot);

      }

      var bx0 = m + mw + 16, bx1 = W - m, ey = 62;
      c.strokeStyle = C.axis; c.lineWidth = 1; seg(c, bx0 + 0.5, 28, bx0 + 0.5, 96);
      function band(fn, color, lw) {
        c.beginPath();
        for (var q = 0; q <= 40; q++) { var u = q / 40, xx = bx0 + 4 + (bx1 - bx0 - 4) * u, yy = ey - fn(u); if (q) c.lineTo(xx, yy); else c.moveTo(xx, yy); }
        c.lineWidth = lw; c.strokeStyle = color; c.stroke();
      }
      band(function (u) { return 21 + 8 * (1 - Math.sin(Math.PI * u)); }, C.muted, 1.25);
      band(function (u) { return -21 - 8 * (1 - Math.sin(Math.PI * u)); }, C.muted, 1.25);
      band(function (u) { return w * 15 * Math.sin(Math.PI * u) + 1.2; }, C.accent, 1.75);
      band(function (u) { return -w * 15 * Math.sin(Math.PI * u) - 1.2; }, C.accent, 1.75);
      stTag(c, C, 'θ = ' + th.toFixed(2) + '°', bx0, 18, { size: 11, align: 'left', bg: C.surface, ring: k > 0.9 ? C.accent : C.axis });
      if (k > 0.6) { c.globalAlpha = stSpan(k, 0.6, 0.95); label(c, C, 'flat bands', bx0 + 4, 108, { size: 11, color: C.accent, weight: '600' }); c.globalAlpha = 1; }
    }

    /* NbTi / Nb3Sn magnet: solenoid cut along its axis (⊙ on top, ⊗ below, so B points left to right inside),
       current pulses run turn by turn along the winding, uniform field through the bore, fringing past the ends. */
    function drawMagnet(c, C, W, H, t) {
      var P = 6, tt = md(t, P);
      var m = 10, x0 = Math.round(W * 0.2), x1 = Math.round(W * 0.8), yT = 18, yB = 80, yc = (yT + yB) / 2, r = 4.5;
      var n = Math.max(6, Math.floor((x1 - x0) / 13) + 1), dx = (x1 - x0) / (n - 1), Lh = (x1 - x0) / 2, xm = (x0 + x1) / 2;
      c.save();
      c.beginPath(); c.rect(m, m, W - 2 * m, 92 - m); c.clip();
      c.setLineDash([5, 5]); c.lineDashOffset = -tt * 20; c.lineWidth = 1.2; c.strokeStyle = stAlpha(C.ink2, 0.7);
      for (var i = -2; i <= 2; i++) {
        c.beginPath();
        for (var x = m; x <= W - m; x += 3) {
          var d = Math.max(0, Math.abs(x - xm) - Lh), y = yc + i * 9 * (1 + 1.1 * d * d / (d * d + 500));
          if (x === m) c.moveTo(x, y); else c.lineTo(x, y);
