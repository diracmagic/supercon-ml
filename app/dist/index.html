<title>Supercon Progress</title>
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Supercon">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230d366b'/%3E%3Cstop offset='1' stop-color='%233987e5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='72' y='72' width='880' height='880' rx='210' fill='url(%23g)'/%3E%3Cpath d='M250 690H455L478 676 494 630 506 540 518 462 536 432 566 420 790 336' fill='none' stroke='%23fff' stroke-width='60' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 1024 1024" aria-hidden="true">
        <defs>
          <linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0d366b"/>
            <stop offset="1" stop-color="#3987e5"/>
          </linearGradient>
        </defs>
        <rect x="72" y="72" width="880" height="880" rx="210" fill="url(#logo-g)"/>
        <path d="M250 690H455L478 676 494 630 506 540 518 462 536 432 566 420 790 336" fill="none" stroke="#fff" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1 id="app-name">Supercon Progress</h1>
        <p id="project"></p>
      </div>
    </div>
    <div class="views" role="tablist" aria-label="View">
      <button id="view-progress" type="button" role="tab" aria-selected="true">Progress</button>
      <button id="view-candidates" type="button" role="tab" aria-selected="false">Candidates</button>
      <button id="view-demos" type="button" role="tab" aria-selected="false"><span class="lbl-long">Physics demos</span><span class="lbl-short">Demos</span></button>
      <button id="view-learn" type="button" role="tab" aria-selected="false"><span class="lbl-long">Theory &amp; materials</span><span class="lbl-short">Learn</span></button>
      <button id="view-papers" type="button" role="tab" aria-selected="false"><span class="lbl-long">News &amp; papers</span><span class="lbl-short">News</span></button>
      <button id="view-ai" type="button" role="tab" aria-selected="false"><span class="lbl-long">AI × superconductors</span><span class="lbl-short">AI</span></button>
      <button id="view-authors" type="button" role="tab" aria-selected="false">Cite</button>
    </div>
    <div class="controls">
      <a id="team-login" class="btn team-login" href="https://github.com/login?return_to=%2Fdiracmagic%2Fsupercon-research-notes" title="Continue with GitHub. Access depends on your account permissions." target="_blank" rel="noopener noreferrer">Login for team</a>
      <span class="stamp"><i id="live-dot" class="live-dot"></i><span id="stamp"></span></span>
      <button id="btn-refresh" class="btn icon-only" type="button"></button>
      <button id="btn-theme" class="btn icon-only" type="button"></button>
    </div>
  </header>

  <div id="update" class="update" role="status" hidden></div>
  <div id="notice" class="notice" role="status" hidden></div>

  <main id="main" hidden>
    <section id="pipeline" class="card pipeline"></section>
    <section id="kpis" class="kpis"></section>
    <section id="models-card" class="card models-card"></section>
    <div class="grid">
      <div class="col">
        <section id="stages-card" class="card"></section>
        <section id="results-card" class="card"></section>
      </div>
      <div class="col">
        <section id="activity-card" class="card"></section>
        <section id="github-card" class="card"></section>
        <section id="phone-card" class="card phone-card"></section>
      </div>
    </div>
    <section id="details-card" class="card details-card" hidden></section>
  </main>

  <section id="candidates" class="cands" hidden>
    <section id="candidates-card" class="card candidates-card"></section>
  </section>

  <section id="ai" class="ai" hidden></section>

  <section id="demos" class="card demos" hidden></section>

  <section id="learn" class="learn" hidden></section>

  <section id="papers" class="papers" hidden></section>

  <section id="authors" class="authors" hidden></section>

  <footer id="foot" class="foot"></footer>
</div>
