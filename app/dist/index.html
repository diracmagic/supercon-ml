<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Supercon Progress</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230d366b'/%3E%3Cstop offset='1' stop-color='%233987e5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='72' y='72' width='880' height='880' rx='210' fill='url(%23g)'/%3E%3Cpath d='M250 690H455L478 676 494 630 506 540 518 462 536 432 566 420 790 336' fill='none' stroke='%23fff' stroke-width='60' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --font: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f1f0ec;
  --hover: #ecebe6;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --accent-track: #cde2fb;
  --accent-wash: rgba(42, 120, 214, 0.07);
  --good: #0ca30c;
  --warning: #fab219;
  --critical: #d03b3b;
  --warm: #eb6834;
  --tip-shadow: 0 6px 20px rgba(11, 11, 11, 0.12);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #242422;
    --hover: #2b2b29;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-track: #0d366b;
    --accent-wash: rgba(57, 135, 229, 0.12);
    --warm: #d95926;
    --tip-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #242422;
  --hover: #2b2b29;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --accent: #3987e5;
  --accent-track: #0d366b;
  --accent-wash: rgba(57, 135, 229, 0.12);
  --warm: #d95926;
  --tip-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background: var(--page);
  color: var(--ink);
  font: 14px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration-color: var(--axis); text-underline-offset: 2px; }
a:hover { text-decoration-color: currentColor; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
button { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }

.wrap { max-width: 1200px; margin: 0 auto; padding: 20px 24px 28px; }
@media (max-width: 600px) { .wrap { padding: 16px; } }

/* header */
.top { display: flex; align-items: center; flex-wrap: wrap; gap: 12px 16px; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 12px; flex: 1 1 340px; min-width: 0; }
.logo { width: 36px; height: 36px; flex: none; }
.brand h1 { font-size: 17px; font-weight: 600; line-height: 1.3; }
.brand p { font-size: 13px; line-height: 1.35; color: var(--ink-2); }
.controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.stamp { display: inline-flex; align-items: center; gap: 6px; margin-right: 4px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--axis); }
.live-dot.is-live { background: var(--good); }
.live-dot.is-off { background: var(--muted); }
.btn {
  height: 32px; min-width: 32px; padding: 0 10px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); cursor: pointer; font-size: 13px;
}
.btn:hover { background: var(--hover); }
.btn svg { width: 16px; height: 16px; }
.btn.icon-only { padding: 0; width: 32px; }
.btn.small { height: 28px; font-size: 12px; }
.btn.is-busy svg { animation: spin 0.9s linear infinite; }

.notice {
  display: flex; align-items: flex-start; gap: 8px;
  margin-bottom: 16px; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface-2); color: var(--ink-2); font-size: 13px;
}
.notice svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 12px; }
.card-head h2 { font-size: 15px; font-weight: 600; line-height: 1.35; }
.card-head p { margin-top: 2px; font-size: 12.5px; color: var(--ink-2); }
.muted-p { font-size: 13px; color: var(--ink-2); }

/* summary tiles */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
@media (max-width: 760px) { .kpis { grid-template-columns: minmax(0, 1fr); } }

/* animated pipeline */
.pipeline { margin-bottom: 12px; padding-bottom: 8px; }
.pipe-head { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 4px 24px; }
.hero { font-size: 48px; font-weight: 600; line-height: 1; letter-spacing: -0.01em; }
.pipe-meta { padding-bottom: 4px; min-width: 0; }
.pipe-strong { font-size: 14px; font-weight: 600; }
.pipe-meta .tile-sub { margin-top: 2px; }
.pipe { margin-top: 14px; }
.pipe-svg { display: block; overflow: visible; }
.pipe-track { stroke: var(--accent-track); stroke-width: 6; stroke-linecap: round; }
.pipe-fill { stroke: var(--accent); stroke-width: 6; stroke-linecap: round; }
.pipe-comet { fill: #fff; }
.pipe-halo { fill: var(--accent); }
.pipe-label { font-size: 12px; fill: var(--ink-2); }
.pipe-label.is-current { fill: var(--ink); font-weight: 600; }
.pipe-pop { transform-box: fill-box; transform-origin: center; animation: pop 0.55s cubic-bezier(0.2, 0.8, 0.3, 1.35) both; }
@keyframes pop { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .pipe-pop { animation: none; } }
.tile-label { font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.tile-value { font-size: 26px; font-weight: 600; line-height: 1.15; }
.tile-value small { margin-left: 4px; font-size: 14px; font-weight: 500; color: var(--ink-2); }
.tile-value.dim { color: var(--muted); }
.tile-status { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 600; line-height: 30px; }
.tile-status svg { width: 22px; height: 22px; display: block; }
.tile-sub { margin-top: 8px; font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.tile-sub + .tile-sub { margin-top: 2px; }
.tile-sub.muted { color: var(--muted); }

/* layout */
.grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 16px; min-width: 0; }

/* status glyphs */
.f-good { fill: var(--good); }
.f-warning { fill: var(--warning); }
.f-critical { fill: var(--critical); }
.f-accent { fill: var(--accent); }
.f-surface { fill: var(--surface); }
.s-white { stroke: #fff; }
.s-accent { stroke: var(--accent); }
.s-axis { stroke: var(--axis); }
.s-muted { stroke: var(--muted); }
.s-track { stroke: var(--accent-track); }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
.spin { animation: spin 0.9s linear infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .pulse, .spin, .btn.is-busy svg { animation: none; } }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 8px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2);
  font-size: 12px; line-height: 20px; white-space: nowrap;
}
.chip i { width: 8px; height: 8px; border-radius: 50%; }
.d-done, .d-success { background: var(--good); }
.d-active, .d-running, .d-queued { background: var(--accent); }
.d-blocked, .d-attention { background: var(--warning); }
.d-pending { background: var(--axis); }
.d-failure { background: var(--critical); }
.d-cancelled { background: var(--muted); }

/* stages */
.steps { list-style: none; margin: 0; padding: 0; }
.step { position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; padding: 10px 10px 10px 6px; border-radius: 10px; }
.step:not(:last-child)::before { content: ""; position: absolute; left: 17px; top: 36px; bottom: -12px; width: 2px; background: var(--grid); }
.step.is-active { background: var(--accent-wash); }
.step-icon svg { width: 24px; height: 24px; display: block; position: relative; }
.step-head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; min-height: 24px; }
.step-name { font-weight: 600; }
.step-date { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.step-detail { margin-top: 2px; font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }

/* activity */
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.feed li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; }
.feed time { padding-top: 1px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.feed p { font-size: 13px; overflow-wrap: anywhere; }
@media (max-width: 420px) { .feed li { grid-template-columns: minmax(0, 1fr); gap: 0; } }
.link-btn { margin-top: 10px; padding: 0; border: 0; background: none; cursor: pointer; font-size: 12.5px; color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--axis); text-underline-offset: 2px; }
.link-btn:hover { color: var(--ink); }
.head-link { font-size: 12.5px; color: var(--ink-2); }

/* github */
.sub-h { margin: 4px 0 2px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.sub-h + .muted-p { margin: 4px 0 8px; }
.gh-list { list-style: none; margin: 0 0 8px; padding: 0; }
.gh-list li + li { border-top: 1px solid var(--grid); }
.gh-item { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; padding: 8px 0; color: inherit; text-decoration: none; }
.gh-item:hover .gh-title { text-decoration: underline; text-decoration-color: var(--axis); }
.gh-icon svg { width: 18px; height: 18px; display: block; margin-top: 1px; color: var(--muted); }
.gh-text { display: grid; min-width: 0; }
.gh-title { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gh-meta { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sha { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }

/* results */
.figure { margin: 0 0 16px; }
.fig-title { margin-bottom: 8px; font-size: 13px; font-weight: 600; }
.empty { display: flex; align-items: center; gap: 12px; padding: 18px 16px; border-radius: 10px; background: var(--surface-2); color: var(--ink-2); font-size: 13px; }
.empty svg { width: 28px; height: 28px; flex: none; color: var(--muted); }
.chart { position: relative; }
.plot { display: block; overflow: visible; }
.plot:focus { outline: none; }
.plot:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
.plot .grid-line { stroke: var(--grid); stroke-width: 1; }
.plot .axis-line { stroke: var(--axis); stroke-width: 1; }
.plot .ref-line { stroke: var(--ink-2); stroke-width: 1; }
.plot .ref-label { font-size: 11px; fill: var(--ink-2); }
.plot .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.plot .series-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.plot .series-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.plot .hover-dot { fill: none; stroke: var(--accent); stroke-width: 2; }
.plot .crosshair { stroke: var(--axis); stroke-width: 1; }
.plot .end-label { font-size: 12px; font-weight: 600; fill: var(--ink); }
.tooltip {
  position: absolute; z-index: 2; pointer-events: none;
  transform: translate(-50%, calc(-100% - 10px));
  min-width: 140px; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); box-shadow: var(--tip-shadow);
  font-size: 12px; color: var(--ink-2); white-space: nowrap;
}
.tooltip b { display: block; font-size: 14px; color: var(--ink); }
.tip-row { display: block; }
.tip-row .key { display: inline-block; width: 12px; height: 2px; margin-right: 6px; border-radius: 1px; background: var(--accent); vertical-align: middle; }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { padding: 6px 8px; border-bottom: 1px solid var(--axis); text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.tbl td { padding: 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tr.ours td { background: var(--accent-wash); }
.tbl .notes { color: var(--ink-2); }
.tag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--accent-track); color: var(--ink); font-size: 11px; line-height: 18px; white-space: nowrap; }
.note { margin-top: 10px; font-size: 12px; color: var(--muted); }

/* view switch and physics demos */
.views { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); }
.views button { padding: 5px 12px; border: 0; border-radius: 7px; background: none; color: var(--ink-2); font-size: 13px; cursor: pointer; }
.views button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(11, 11, 11, 0.08); }
.demos { margin-bottom: 12px; }
.demo-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.demo-tab { padding: 5px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--ink-2); font-size: 13px; cursor: pointer; }
.demo-tab:hover { background: var(--hover); }
.demo-tab[aria-selected="true"] { border-color: var(--ink); background: var(--ink); color: var(--surface); }
.demo-stage { overflow: hidden; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.demo-stage canvas { display: block; width: 100%; }
.demo-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-top: 12px; }
.slider { display: flex; flex: 1 1 240px; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }
.slider input[type="range"] { flex: 1; min-width: 120px; accent-color: var(--accent); }
.slider output { min-width: 62px; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.demo-readout { color: var(--ink); font-size: 13px; font-weight: 600; }
.demo-caption { max-width: 860px; margin-top: 12px; color: var(--ink-2); font-size: 13.5px; line-height: 1.6; }

.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; margin-top: 20px; font-size: 12px; color: var(--muted); }
.foot a { color: var(--ink-2); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 1024 1024" aria-hidden="true">
        <defs>
          <linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0d366b"/>
            <stop offset="1" stop-color="#3987e5"/>
          </linearGradient>
        </defs>
        <rect x="72" y="72" width="880" height="880" rx="210" fill="url(#logo-g)"/>
        <path d="M250 690H455L478 676 494 630 506 540 518 462 536 432 566 420 790 336" fill="none" stroke="#fff" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1 id="app-name">Supercon Progress</h1>
        <p id="project"></p>
      </div>
    </div>
    <div class="views" role="tablist" aria-label="View">
      <button id="view-progress" type="button" role="tab" aria-selected="true">Progress</button>
      <button id="view-demos" type="button" role="tab" aria-selected="false">Physics demos</button>
    </div>
    <div class="controls">
      <span class="stamp"><i id="live-dot" class="live-dot"></i><span id="stamp"></span></span>
      <button id="btn-refresh" class="btn icon-only" type="button"></button>
      <button id="btn-theme" class="btn icon-only" type="button"></button>
    </div>
  </header>

  <div id="notice" class="notice" role="status" hidden></div>

  <main id="main" hidden>
    <section id="pipeline" class="card pipeline"></section>
    <section id="kpis" class="kpis"></section>
    <div class="grid">
      <div class="col">
        <section id="stages-card" class="card"></section>
        <section id="results-card" class="card"></section>
      </div>
      <div class="col">
        <section id="activity-card" class="card"></section>
        <section id="github-card" class="card"></section>
      </div>
    </div>
  </main>

  <section id="demos" class="card demos" hidden></section>

  <footer id="foot" class="foot"></footer>
</div>

<script id="bundled-data" type="application/json"></script>

  function drawChart(host, pts, ref) {
    clear(host);
    var W = Math.max(280, Math.floor(host.getBoundingClientRect().width) || 600);
    var H = 228;
    var m = { t: 12, r: 12, b: 28, l: 40 };
    var pw = W - m.l - m.r;
    var ph = H - m.t - m.b;
    var vals = pts.map(function (p) { return p.y; });
    if (ref) vals.push(ref.mae);
    var top = Math.max.apply(null, vals) * 1.15 || 1;
    var step = niceStep(top, 4);
    var yMax = Math.ceil(top / step) * step;
    var n = pts.length;
    function X(i) { return m.l + (n === 1 ? pw / 2 : i * pw / (n - 1)); }
    function Y(v) { return m.t + ph - v / yMax * ph; }

    var svg = s('svg', {
      viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, class: 'plot', role: 'img', tabindex: '0',
      'aria-label': t('chartTitle') + ': ' + pts.map(function (p) { return fmtVal(p.y) + ' K'; }).join(', ')
    });
    for (var v = 0; v <= yMax + step * 1e-6; v += step) {
      var yy = Math.round(Y(v)) + 0.5;
      svg.appendChild(s('line', { x1: m.l, x2: W - m.r, y1: yy, y2: yy, class: v === 0 ? 'axis-line' : 'grid-line' }));
      svg.appendChild(s('text', { x: m.l - 8, y: yy + 4, 'text-anchor': 'end', class: 'tick' }, fmtTick(v)));
    }
    var ticks = n === 1 ? [0] : n < 6 ? pts.map(function (_, i) { return i; }) : [0, Math.floor((n - 1) / 2), n - 1];
    ticks.forEach(function (i) {
      var anchor = n === 1 ? 'middle' : i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle';
      svg.appendChild(s('text', { x: X(i), y: H - 8, 'text-anchor': anchor, class: 'tick' }, pts[i].at ? fmtDay(pts[i].at) : '#' + (i + 1)));
    });
    var last = n - 1;
    if (ref) {
      var ry = Math.round(Y(ref.mae)) + 0.5;
      var near = Math.abs(Y(pts[last].y) - ry) < 22;
      svg.appendChild(s('line', { x1: m.l, x2: W - m.r, y1: ry, y2: ry, class: 'ref-line' }));
      svg.appendChild(s('text', { x: m.l + 6, y: near ? ry + 15 : ry - 6, class: 'ref-label' }, t('refLabel', { m: L(ref.model), v: fmtVal(ref.mae) + ' K' })));
    }
    if (n > 1) {
      svg.appendChild(s('path', { class: 'series-line', d: pts.map(function (p, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1); }).join(' ') }));
    }
    pts.forEach(function (p, i) { svg.appendChild(s('circle', { cx: X(i), cy: Y(p.y), r: 4, class: 'series-dot' })); });
    svg.appendChild(s('text', {
      x: n === 1 ? X(last) : X(last) - 8, y: Y(pts[last].y) - 10,
      'text-anchor': n === 1 ? 'middle' : 'end', class: 'end-label'
    }, fmtVal(pts[last].y) + ' K'));

    var cross = s('line', { y1: m.t, y2: m.t + ph, class: 'crosshair', visibility: 'hidden' });
    var ring = s('circle', { r: 6.5, class: 'hover-dot', visibility: 'hidden' });
    var hit = s('rect', { x: m.l - 16, y: 0, width: pw + 32, height: m.t + ph + 8, fill: 'transparent' });
    svg.appendChild(cross);
    svg.appendChild(ring);
    svg.appendChild(hit);
    var tip = h('div', { class: 'tooltip', hidden: true });
    host.appendChild(svg);
    host.appendChild(tip);

    var cur = -1;
    function show(i) {
      cur = i;
      var p = pts[i];
      var x = X(i);
      var y = Y(p.y);
      cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('visibility', 'visible');
      ring.setAttribute('cx', x); ring.setAttribute('cy', y); ring.setAttribute('visibility', 'visible');
      clear(tip);
      append(tip, [
        h('b', { text: fmtVal(p.y) + ' K' }),
        h('span', { class: 'tip-row' }, h('i', { class: 'key' }), p.model || t('thisProject')),
        h('span', { class: 'tip-row', text: p.at ? fmtStamp(p.at) : '#' + (i + 1) })
      ]);
      tip.hidden = false;
      tip.style.left = Math.min(Math.max(x, 86), W - 86) + 'px';
      tip.style.top = y + 'px';
    }
    function hide() {
      cur = -1;
      cross.setAttribute('visibility', 'hidden');
      ring.setAttribute('visibility', 'hidden');
      tip.hidden = true;
    }
    function nearest(evt) {
      var box = svg.getBoundingClientRect();
      var px = (evt.clientX - box.left) * (W / box.width);
      var best = 0;
      var bd = Infinity;
      for (var i = 0; i < n; i++) { var dd = Math.abs(X(i) - px); if (dd < bd) { bd = dd; best = i; } }
      return best;
    }
    hit.addEventListener('pointermove', function (e) { show(nearest(e)); });
    hit.addEventListener('pointerleave', hide);
    svg.addEventListener('focus', function () { show(cur >= 0 ? cur : last); });
    svg.addEventListener('blur', hide);
    svg.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') { show(Math.max(0, (cur < 0 ? last : cur) - 1)); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { show(Math.min(last, (cur < 0 ? 0 : cur) + 1)); e.preventDefault(); }
      else if (e.key === 'Escape') hide();
    });
  }

  function selectDemo(id) {

    [].forEach.call(document.querySelectorAll('.demo-tab'), function (b) { b.setAttribute('aria-selected', b.getAttribute('data-id') === id ? 'true' : 'false'); });

  }

  function syncControls() {
    var d = demoDef();

    $('#demo-caption').textContent = d.caption;
    var play = $('#demo-play');

    $('#demo-temp').value = String(demo.t.toFixed(2));

    });
  }

  function sizeCanvas() {
    if (!demo.canvas) return;
    var stage = demo.canvas.parentNode;
    var W = Math.max(280, Math.floor(stage.getBoundingClientRect().width));
    var d = demoDef();
    var H = W < 560 ? Math.round(d.height * 0.85) : d.height;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    if (W === demo.W && H === demo.H && dpr === demo.dpr) return;
    demo.W = W; demo.H = H; demo.dpr = dpr;
    demo.canvas.width = Math.round(W * dpr);
    demo.canvas.height = Math.round(H * dpr);
    demo.canvas.style.height = H + 'px';
    demo.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    demo.electrons = null; demo.ions = null; demo.fieldKey = ''; demo.heatKey = '';
  }

  function demosVisible() { return view === 'demos' && demo.built && !document.hidden; }
  function kick() {

  }
  function frame(ts) {
    demo.raf = 0;

    var dt = moving && demo.last ? Math.min(0.05, (ts - demo.last) / 1000) : 0;
    demo.last = ts;
    demo.clock += dt;
    var d = demoDef();
    if (d.temp && demo.auto && moving) {

      $('#demo-temp').value = demo.t.toFixed(2);
      $('#demo-temp-out').textContent = demo.t.toFixed(2) + ' Tc';

    var c = demo.ctx;
    c.clearRect(0, 0, demo.W, demo.H);
    c.fillStyle = C.surface;
    c.fillRect(0, 0, demo.W, demo.H);

    else if (d.id === 'meissner') drawMeissner(c, C, dt);

  function dot(c, x, y, r, fill, ring) {

  function label(c, C, text, x, y, opts) {

  function stateText(s) { return s > 0 ? 'Superconducting' : 'Normal state'; }

  // Small line plot shared by the resistance and gap demos.
  function miniPlot(c, C, box, fn, yMax, t, yLabel, valueText) {
    var x0 = box.x + 44, x1 = box.x + box.w - 16, y0 = box.y + 18, y1 = box.y + box.h - 40;
    function X(v) { return x0 + (v / 1.6) * (x1 - x0); }
    function Y(v) { return y1 - (v / yMax) * (y1 - y0); }
    c.lineWidth = 1;
    [0.25, 0.5, 0.75, 1].forEach(function (g) {
      var yy = Math.round(Y(g * yMax)) + 0.5;
      c.strokeStyle = C.grid; c.beginPath(); c.moveTo(x0, yy); c.lineTo(x1, yy); c.stroke();
    });
    c.strokeStyle = C.axis; c.beginPath(); c.moveTo(x0, Math.round(y1) + 0.5); c.lineTo(x1, Math.round(y1) + 0.5); c.stroke();
    var tcx = Math.round(X(1)) + 0.5;
    c.strokeStyle = C.axis; c.beginPath(); c.moveTo(tcx, y0); c.lineTo(tcx, y1); c.stroke();
    [0, 0.5, 1, 1.5].forEach(function (v) {
      label(c, C, v === 1 ? 'Tc' : String(v), X(v), y1 + 16, { align: 'center', size: 11, color: C.muted });
    });
    label(c, C, 'Temperature (T / Tc)', (x0 + x1) / 2, y1 + 32, { align: 'center', size: 11, color: C.muted });
    label(c, C, yLabel, x0, y0 - 6, { size: 11, color: C.muted });
    c.beginPath();
    for (var v = 0; v <= 1.6001; v += 0.005) {
      var px = X(v), py = Y(fn(v));

    c.lineWidth = 2; c.lineJoin = 'round'; c.strokeStyle = C.accent; c.stroke();
    var mx = X(Math.max(0, Math.min(1.6, t))), my = Y(fn(t));
    dot(c, mx, my, 5, C.accent, C.surface);
    var right = mx > x1 - 150;
    label(c, C, valueText, right ? mx - 12 : mx + 12, my - 10, { align: right ? 'right' : 'left', weight: '600', color: C.ink });
  }

  function resistanceOf(t) {
    var normal = 0.55 + 0.45 * (t / 1.6);
    return normal / (1 + Math.exp(-(t - 1) / 0.015));
  }

  function drawResistance(c, C, dt) {
    var W = demo.W, H = demo.H, t = demo.t, s = gapRatio(t);
    var left = 16, right = W - 16, top = 16, wireH = Math.min(132, Math.round(H * 0.4));
    c.fillStyle = C.surface2;
    c.beginPath();
    if (c.roundRect) c.roundRect(left, top, right - left, wireH, 12); else c.rect(left, top, right - left, wireH);
    c.fill();
    var cols = Math.max(8, Math.floor((right - left) / 36)), rows = 3;
    var amp = (0.6 + 3.4 * Math.min(t, 1.6) / 1.6) * (1 - 0.55 * s);
    for (var r = 0; r < rows; r++) {
      for (var k = 0; k < cols; k++) {
        var x = left + (k + 0.5) * (right - left) / cols + amp * Math.sin(demo.clock * 9 + k * 1.7 + r * 2.3);
        var y = top + (r + 0.5) * wireH / rows + amp * Math.cos(demo.clock * 11 + k * 2.1 + r);
        dot(c, x, y, 5, mix(C.muted, C.surface2, 0.35));
      }
    }
    var N = 24;
    if (!demo.electrons) {
      demo.electrons = [];
      for (var i = 0; i < N; i++) {
        var a0 = Math.random() * Math.PI * 2;
        demo.electrons.push({ x: left + Math.random() * (right - left), y: top + 8 + Math.random() * (wireH - 16), vx: 60 * Math.cos(a0), vy: 60 * Math.sin(a0) });
      }
    }
    var es = demo.electrons;
    var scatter = (1 - s) * (2 + 5 * Math.min(t, 1.6) / 1.6);
    es.forEach(function (p) {
      if (dt && Math.random() < scatter * dt) {
        var ang = Math.random() * Math.PI * 2, sp = 60 + 50 * Math.random();
        p.vx = sp * Math.cos(ang) + 25; p.vy = sp * Math.sin(ang);
      }
      var k = Math.min(1, dt * (0.4 + 5 * s));
      p.vx += (90 * s + 25 * (1 - s) - p.vx) * k * (s > 0 ? 1 : 0.15);
      p.vy += (0 - p.vy) * Math.min(1, dt * 5 * s);
    });
    for (var j = 0; j + 1 < N; j += 2) {
      var p = es[j], q = es[j + 1];
      if (s > 0) {
        var mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2, pull = Math.min(1, dt * 3 * s);
        if (Math.abs(p.x - q.x) > (right - left) / 2) { q.x = p.x; }
        p.x += (mx - 6 - p.x) * pull; q.x += (mx + 6 - q.x) * pull;
        p.y += (my - p.y) * pull; q.y += (my - q.y) * pull;
        q.vx = p.vx = (p.vx + q.vx) / 2 * (1 - pull) + 90 * pull;
      }
    }
    es.forEach(function (p) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.y < top + 7) { p.y = top + 7; p.vy = Math.abs(p.vy); }
      if (p.y > top + wireH - 7) { p.y = top + wireH - 7; p.vy = -Math.abs(p.vy); }
      if (p.x > right - 4) p.x -= right - left - 8;
      if (p.x < left + 4) p.x += right - left - 8;
    });
    if (s > 0.05) {
      c.lineWidth = 2; c.strokeStyle = C.accent; c.globalAlpha = Math.min(0.8, s);
      for (var m = 0; m + 1 < N; m += 2) {
        if (Math.abs(es[m].x - es[m + 1].x) < 40) { c.beginPath(); c.moveTo(es[m].x, es[m].y); c.lineTo(es[m + 1].x, es[m + 1].y); c.stroke(); }
      }
      c.globalAlpha = 1;
    }
    es.forEach(function (p) { dot(c, p.x, p.y, 3.5, C.accent); });
    var narrow = W < 560;
    label(c, C, s > 0 ? (narrow ? 'Pairs flow freely' : 'Cooper pairs flow without scattering') : (narrow ? 'Electrons scatter' : 'Electrons scatter off vibrating ions'), left + 10, top + wireH + 20, { size: 12, color: C.ink2 });
    label(c, C, stateText(s), right - 10, top + wireH + 20, { align: 'right', size: 12, weight: '600', color: C.ink });
    var R = resistanceOf(t);
    miniPlot(c, C, { x: 0, y: top + wireH + 30, w: W, h: H - (top + wireH + 30) }, resistanceOf, 1.1, t,
      'Resistance (R / Rₙ)', R < 0.005 ? 'R = 0' : 'R = ' + R.toFixed(2) + ' Rₙ');
    $('#demo-readout').textContent = R < 0.005 ? 'Zero resistance' : 'Resistance ' + R.toFixed(2) + ' Rₙ';
    demo.canvas.setAttribute('aria-label', 'Zero-resistance demo at ' + t.toFixed(2) + ' Tc: ' + stateText(s));
  }

  function solveFieldLine(x, cval, re) {
    if (re < 0.5) return cval;
    var lo = Math.sqrt(Math.max(re * re - x * x, 0)), hi = cval + re;
    for (var i = 0; i < 30; i++) {
      var mid = (lo + hi) / 2;
      var g = mid * (1 - re * re / (x * x + mid * mid));
      if (g < cval) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  }

  function drawMeissner(c, C, dt) {
    var W = demo.W, H = demo.H, t = demo.t, s = Math.min(1, gapRatio(t) * 1.6);
    var band = H - 30, cx = W / 2, cy = band / 2 + 4, a = Math.min(W, band) * 0.26;
    var re = a * Math.sqrt(s);
    var key = [W, H, Math.round(re * 4)].join(':');
    if (demo.fieldKey !== key) {
      demo.fieldKey = key;
      demo.field = [];
      var spacing = Math.max(18, Math.round(H / 16));
      for (var k = 1; k * spacing < H / 2 + spacing; k++) {
        var cval = k * spacing - spacing / 2;
        var top = [], bottom = [];
        for (var x = -W / 2 - 8; x <= W / 2 + 8; x += 4) {
          var y = solveFieldLine(x, cval, re);
          top.push([cx + x, cy - y]);
          bottom.push([cx + x, cy + y]);
        }
        demo.field.push(top, bottom);
      }
    }
    c.save();
    c.beginPath();
    c.rect(0, 0, W, band);
    c.clip();
    c.beginPath();
    c.arc(cx, cy, a, 0, Math.PI * 2);
    c.fillStyle = mix(C.surface2, C.track, s);
    c.fill();
    c.lineWidth = 1; c.strokeStyle = C.axis; c.stroke();
    c.lineWidth = 1.6; c.strokeStyle = C.ink2;
    c.setLineDash([7, 9]);
    c.lineDashOffset = -demo.clock * 36;
    demo.field.forEach(function (pts) {
      c.beginPath();
      pts.forEach(function (p, i) { if (i) c.lineTo(p[0], p[1]); else c.moveTo(p[0], p[1]); });
      c.stroke();
    });
    c.setLineDash([]);
    if (s > 0.03) {
      c.globalAlpha = Math.min(1, s * 1.4);

        dot(c, m[0], m[1], rr, C.surface, C.accent);
        c.strokeStyle = C.accent; c.fillStyle = C.accent; c.lineWidth = 2;
        if (m[2] === 'out') { c.beginPath(); c.arc(m[0], m[1], 1.8, 0, Math.PI * 2); c.fill(); }
        else { var q = rr * 0.55; c.beginPath(); c.moveTo(m[0] - q, m[1] - q); c.lineTo(m[0] + q, m[1] + q); c.moveTo(m[0] + q, m[1] - q); c.lineTo(m[0] - q, m[1] + q); c.stroke(); }
      });
      c.globalAlpha = 1;
    }
    label(c, C, s > 0 ? 'Superconductor' : 'Normal metal', cx, cy + 4, { align: 'center', size: 13, weight: '600', color: C.ink });
    c.restore();
    c.strokeStyle = C.grid; c.lineWidth = 1;
    c.beginPath(); c.moveTo(0, band + 0.5); c.lineTo(W, band + 0.5); c.stroke();
    var what = s <= 0 ? 'Field passes straight through' : s >= 0.98 ? 'Field expelled from the interior' : 'Field being expelled';
    label(c, C, 'Magnetic field →', 16, H - 11, { size: 12, color: C.muted });
    label(c, C, stateText(s) + ' · ' + what, W - 16, H - 11, { align: 'right', size: 12, weight: '600', color: C.ink });
    $('#demo-readout').textContent = what;
    demo.canvas.setAttribute('aria-label', 'Meissner-effect demo at ' + t.toFixed(2) + ' Tc: ' + what);
  }

  function drawPairs(c, C, dt) {
    var W = demo.W, H = demo.H, t = demo.t, s = gapRatio(t);
    var d = 34, top = 14, regionH = Math.round(H * 0.6);
    var rows = Math.max(3, Math.floor(regionH / d)), cols = Math.ceil(W / d) + 1;
    var key = [W, H].join(':');
    if (!demo.ions || demo.sizeKey !== key) {
      demo.sizeKey = key;
      demo.ions = [];
      for (var r = 0; r < rows; r++) for (var k = 0; k < cols; k++) demo.ions.push({ x0: (k + 0.5) * d, y0: top + (r + 0.5) * d, ux: 0, uy: 0 });
      var lane = top + Math.floor(rows / 2) * d;
      demo.e1 = { x: W * 0.55, y: lane };
      demo.e2 = { x: W * 0.55 - 2.6 * d, y: lane, vx: 30, vy: 0 };
    }
    var e1 = demo.e1, e2 = demo.e2, laneY = e1.y;
    e1.x += 70 * dt;
    if (e1.x > W + 40) { e1.x -= W + 80; e2.x -= W + 80; }
    var pullR2 = (2.3 * d) * (2.3 * d), sig2 = 2 * (0.9 * d) * (0.9 * d);
    demo.ions.forEach(function (ion) {
      var dx = e1.x - ion.x0, dy = e1.y - ion.y0, r2 = dx * dx + dy * dy;
      if (r2 < pullR2 && r2 > 1) {

      var u = Math.hypot(ion.ux, ion.uy);

    });
    var target = { x: e1.x - 2.6 * d, y: laneY + 4 * Math.sin(demo.clock * 3) };
    if (dt && Math.random() < (1 - s) * 3 * dt) {
      var ang = Math.random() * Math.PI * 2;
      e2.vx = 70 * Math.cos(ang) + 20; e2.vy = 70 * Math.sin(ang);
    }
    var free = { x: e2.vx * dt, y: e2.vy * dt };
    var paired = { x: (target.x - e2.x) * Math.min(1, dt * 2.5), y: (target.y - e2.y) * Math.min(1, dt * 2.5) };
    e2.x += (1 - s) * free.x + s * paired.x;
    e2.y += (1 - s) * free.y + s * paired.y;
    if (e2.y < top + 8) { e2.y = top + 8; e2.vy = Math.abs(e2.vy); }
    if (e2.y > top + rows * d - 8) { e2.y = top + rows * d - 8; e2.vy = -Math.abs(e2.vy); }
    if (e2.x > W + 40) e2.x -= W + 80;
    if (e2.x < -40) e2.x += W + 80;

      var x = ion.x0 + ion.ux + jitter * Math.sin(demo.clock * 8 + i * 1.3);
      var y = ion.y0 + ion.uy + jitter * Math.cos(demo.clock * 10 + i * 0.7);
      dot(c, x, y, 6 + 1.5 * w, mix(mix(C.muted, C.surface, 0.35), C.warm, w));
      c.strokeStyle = C.surface; c.lineWidth = 1.4;
      c.beginPath(); c.moveTo(x - 2.5, y); c.lineTo(x + 2.5, y); c.moveTo(x, y - 2.5); c.lineTo(x, y + 2.5); c.stroke();

    if (s > 0.15 && Math.abs(e1.x - e2.x) < 4 * d) {

      var midx = (e1.x + e2.x) / 2, midy = Math.min(e1.y, e2.y) - 26;
      c.beginPath(); c.moveTo(e2.x, e2.y - 8); c.quadraticCurveTo(midx, midy, e1.x, e1.y - 8); c.stroke();
      c.setLineDash([]);
      c.font = '600 12px ' + C.font;
      var tw = c.measureText('Cooper pair').width;
      c.fillStyle = C.surface;
      c.beginPath();
      if (c.roundRect) c.roundRect(midx - tw / 2 - 6, midy - 19, tw + 12, 20, 6); else c.rect(midx - tw / 2 - 6, midy - 19, tw + 12, 20);
      c.fill();
      label(c, C, 'Cooper pair', midx, midy - 4, { align: 'center', size: 12, weight: '600', color: C.ink });
      c.globalAlpha = 1;
    }
    [e2, e1].forEach(function (e) {
      dot(c, e.x, e.y, 6.5, C.accent, C.surface);
      c.strokeStyle = C.surface; c.lineWidth = 1.6; c.beginPath(); c.moveTo(e.x - 3, e.y); c.lineTo(e.x + 3, e.y); c.stroke();
    });
    var gapTop = top + rows * d + 6;
    miniPlot(c, C, { x: 0, y: gapTop, w: W, h: H - gapTop }, gapRatio, 1.1, t, 'Energy gap (Δ / Δ₀)',
      s > 0 ? 'Δ = ' + s.toFixed(2) + ' Δ₀' : 'No gap');
    $('#demo-readout').textContent = s > 0 ? 'Energy gap ' + s.toFixed(2) + ' Δ₀' : 'No energy gap above Tc';
    demo.canvas.setAttribute('aria-label', 'Cooper-pair demo at ' + t.toFixed(2) + ' Tc: ' + stateText(s));
  }

  function drawAllenDynes(c, C) {
    var W = demo.W, H = demo.H;
    var x0 = 56, x1 = W - 20, y0 = 16, y1 = H - 70;
    var LMAX = 2.5, WMAX = 1000;
    function X(l) { return x0 + (l / LMAX) * (x1 - x0); }
    function Y(w) { return y1 - (w / WMAX) * (y1 - y0); }
    var key = [Math.round(x1 - x0), Math.round(y1 - y0), demo.mu, C.dark ? 'd' : 'l'].join(':');
    if (demo.heatKey !== key) {
      demo.heatKey = key;
      var nx = 150, ny = 100;
      var off = document.createElement('canvas');
      off.width = nx; off.height = ny;
      var g = off.getContext('2d'), img = g.createImageData(nx, ny);
      for (var j = 0; j < ny; j++) {
        for (var i = 0; i < nx; i++) {
          var tc = allenDynes(LMAX * (i + 0.5) / nx, WMAX * (ny - j - 0.5) / ny, demo.mu);
          var rgb = rampColor(Math.sqrt(Math.min(tc, TC_MAX) / TC_MAX), C.dark);
          var o = (j * nx + i) * 4;
          img.data[o] = rgb[0]; img.data[o + 1] = rgb[1]; img.data[o + 2] = rgb[2]; img.data[o + 3] = 255;
        }
      }
      g.putImageData(img, 0, 0);
      demo.heat = off;
    }
    c.imageSmoothingEnabled = true;
    c.drawImage(demo.heat, x0, y0, x1 - x0, y1 - y0);
    c.lineWidth = 1; c.strokeStyle = C.axis;
    c.strokeRect(Math.round(x0) + 0.5, Math.round(y0) + 0.5, Math.round(x1 - x0), Math.round(y1 - y0));
    [0, 0.5, 1, 1.5, 2, 2.5].forEach(function (l) { label(c, C, String(l), X(l), y1 + 15, { align: 'center', size: 11, color: C.muted }); });
    label(c, C, 'Electron–phonon coupling λ', x1, y1 + 30, { align: 'right', size: 11, color: C.muted });
    [0, 250, 500, 750, 1000].forEach(function (w) { label(c, C, String(w), x0 - 8, Y(w) + 4, { align: 'right', size: 11, color: C.muted }); });
    c.save(); c.translate(14, (y0 + y1) / 2); c.rotate(-Math.PI / 2);
    label(c, C, 'ω_log (K)', 0, 0, { align: 'center', size: 11, color: C.muted, base: 'middle' });
    c.restore();
    var lx0 = x0, lx1 = Math.min(x1, x0 + 260), ly = H - 22;
    for (var p = 0; p <= 100; p++) {
      var rgb2 = rampColor(p / 100, C.dark);
      c.fillStyle = 'rgb(' + rgb2.join(',') + ')';
      c.fillRect(lx0 + (lx1 - lx0) * p / 101, ly - 10, (lx1 - lx0) / 101 + 1, 10);
    }
    [0, 5, 20, 45, 80].forEach(function (v) {
      label(c, C, v + (v === 80 ? '+ K' : ''), lx0 + (lx1 - lx0) * Math.sqrt(v / TC_MAX), ly + 13, { align: 'center', size: 10, color: C.muted });
    });
    label(c, C, 'Tc', lx1 + 10, ly - 1, { size: 11, color: C.muted });
    var mx = X(demo.lam), my = Y(demo.wlog);
    if (motionOK()) {
      var k = (demo.clock % 1.6) / 1.6;
      c.globalAlpha = 1 - k; c.lineWidth = 2; c.strokeStyle = C.ink;
      c.beginPath(); c.arc(mx, my, 7 + 10 * k, 0, Math.PI * 2); c.stroke();
      c.globalAlpha = 1;
    }
    dot(c, mx, my, 6, C.surface, C.ink);
    var tc = allenDynes(demo.lam, demo.wlog, demo.mu);
    var right = mx > x1 - 120;
    label(c, C, 'Tc = ' + tc.toFixed(1) + ' K', right ? mx - 12 : mx + 12, my - 10, { align: right ? 'right' : 'left', weight: '600', size: 13, color: C.ink });
    var text = 'Tc = ' + tc.toFixed(1) + ' K';
    var hv = demo.hover;
    if (hv && hv.x >= x0 && hv.x <= x1 && hv.y >= y0 && hv.y <= y1) {
      var hl = (hv.x - x0) / (x1 - x0) * LMAX, hw = (y1 - hv.y) / (y1 - y0) * WMAX;
      c.strokeStyle = C.ink; c.globalAlpha = 0.5; c.lineWidth = 1;
      c.beginPath(); c.moveTo(hv.x + 0.5, y0); c.lineTo(hv.x + 0.5, y1); c.moveTo(x0, hv.y + 0.5); c.lineTo(x1, hv.y + 0.5); c.stroke();
      c.globalAlpha = 1;
      text += ' · at the pointer: λ ' + hl.toFixed(2) + ', ω_log ' + Math.round(hw) + ' K → Tc ' + allenDynes(hl, hw, demo.mu).toFixed(1) + ' K';
    }
    $('#demo-ad-readout').textContent = text;
    demo.canvas.setAttribute('aria-label', 'Allen-Dynes map; at lambda ' + demo.lam.toFixed(2) + ' and omega_log ' + Math.round(demo.wlog) + ' K the estimated Tc is ' + tc.toFixed(1) + ' K');
  }

  function setView(v) {
    view = v;
    store.set('view', v);
    $('#view-progress').setAttribute('aria-selected', v === 'progress' ? 'true' : 'false');
    $('#view-demos').setAttribute('aria-selected', v === 'demos' ? 'true' : 'false');
    $('#demos').hidden = v !== 'demos';
    $('#main').hidden = v !== 'progress' || !state.data;
    if (v === 'demos') {
      if (!demo.built) buildDemos();
      sizeCanvas();
      kick();
    }
  }

  function render() {
    renderChrome();
    var d = state.data;
    $('#main').hidden = !d || view !== 'progress';
    if (!d) return;
    renderPipeline(d);
    renderKpis(d);
    renderStages(d);
    renderResults(d);
    renderActivity(d);
    renderGitHub();
  }

  function applyTheme() {
    if (theme === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
  }

  $('#btn-refresh').addEventListener('click', function () { refreshAll(); });
  $('#btn-theme').addEventListener('click', function () {
    theme = theme === 'system' ? 'light' : theme === 'light' ? 'dark' : 'system';
    store.set('theme', theme);
    applyTheme();
    renderChrome();
    kick();
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && state.checkedAt && Date.now() - state.checkedAt.getTime() > 60 * 1000) refreshAll();
  });

  $('#view-progress').addEventListener('click', function () { setView('progress'); });
  $('#view-demos').addEventListener('click', function () { setView('demos'); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) kick(); });

  applyTheme();
  render();
  setView(view);
  loadBundled().then(function () { render(); return refreshAll(); });
  setInterval(refreshAll, REFRESH_MS);
  setInterval(function () { if (!state.busy) renderChrome(); }, 60 * 1000);
})();
</script>
</body>
</html>
