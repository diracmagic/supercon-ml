      }
      c.restore();
      c.fillStyle = stAlpha(C.ink2, 0.8);
      c.beginPath(); c.moveTo(xm + 5, yc); c.lineTo(xm - 2, yc - 4); c.lineTo(xm - 2, yc + 4); c.closePath(); c.fill();
      var jp = md(tt / 2, 1) * (n + 4) - 2;
      for (var j = 0; j < n; j++) {
        var w = Math.exp(-(j - jp) * (j - jp) / 1.6), x2 = x0 + j * dx, col = mix(C.accent, C.warm, w);
        for (var row = 0; row < 2; row++) {
          var yy = row ? yB : yT;
          if (w > 0.05) { c.beginPath(); c.arc(x2, yy, 8, 0, TAU); c.fillStyle = stAlpha(C.warm, 0.3 * w); c.fill(); }
          ring(c, x2, yy, r, col, 1.4, C.surface);
          if (!row) dot(c, x2, yy, 1.6, col);
          else { c.strokeStyle = col; c.lineWidth = 1.2; seg(c, x2 - 2.3, yy - 2.3, x2 + 2.3, yy + 2.3); seg(c, x2 + 2.3, yy - 2.3, x2 - 2.3, yy + 2.3); }
        }
      }
      label(c, C, 'MRI · accelerators', W / 2, 107, { size: 11, color: C.ink2, align: 'center' });
    }

    /* MgB2: boron honeycomb seen from above with Mg over the hexagon centres. In the E2g phonon the two boron
       sublattices move in opposite in-plane directions, stretching and squeezing the B–B bonds. */
    function drawMgB2(c, C, W, H, t) {
      var P = 6, tt = md(t, P), ph = Math.sin(tt * TAU / 1.2), u = 1.3 * ph, b = 12, ax = Math.sqrt(3) * b;
      var m = 10, lg = Math.round(textW(c, C, 'E₂g phonon', 11.5, '600')) + 2;
      var x0 = m, x1 = W - m - lg - 16, y0 = m, y1 = H - m;
      c.save();
      stRound(c, x0, y0, x1 - x0, y1 - y0, 8); c.fillStyle = C.surface; c.fill(); c.clip();
      // Bravais lattice R = i a1 + j a2 with a1 = (√3 b, 0), a2 = (√3 b / 2, 1.5 b); A at R, B at R + (0, b)
      var ox = x0 + 4, oy = y0 + 3, rows = Math.ceil((y1 - y0) / (1.5 * b)) + 1, cols = Math.ceil((x1 - x0) / ax) + 2;
      var cxm = (x0 + x1) / 2, cym = (y0 + y1) / 2, best = 1e9, hx = 0, hy = 0, pass, j, i, i0, rx, ry;
      for (pass = 0; pass < 3; pass++) {
        c.beginPath();
        for (j = -1; j <= rows; j++) {
          i0 = -Math.ceil(j / 2) - 1;
          for (i = i0; i <= i0 + cols; i++) {
            rx = ox + i * ax + j * ax / 2; ry = oy + j * 1.5 * b;
            if (pass === 0) {   // bonds A(i,j) to B(i,j), B(i,j−1), B(i+1,j−1)
              c.moveTo(rx + u, ry); c.lineTo(rx - u, ry + b);
              c.moveTo(rx + u, ry); c.lineTo(rx - ax / 2 - u, ry - 0.5 * b);
              c.moveTo(rx + u, ry); c.lineTo(rx + ax / 2 - u, ry - 0.5 * b);
            } else if (pass === 1) {   // Mg above the hexagon centre R + (√3 b / 2, b / 2), not moving in this mode
              var gx = rx + ax / 2, gy = ry + b / 2, dd = (gx - cxm) * (gx - cxm) + (gy - cym) * (gy - cym);
              if (dd < best) { best = dd; hx = gx; hy = gy; }
              c.moveTo(gx + 3.6, gy); c.arc(gx, gy, 3.6, 0, TAU);
            } else {
              c.moveTo(rx + u + 2.6, ry); c.arc(rx + u, ry, 2.6, 0, TAU);
              c.moveTo(rx - u + 2.6, ry + b); c.arc(rx - u, ry + b, 2.6, 0, TAU);
            }
          }
        }
        if (pass === 0) { c.strokeStyle = stAlpha(C.ink2, 0.45); c.lineWidth = 1.2; c.stroke(); }
        else { c.fillStyle = pass === 1 ? stAlpha(C.aqua, 0.75) : C.accent; c.fill(); }
      }
      // displacement arrows on the six borons of the central hexagon: vertices at −150°, −30°, 90° are A, the others B
      if (Math.abs(ph) > 0.2) {
        c.globalAlpha = stClamp((Math.abs(ph) - 0.2) / 0.5);
        for (var k = 0; k < 6; k++) {
          var ang = -5 * Math.PI / 6 + k * Math.PI / 3, sgn = (k % 2 === 0 ? 1 : -1) * (ph > 0 ? 1 : -1);
          var vx = hx + b * Math.cos(ang) + (k % 2 === 0 ? u : -u), vy = hy + b * Math.sin(ang);
          arrow(c, vx + sgn * 3.6, vy, vx + sgn * 10.5, vy, C.warm, 3.6, 1.3);
        }
        c.globalAlpha = 1;
      }
      c.restore();
      var lx = W - m - lg;
      label(c, C, 'E₂g phonon', lx, 33, { size: 11.5, weight: '600', color: C.ink });
      legend(c, C, lx, 57, 'boron', 8, function (x, y) { dot(c, x, y, 2.6, C.accent); });
      legend(c, C, lx, 79, 'Mg', 8, function (x, y) { dot(c, x, y, 3.6, stAlpha(C.aqua, 0.75)); });
    }

    /* REBCO coated conductor, cut along the tape: substrate, buffer, thin REBCO layer and silver/copper cap.
       Current (dots) flows in the REBCO layer; liquid-nitrogen bubbles nucleate on the tape and rise (77 K). */
    var RB_BUB = (function () {
      var r = stRng(11), out = [];
      for (var i = 0; i < 14; i++) out.push({ x: (i + 0.2 + 0.6 * r()) / 14, ph: r(), n: 2 + (i % 2), s: 1.6 + 1.2 * r() });
      return out;
    })();
    function drawRebco(c, C, W, H, t) {
      var P = 8, tt = md(t, P);
      var m = 10, tx0 = m + 12, tx1 = W - m - Math.round(textW(c, C, 'REBCO', 11, '600')) - 20;
      stRound(c, m, m, W - 2 * m, H - 2 * m, 8); c.fillStyle = stAlpha(C.accent, C.dark ? 0.1 : 0.06); c.fill();
      var yCap = 46, yRe = 52, yBuf = 58, ySub = 61, yEnd = 76;

    /* 4. Spin-fluctuation pairing: repulsive on one site, attractive on neighbouring sites, so the pair

    var SG_PH = (function () { var r = stRng(41), a = []; for (var i = 0; i < 64; i++) a.push(r() * TAU); return a; })();

    /* 5. Stripes: rivers of holes separate antiferromagnetic domains whose spin pattern flips across each

    function drawStripes(c, C, W, H, t) {
      var P = 16, tt = md(t, P), m = 10;
      var rows = [
        { text: 'charge stripe (holes)', sw: function (x, y) { c.fillStyle = stAlpha(C.warm, 0.22); c.fillRect(x - 3, y - 7, 6, 14); dot(c, x, y, 2.6, C.warm); } },
        { text: 'spins flip across it', sw: function (x, y) { spin(c, x - 3, y, UP, 10, C.accent, 1.3); spin(c, x + 4, y, UP, 10, C.accent, 1.3); } },
        { text: 'strongest near p = 1/8', sw: null }

    /* 6. Phase fluctuations: as the sample cools, pairs form below T* with random phases, and the phases

    var PH = (function () { var r = stRng(77), a = []; for (var i = 0; i < 48; i++) a.push({ th: r() * TAU, w: (r() - 0.5) * 2.4, ex: r() * TAU, ey: r() * TAU, sp: 0.6 + r() }); return a; })();

    /* 7. Bipolarons: each electron pulls the nearby ions in (a polaron); two electrons then share one

    /* 8. Strange metal: resistivity linear in T down to Tc (and extrapolating to zero at T = 0), against

        { text: 'strange metal: ρ ∝ T', sw: function (x, y) { c.strokeStyle = C.warm; c.lineWidth = 2; seg(c, x - 6, y + 3, x + 6, y - 3); } },
        { text: 'Fermi liquid: ρ ∝ T²', sw: function (x, y) { c.strokeStyle = C.ink2; c.lineWidth = 1.4; c.setLineDash([3, 2]); c.beginPath(); c.moveTo(x - 6, y + 3); c.quadraticCurveTo(x + 2, y + 3, x + 6, y - 4); c.stroke(); c.setLineDash([]); } },

    /* 9. Overview: the cuprate phase diagram (schematic), with a doping probe that names the idea

    var CU = [

      [0.10, 'Pseudogap', 'RVB, preformed pairs'],
      [0.14, 'Stripes near p = 1/8', 'intertwined orders'],

  function verParts(s) { var m = /(\d+)\.(\d+)\.(\d+)/.exec(String(s || '')); return m ? [+m[1], +m[2], +m[3]] : null; }
  function verNewer(a, b) {
    a = verParts(a); b = verParts(b);
    if (!a || !b) return false;
    for (var i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] > b[i];
    return false;
  }
  function installerName() {
    var ua = navigator.userAgent || '', pf = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
    if (/win/i.test(pf) || /Windows/.test(ua)) return 'SuperconProgress-windows-x64-setup.exe';
    if (/mac/i.test(pf) || /Mac OS X|Macintosh/.test(ua)) return 'SuperconProgress-macos-universal.dmg';
    return '';
  }
  // The bold titles of the "Version X adds:" bullets in the release notes.
  function releaseHighlights(body, v) {
    var lines = String(body || '').split(/\r?\n/), out = [], on = false;
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i].trim();
      if (!on) { if (ln.indexOf('Version ' + v) === 0) on = true; continue; }
      if (!ln) { if (out.length) break; continue; }
      if (ln.charAt(0) !== '-') { if (out.length) break; continue; }
      var m = /\*\*(.+?)\*\*/.exec(ln);
      if (m) out.push(m[1].replace(/<[^>]+>/g, ''));
    }
    return out.slice(0, 4);
  }
  function updRead(key) { try { return JSON.parse(store.get(key) || 'null'); } catch (e) { return null; } }
  function updAvailable() {
    var info = UPD.info;
    return !!(isDesktop() && info && info.url && verNewer(info.v, APP_VERSION));
  }
  function checkUpdate(manual) {
    if (!isDesktop() || UPD.busy) return;
    var cached = updRead('update');
    if (!manual && cached && cached.t && Date.now() - cached.t < UPD_EVERY) { UPD.info = cached; renderUpdate(); return; }
    UPD.busy = true;
    if (manual) { store.set('updateLater', ''); UPD.dismissed = false; flashNote('Checking for updates…', 0); }
    getJSON(API + '/releases/latest', { headers: { Accept: 'application/vnd.github+json' }, timeout: 12000 })
      .then(function (rel) {
        var v = (verParts(rel && rel.tag_name) || []).join('.'), want = installerName(), url = '';
        (rel && rel.assets || []).forEach(function (a) { if (a && a.name === want && /^https:\/\//.test(a.browser_download_url || '')) url = a.browser_download_url; });
        var page = rel && /^https:\/\//.test(rel.html_url || '') ? rel.html_url : REPO_URL + '/releases/latest';
        // An unknown computer gets the release page; a known one waits until its installer is uploaded.
        UPD.info = { t: Date.now(), v: v, page: page, url: want ? url : page, news: releaseHighlights(rel && rel.body, v) };
        store.set('update', JSON.stringify(UPD.info));
        if (manual) flashNote(updAvailable() ? '' : 'You have the latest version.', 6000);
      }, function () {
        if (manual) flashNote('Couldn’t reach GitHub to check for updates. Try again later.', 8000);
      })
      .then(function () { UPD.busy = false; renderUpdate(); });
  }
  function flashNote(msg, ms) {
    UPD.note = msg;
    clearTimeout(UPD.noteTimer);
    renderUpdateFoot();
    if (msg && ms) UPD.noteTimer = setTimeout(function () { UPD.note = ''; renderUpdateFoot(); }, ms);
  }
  function renderUpdate() {
    var el = $('#update');
    if (!el) return;
    clear(el);
    var info = UPD.info, kind = '';
    if (UPD.web && !UPD.dismissed) kind = 'web';
    else if (updAvailable() && !UPD.dismissed) {
      var later = updRead('updateLater');
      if (!(later && later.v === info.v && Date.now() < later.until)) kind = 'desktop';
    }
    el.hidden = !kind;
    if (kind === 'web') {
      append(el, [glyph('refresh', 'upd-glyph'), h('div', { class: 'upd-body' },
        h('p', { class: 'upd-title', text: UPD.web === 'new' ? 'A new version of Supercon Progress is ready.' : 'Supercon Progress ' + UPD.web + ' is ready.' }),
        h('div', { class: 'upd-actions' },
          h('button', { class: 'btn primary', type: 'button', onclick: function () { window.location.reload(); } }, 'Reload now'),
          h('button', { class: 'btn', type: 'button', onclick: function () { UPD.dismissed = true; renderUpdate(); } }, 'Later')))]);
    } else if (kind === 'desktop') {
      var mac = /\.dmg$/.test(info.url), how = mac
        ? 'When the download finishes, quit Supercon Progress, open the .dmg and drag the app into Applications to replace this version.'
        : /\.exe$/.test(info.url) ? 'When the download finishes, quit Supercon Progress and run the installer. It replaces this version and keeps your settings.'
          : 'Download the installer for your computer from the release page.';
      append(el, [glyph('download', 'upd-glyph'), h('div', { class: 'upd-body' },
        h('p', { class: 'upd-title', text: 'Supercon Progress ' + info.v + ' is available. You have ' + APP_VERSION + '.' }),
        info.news && info.news.length ? h('p', { class: 'upd-news', text: 'New: ' + info.news.join(' · ') }) : null,
        h('div', { class: 'upd-actions' },
          h('button', { class: 'btn primary', type: 'button', onclick: function () { openExternal(info.url); UPD.downloaded = true; renderUpdate(); } }, glyph('download', 'btn-glyph'), 'Download ' + info.v),
          h('button', { class: 'btn', type: 'button', onclick: function () { openExternal(info.page); } }, 'What’s new'),
          h('button', { class: 'btn', type: 'button', onclick: function () { store.set('updateLater', JSON.stringify({ v: info.v, until: Date.now() + UPD_LATER })); renderUpdate(); } }, 'Later')),
        h('p', { class: 'upd-hint', text: UPD.downloaded ? 'Downloading in your browser. ' + how : how }))]);
    }
    renderUpdateFoot();
  }
  function renderUpdateFoot() {
    var el = $('#upd-foot');
    if (!el) return;
    clear(el);
    if (!isDesktop()) return;
    el.appendChild(document.createTextNode(' · '));
    if (UPD.note) { el.appendChild(h('span', { class: 'upd-note', role: 'status', text: UPD.note })); return; }
    if (updAvailable()) {
      el.appendChild(h('button', { class: 'linklike', type: 'button', onclick: function () {
        store.set('updateLater', ''); UPD.dismissed = false; renderUpdate(); window.scrollTo(0, 0);
      } }, 'Update to ' + UPD.info.v));
      return;
    }
    el.appendChild(h('button', { class: 'linklike', type: 'button', onclick: function () { checkUpdate(true); } }, 'Check for updates'));
  }
  if (isDesktop()) {
    setTimeout(function () { checkUpdate(false); }, 3000);
    setInterval(function () { checkUpdate(false); }, 3600 * 1000);
  }
  (function registerWorker() {
    if (!('serviceWorker' in navigator) || location.protocol !== 'https:' || isDesktop()) return;
    var sw = navigator.serviceWorker, had = !!sw.controller, last = Date.now();
    sw.register('sw.js').then(function (reg) {
      function poll() {
        if (document.visibilityState !== 'visible' || Date.now() - last < 10 * 60 * 1000) return;
        last = Date.now();
        reg.update().catch(function () { /* offline */ });
      }
      setInterval(poll, 15 * 60 * 1000);
      document.addEventListener('visibilitychange', poll);
    }).catch(function () { /* offline support is optional */ });
    sw.addEventListener('controllerchange', function () {
      if (!had) { had = true; return; }   // the first install, not an update
      fetch('sw.js', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (txt) {
        var m = /supercon-(\d+\.\d+\.\d+)/.exec(txt);
        if (m && !verNewer(m[1], APP_VERSION)) return;   // the same version deployed again
        UPD.web = m ? m[1] : 'new'; UPD.dismissed = false; renderUpdate();
      }).catch(function () { UPD.web = 'new'; renderUpdate(); });
    });
  })();

  function render() {
    renderChrome();
    var d = state.data;
    $('#main').hidden = !d || view !== 'progress';
    $('#candidates').hidden = !d || view !== 'candidates';
    if (!d) return;
    renderPipeline(d);
    renderCandidates(d);
    renderKpis(d);
    renderModels(d);
    renderStages(d);
    renderResults(d);
    renderActivity(d);
    renderGitHub();
    renderDetails(d);
    if (demo.built && view === 'demos') { syncControls(); kick(); }
    if (view === 'authors') renderAuthors();
    if (aiState.built) renderAIOurs();
  }

  function applyTheme() {
    if (theme === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
  }

  $('#btn-refresh').addEventListener('click', function () { refreshAll(); });
  $('#btn-theme').addEventListener('click', function () {
    theme = theme === 'system' ? 'light' : theme === 'light' ? 'dark' : 'system';
    store.set('theme', theme);
    applyTheme();
    renderChrome();
    kick();
    miniKick();
    xtDirty();
    xtKick();
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && state.checkedAt && Date.now() - state.checkedAt.getTime() > 60 * 1000) refreshAll();
  });

  $('#view-progress').addEventListener('click', function () { setView('progress'); });
  $('#view-candidates').addEventListener('click', function () { setView('candidates'); });
  $('#view-ai').addEventListener('click', function () { setView('ai'); });
  $('#view-demos').addEventListener('click', function () { setView('demos'); });
  $('#view-learn').addEventListener('click', function () { setView('learn'); });
  $('#view-papers').addEventListener('click', function () { setView('papers'); });
  $('#view-authors').addEventListener('click', function () { setView('authors'); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) kick(); });

  applyTheme();
  render();
  renderPhoneCard();
  setView(view);
  loadContent(false);
  loadBundled().then(function () { render(); return refreshAll(); });
  setInterval(refreshAll, REFRESH_MS);
  setInterval(function () { if (!state.busy) renderChrome(); }, 60 * 1000);
})();
</script>
