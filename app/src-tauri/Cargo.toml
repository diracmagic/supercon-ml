[package]
name = "supercon-progress"
version = "0.3.27"
description = "Live progress of the supercon-ml project"
authors = ["The supercon-ml project"]
license = "MIT"
repository = "https://github.com/diracmagic/supercon-ml"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
