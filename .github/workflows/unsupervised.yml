name: Unsupervised material representations

on:
  workflow_dispatch:
  push:
    branches: [codex/unsupervised-materials]
    paths:
      - 'ml/unsupervised.py'
      - 'ml/storm7.py'
      - 'ml/hurricane8.py'
      - 'tests/test_unsupervised.py'
      - 'tests/test_storm7.py'
      - 'tests/test_hurricane8.py'
      - '.github/workflows/unsupervised.yml'

permissions:
  contents: read

concurrency:
  group: unsupervised-materials
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  PYTHONHASHSEED: '0'

jobs:
  research:
    name: ${{ matrix.model }} report-only
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        model: [storm7, hurricane8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install research dependencies
        run: pip install -r ml/requirements.txt
      - name: Verify split isolation and numerical plumbing
        run: |
          python -m unittest discover -s tests -p 'test_unsupervised.py' -v
          python -m unittest discover -s tests -p 'test_storm7.py' -v
          python -m unittest discover -s tests -p 'test_hurricane8.py' -v
      - name: Restore pinned datasets and deterministic descriptors
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/supercon-data
          key: unsupervised-${{ matrix.model }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: supercon-cache-
      - name: Freeze real protocol before loading research targets
        run: |
          python ml/${{ matrix.model }}.py --protocol --output-dir "$RUNNER_TEMP/${{ matrix.model }}-protocol"
          cmp "$RUNNER_TEMP/${{ matrix.model }}-protocol/protocol.json" "results/validation/unsupervised-protocols-v1-final/${{ matrix.model }}/protocol.json"
      - name: Synthetic smoke, not scientific evidence
        run: python ml/${{ matrix.model }}.py --smoke --output-dir "$RUNNER_TEMP/${{ matrix.model }}-smoke"
      - name: Real fixed-cohort experiment, no model release
        run: python ml/${{ matrix.model }}.py
      - name: Preserve complete and partial research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unsupervised-${{ matrix.model }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/${{ matrix.model }}/
            ${{ runner.temp }}/${{ matrix.model }}-protocol/
            ${{ runner.temp }}/${{ matrix.model }}-smoke/
          if-no-files-found: warn
          retention-days: 30
