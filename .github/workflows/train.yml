name: Train

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ml/**'
      - '.github/workflows/train.yml'

permissions:
  contents: write

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  baseline:
    name: Electron-phonon baseline
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      - name: Cache downloaded datasets
        uses: actions/cache@v4
        with:
          path: ~/.cache/supercon-data
          key: supercon-data-v1

      - name: Download data and train baselines
        run: python ml/pipeline.py baseline

      - name: Commit results and progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results progress
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Update baseline results (run ${GITHUB_RUN_NUMBER})"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
