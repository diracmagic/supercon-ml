name: Train

on:
  workflow_dispatch:
    inputs:
      stages:
        description: Stages to run, in order (any of baseline foundation search)
        default: search
  push:
    branches: [main]
    paths:
      - 'ml/**'

permissions:
  contents: write

concurrency:
  group: train
  cancel-in-progress: false

env:
  # pushes to ml/ run the AI-designed model search; earlier stages can be re-run by hand
  STAGES: ${{ inputs.stages || 'search' }}

jobs:
  electron-phonon:
    name: Electron-phonon models
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r ml/requirements.txt mace-torch

      - name: Restore datasets and descriptors
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/supercon-data
            ~/.cache/mace
          key: supercon-cache-${{ github.run_id }}
          restore-keys: supercon-cache-

      - name: Baseline (composition and structure features)
        if: contains(env.STAGES, 'baseline')
        run: python ml/pipeline.py baseline

      - name: Foundation model (MACE-MP-0 descriptors)
        if: contains(env.STAGES, 'foundation')
        run: python ml/pipeline.py foundation

      - name: Storm, the AI-designed model (search round)
        if: contains(env.STAGES, 'search')
        run: python ml/pipeline.py search

      - name: Commit results and progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results progress
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Update training results (run ${GITHUB_RUN_NUMBER})"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 10
            done
          fi
