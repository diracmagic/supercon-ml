name: Train

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ml/**'
      - '.github/workflows/train.yml'

permissions:
  contents: write

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  electron-phonon:
    name: Electron-phonon models
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r ml/requirements.txt mace-torch

      - name: Restore datasets and descriptors
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/supercon-data
            ~/.cache/mace
          key: supercon-cache-${{ github.run_id }}
          restore-keys: supercon-cache-

      - name: Baseline (composition and structure features)
        run: python ml/pipeline.py baseline

      - name: Foundation model (MACE-MP-0 descriptors)
        run: python ml/pipeline.py foundation

      - name: Commit results and progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results progress
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Update training results (run ${GITHUB_RUN_NUMBER})"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
