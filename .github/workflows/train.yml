name: Train

on:
  workflow_dispatch:
    inputs:
      stages:
        description: Stages to run (including report-only hurricane6); screen uses candidate-safe cross-fitting
        default: screen hurricane6
  push:
    branches: [main, codex/screening-validation]
    paths:
      - 'ml/**'
      - '.github/workflows/train.yml'

permissions:
  contents: write

concurrency:
  group: train
  cancel-in-progress: false

env:
  # A push to ml/ trains only when its commit message contains [train], so a change spread over several commits
  # runs once; it then runs the current rounds. Earlier stages can be re-run by hand.
  STAGES: ${{ inputs.stages || 'screen hurricane6' }}
  # Fixed string hashing, so that the order of a set can never change the results from one run to the next.
  PYTHONHASHSEED: '0'
  SCREEN_PHONONS: '1'
  SCREEN_PHONON_TOP: '3'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'

jobs:
  models:
    name: AI-designed models
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[train]')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: |
          if [[ " $STAGES " == *" foundation "* || " $STAGES " == *" search1 "* || " $STAGES " == *" hurricane6 "* || " $STAGES " == *" screen "* ]]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
            pip install -r ml/requirements.txt mace-torch
          else
            pip install -r ml/requirements.txt
          fi
          if [[ " $STAGES " == *" gnn "* || " $STAGES " == *" gnn2 "* || " $STAGES " == *" gnn2final "* || " $STAGES " == *" storm4 "* || " $STAGES " == *" screen "* || " $STAGES " == *" gnnsmoke "* ]]; then
            pip install "jax[cpu]" optax
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify before training
        run: |
          python -m unittest discover -s tests -v
          node --test tests/test_app_candidates.mjs
          python ml/negative_data.py --validate data/hosono2015_negatives.json

      - name: Restore datasets and descriptors
        id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/supercon-data
            ~/.cache/mace
          # Cache entries are immutable; a rerun must be able to save its new batches.
          key: supercon-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: supercon-cache-

      - name: Baseline (composition and structure features)
        if: contains(format(' {0} ', env.STAGES), ' baseline ')
        run: python ml/pipeline.py baseline

      - name: Foundation model (MACE-MP-0 descriptors)
        if: contains(format(' {0} ', env.STAGES), ' foundation ')
        run: python ml/pipeline.py foundation

      - name: Storm, search round 1
        if: contains(format(' {0} ', env.STAGES), ' search1 ')
        run: python ml/pipeline.py search1

      - name: Storm, search round 2
        if: contains(format(' {0} ', env.STAGES), ' search ')
        run: python ml/pipeline.py search

      - name: Storm, round 3 (calibration to measured Tc)
        if: contains(format(' {0} ', env.STAGES), ' storm3 ')
        run: python ml/pipeline.py storm3

      - name: Hurricane, unconventional superconductors (round 1)
        if: success() && contains(format(' {0} ', env.STAGES), ' hurricane ')
        run: python ml/pipeline.py hurricane

      - name: Hurricane, round 2 (new designs against Hurricane 1.0)
        if: success() && contains(format(' {0} ', env.STAGES), ' hurricane2 ')
        run: python ml/pipeline.py hurricane2

      - name: Hurricane, round 3 (fewer false alarms outside the training data)
        if: success() && contains(format(' {0} ', env.STAGES), ' hurricane3 ')
        run: python ml/pipeline.py hurricane3

      - name: Hurricane, round 4 (not known instead of unlikely outside the training data)
        if: success() && contains(format(' {0} ', env.STAGES), ' hurricane4 ')
        run: python ml/pipeline.py hurricane4

      - name: Hurricane, round 5 (the parent compound, and what DFT says about its electrons)
        if: success() && contains(format(' {0} ', env.STAGES), ' hurricane5 ')
        run: python ml/pipeline.py hurricane5

      - name: Radar, the router between Storm and Hurricane (round 1)
        if: success() && contains(format(' {0} ', env.STAGES), ' radar ')
        run: python ml/pipeline.py radar

      - name: Graph neural network, quick check on a small subset (writes nothing)
        if: contains(format(' {0} ', env.STAGES), ' gnnsmoke ')
        run: GNN_SMOKE=1 python ml/pipeline.py gnn

      - name: Graph neural network (round 1, same folds as Storm)
        if: success() && contains(format(' {0} ', env.STAGES), ' gnn ')
        run: python ml/pipeline.py gnn

      - name: Graph neural network, round 2 (AI-designed search, same folds)
        if: success() && contains(format(' {0} ', env.STAGES), ' gnn2 ')
        run: python ml/pipeline.py gnn2

      - name: Graph neural network, round 2 final check (the selected design trained like version 1.0)
        if: success() && contains(format(' {0} ', env.STAGES), ' gnn2final ')
        run: python ml/pipeline.py gnn2final

      - name: Storm, round 4 (Storm 1.0 and the graph network together)
        if: success() && contains(format(' {0} ', env.STAGES), ' storm4 ')
        run: python ml/pipeline.py storm4

      - name: Storm, round 5 (a 90% range around every Storm 4.0 prediction)
        if: success() && contains(format(' {0} ', env.STAGES), ' storm5 ')
        run: python ml/pipeline.py storm5

      - name: Screening, the current round (candidates found by our models, only our own finds, with their structures)
        id: screening
        if: success() && contains(format(' {0} ', env.STAGES), ' screen ')
        run: python ml/pipeline.py screen

      - name: Preserve completed screening before the H6 experiment
        if: always() && steps.screening.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screening-results-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            results/
            progress/
          if-no-files-found: error
          retention-days: 14

      - name: Hurricane, round 6 protocol and plumbing
        if: success() && contains(format(' {0} ', env.STAGES), ' hurricane6 ')
        run: |
          python ml/hurricane6.py --protocol
          python ml/hurricane6.py --smoke --output-dir /tmp/hurricane6-smoke
          python ml/hurricane6.py --prepare-only

      - name: Hurricane, round 6 (report-only MACE-MP-0 LOFO experiment)
        if: success() && contains(format(' {0} ', env.STAGES), ' hurricane6 ')
        run: python ml/pipeline.py hurricane6

      - name: Check incremental descriptor caches before saving
        id: cache-integrity
        if: always() && steps.data-cache.outcome == 'success'
        run: python .github/scripts/validate_descriptor_cache.py --cache-dir ~/.cache/supercon-data

      - name: Save completed datasets and descriptor batches even if training fails
        if: always() && steps.cache-integrity.outcome == 'success' && steps.data-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/supercon-data
            ~/.cache/mace
          key: ${{ steps.data-cache.outputs.cache-primary-key }}

      - name: Preserve results even when training or publishing fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-results-${{ github.run_number }}
          path: |
            results/
            progress/
          retention-days: 14

      - name: Commit results and progress
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results progress
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Update training results (run ${GITHUB_RUN_NUMBER})"
            published=false
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                published=true
                break
              fi
              sleep 10
            done
            if [[ "$published" != true ]]; then
              echo "Results are preserved as an artifact, but publishing failed after 3 attempts" >&2
              exit 1
            fi
          fi
