name: Checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install numpy pandas scikit-learn ase pymatgen
      - run: python -m unittest discover -s tests -v
      - run: python tools/normal_state_collection/verify_bundle.py
      - run: python tools/normal_state_collection/batch2/verify_bundle.py
      - run: python tools/normal_state_collection/batch3/verify_bundle.py
      - run: node --test tests/test_app_candidates.mjs
      - run: python ml/negative_data.py --validate data/hosono2015_negatives.json
