name: Papers

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'feed/**'
      - '.github/workflows/papers.yml'

permissions:
  contents: write

concurrency:
  group: papers
  cancel-in-progress: false

jobs:
  feed:
    name: New superconductivity papers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch arXiv, Nature, Science, PRL and PRX
        run: python feed/papers.py

      - name: Commit the feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add progress/papers.json
          if git diff --cached --quiet; then
            echo "No new papers"
          else
            git commit -m "Update paper feed"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 10
            done
          fi
