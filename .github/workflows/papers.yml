name: Papers

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'feed/**'
      - '.github/workflows/papers.yml'

permissions:
  contents: write

concurrency:
  group: papers
  cancel-in-progress: false

jobs:
  feed:
    name: New superconductivity papers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch arXiv, Nature, Science, PRL and PRX
        run: python feed/papers.py

      - name: Commit the feed
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add progress/papers.json
          if git diff --cached --quiet; then
            echo "No new papers"
          else
            git commit -m "Update paper feed"
            published=false
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                published=true
                break
              fi
              sleep 10
            done
            if [[ "$published" != true ]]; then
              echo "Paper feed was fetched, but publishing failed after 3 attempts" >&2
              exit 1
            fi
          fi

      # A daily curation task proposes "Recent advances" on the branch claude/news-curation (never on main).
      # Only entries that pass the app's content schema and are new to main are added; see feed/sync_curation.py.
      - name: Merge curated advances
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git fetch --depth=1 origin claude/news-curation; then
            echo "No curation branch yet"
            exit 0
          fi
          git show FETCH_HEAD:progress/content.json > "$RUNNER_TEMP/curated.json"
          for i in 1 2 3; do
            git fetch --depth=1 origin main && git reset --hard FETCH_HEAD
            python feed/sync_curation.py progress/content.json "$RUNNER_TEMP/curated.json"
            if git diff --quiet -- progress/content.json; then
              exit 0
            fi
            git add progress/content.json
            git commit -m "Add curated advances"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done
          echo "Curated advances were checked, but publishing failed after 3 attempts" >&2
          exit 1
